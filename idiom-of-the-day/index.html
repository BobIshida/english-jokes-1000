</style></head><body><header><nav><a href="../">← シリーズ一覧</a> / Idiom of the Day</nav><h1>Idiom of the Day<span>.</span></h1><p>イディオムの意味と面白さを、短い会話で学ぼう。</p></header><main class="layout"><aside aria-label="表現を探す"><label for="search">番号・表現・意味で検索</label><input id="search" type="search" placeholder="例：001、on the fence"><span id="count" role="status"></span><div id="list"></div><p id="empty" hidden>該当する表現がありません。</p></aside><article class="card"><div class="eyebrow" id="number"></div><h2 id="word"></h2><span id="tone" hidden></span><div id="player" class="player"></div><small><a id="direct" target="_blank" rel="noopener noreferrer">動画を別画面で見る ↗</a></small><nav class="controls" aria-label="前後の表現"><button id="prev">← 前の表現</button><button id="next">次の表現 →</button></nav><div id="scenes"></div></article></main><footer>Idiom of the Day · 001–100　｜　<a href="../">シリーズ一覧に戻る</a></footer><script>
const items=[{"video": "Ot395-28lH4", "number": 1, "word": "on the fence", "tone": "", "media": "media/001.mp4", "scenes": [{"label": "TODAY'S IDIOM", "en": "on the fence", "jp": "決めかねている"}, {"label": "A LITTLE CONVERSATION / A", "en": "Have you decided whether to join the gym?", "jp": "ジムに入るか決めた？"}, {"label": "A LITTLE CONVERSATION / B", "en": "I'm still on the fence.", "jp": "まだ迷ってる。"}, {"label": "A LITTLE CONVERSATION / A", "en": "Climbing down would be a good first workout.", "jp": "そこから降りるのが最初のいい運動になるね。"}, {"label": "WHY IT IS FUNNY", "en": "On the fence means undecided. Apparently, deciding is now a workout.", "jp": "「迷っている」を\n「フェンスの上にいる」と解釈。\n降りるだけで、最初の運動！"}]}, {"video": "07Nu520tb7Q", "number": 2, "word": "under the weather", "tone": "", "media": "media/002.mp4", "scenes": [{"label": "TODAY'S IDIOM", "en": "under the weather", "jp": "体調がよくない"}, {"label": "A LITTLE CONVERSATION / A", "en": "I'm feeling a bit under the weather.", "jp": "ちょっと体調が悪いんだ。"}, {"label": "A LITTLE CONVERSATION / B", "en": "Take my umbrella.", "jp": "僕の傘を使って。"}, {"label": "A LITTLE CONVERSATION / A", "en": "I was hoping for soup.", "jp": "スープを期待してたんだけど。"}, {"label": "WHY IT IS FUNNY", "en": "Under the weather means feeling unwell. An umbrella won't help this time.", "jp": "「体調が悪い」のに、傘を差し出す。\n欲しかったのは、\n雨対策より温かいスープ。"}]}, {"video": "0b-4N-tzL2I", "number": 3, "word": "the elephant in the room", "tone": "", "media": "media/003.mp4", "scenes": [{"label": "TODAY'S IDIOM", "en": "the elephant in the room", "jp": "皆が気づいているのに避けている問題"}, {"label": "A LITTLE CONVERSATION / A", "en": "Let's address the elephant in the room. Nobody reads our reports.", "jp": "皆が避けている問題を話そう。誰も報告書を読んでいない。"}, {"label": "A LITTLE CONVERSATION / B", "en": "Agreed. I'll write a report about it.", "jp": "賛成。その件の報告書を書きます。"}, {"label": "WHY IT IS FUNNY", "en": "The elephant in the room is an obvious problem people avoid discussing. Another unread report won't fix it.", "jp": "誰も読まない報告書が問題。\n解決策も、また報告書！\n同じ問題を増やす矛盾がオチ。"}]}, {"video": "HjJQN7rQ5Pc", "number": 4, "word": "burn the candle at both ends", "tone": "", "media": "media/004.mp4", "scenes": [{"label": "TODAY'S IDIOM", "en": "burn the candle at both ends", "jp": "朝早くから夜遅くまで無理をする"}, {"label": "A LITTLE CONVERSATION / A", "en": "You're burning the candle at both ends.", "jp": "朝から晩まで無理しすぎだよ。"}, {"label": "A LITTLE CONVERSATION / B", "en": "I work late and get up early to meditate.", "jp": "夜遅くまで働いて、瞑想のために早起きするんだ。"}, {"label": "A LITTLE CONVERSATION / A", "en": "Have you tried sleeping? It's meditation with better hours.", "jp": "寝てみたら？もっと長時間できる瞑想だよ。"}, {"label": "WHY IT IS FUNNY", "en": "Burning the candle at both ends means doing too much with too little rest. Even relaxation needs a bedtime.", "jp": "休むための早起きで、さらに寝不足。\nリラックスより睡眠が先！"}]}, {"video": "g5GPPWtQhYY", "number": 5, "word": "back to the drawing board", "tone": "", "media": "media/005.mp4", "scenes": [{"label": "TODAY'S IDIOM", "en": "back to the drawing board", "jp": "失敗して計画を練り直す"}, {"label": "A LITTLE CONVERSATION / A", "en": "Our app crashes every time we open it. Back to the drawing board.", "jp": "アプリを開くたびに落ちる。計画を練り直そう。"}, {"label": "A LITTLE CONVERSATION / B", "en": "I'll open the design app.", "jp": "設計用アプリを開きます。"}, {"label": "A LITTLE CONVERSATION / A", "en": "That IS the app.", "jp": "そのアプリのことだよ。"}, {"label": "WHY IT IS FUNNY", "en": "Back to the drawing board means rethink a failed plan. Even their fresh start needs fixing.", "jp": "計画を練り直すためのアプリが、\nまさに故障しているアプリ！"}]}, {"video": "zOh8o4QFkxE", "number": 6, "word": "bark up the wrong tree", "tone": "", "media": "media/006.mp4", "scenes": [{"label": "TODAY'S IDIOM", "en": "bark up the wrong tree", "jp": "見当違いの相手や方法に当たる"}, {"label": "A LITTLE CONVERSATION / A", "en": "Did you eat my sandwich?", "jp": "私のサンドイッチ食べた？"}, {"label": "A LITTLE CONVERSATION / B", "en": "You're barking up the wrong tree. Ask the dog.", "jp": "疑う相手が違うよ。犬に聞いて。"}, {"label": "A LITTLE CONVERSATION / A", "en": "The dog doesn't put plates in the dishwasher.", "jp": "犬は皿を食洗機に入れないよ。"}, {"label": "WHY IT IS FUNNY", "en": "Barking up the wrong tree means looking in the wrong place for an answer. The dishwasher tells a different story.", "jp": "疑う相手が違う、と犬のせいに。\nでも皿の後片付けは人間の仕業。"}]}, {"video": "CCzVDLWLiYk", "number": 7, "word": "a silver lining", "tone": "", "media": "media/007.mp4", "scenes": [{"label": "TODAY'S IDIOM", "en": "a silver lining", "jp": "悪い状況の中の良い面"}, {"label": "A LITTLE CONVERSATION / A", "en": "The internet is down. Is there a silver lining?", "jp": "ネットが止まった。何かいい面はある？"}, {"label": "A LITTLE CONVERSATION / B", "en": "No video meetings.", "jp": "ビデオ会議がない。"}, {"label": "A LITTLE CONVERSATION / A", "en": "It's working again.", "jp": "復旧したよ。"}, {"label": "A LITTLE CONVERSATION / B", "en": "Please stop bringing me bad news.", "jp": "悪い知らせを持ってこないで。"}, {"label": "WHY IT IS FUNNY", "en": "A silver lining is something good in a bad situation. Unless you actually wanted that meeting.", "jp": "会議がなくなるのが「良い面」。\nネット復旧が悪い知らせに逆転。"}]}, {"video": "bDnf--F5J9M", "number": 8, "word": "out of the woods", "tone": "", "media": "media/008.mp4", "scenes": [{"label": "TODAY'S IDIOM", "en": "out of the woods", "jp": "危機や困難を脱して"}, {"label": "A LITTLE CONVERSATION / A", "en": "The software passed every test. We're out of the woods!", "jp": "ソフトが全テストに合格。危機は脱した！"}, {"label": "A LITTLE CONVERSATION / B", "en": "Great. Now let's see what happens when a customer uses it.", "jp": "よかった。ではお客様が使ったらどうなるか見てみよう。"}, {"label": "WHY IT IS FUNNY", "en": "Out of the woods means past the danger. Real customers may have other plans.", "jp": "危機を脱した、と安心したけれど、\n本当の利用はこれから。"}]}, {"video": "2xcAhjBH-5E", "number": 9, "word": "read between the lines", "tone": "", "media": "media/009.mp4", "scenes": [{"label": "TODAY'S IDIOM", "en": "read between the lines", "jp": "言外の意味を読み取る"}, {"label": "A LITTLE CONVERSATION / A", "en": "The invitation says, 'Come whenever you like.'", "jp": "招待状に『好きな時に来て』とある。"}, {"label": "A LITTLE CONVERSATION / B", "en": "Read between the lines. Dinner is at seven.", "jp": "言外の意味を読んで。夕食は7時だよ。"}, {"label": "A LITTLE CONVERSATION / A", "en": "Then why didn't they put THAT on a line?", "jp": "じゃあ、なぜそれを一行書いてくれないの？"}, {"label": "WHY IT IS FUNNY", "en": "Read between the lines means understand what isn't stated directly. Sometimes a clear sentence would help.", "jp": "言外の意味を読めと言われても、\n大事なら直接書いてほしい！"}]}, {"video": "nO23AOHJXWo", "number": 10, "word": "move the goalposts", "tone": "", "media": "media/010.mp4", "scenes": [{"label": "TODAY'S IDIOM", "en": "move the goalposts", "jp": "途中で達成条件を不公平に変える"}, {"label": "A LITTLE CONVERSATION / A", "en": "You promised a bonus if I sold ten subscriptions. I sold ten.", "jp": "契約を10件取ればボーナスと言いましたよね。10件取りました。"}, {"label": "A LITTLE CONVERSATION / B", "en": "Now you need twenty.", "jp": "今は20件必要だ。"}, {"label": "A LITTLE CONVERSATION / A", "en": "Stop moving the goalposts. I'm in sales, not a moving company.", "jp": "達成条件を変えないで。私は営業で、引っ越し業者じゃありません。"}, {"label": "WHY IT IS FUNNY", "en": "Move the goalposts means unfairly change the requirements. The target keeps moving, but the bonus doesn't get closer.", "jp": "途中で条件を変える上司に抗議。\nゴールの移動を引っ越しに見立てます。"}]}, {"video": "NoUzckmz-8Y", "number": 11, "word": "bite the bullet", "tone": "", "media": "media/011.mp4", "scenes": [{"label": "TODAY'S IDIOM", "en": "bite the bullet", "jp": "嫌なことを覚悟して実行する"}, {"label": "A LITTLE CONVERSATION / A", "en": "I finally bit the bullet and cancelled my gym membership.", "jp": "ついに思い切ってジムを退会した。"}, {"label": "A LITTLE CONVERSATION / B", "en": "Was it difficult?", "jp": "大変だった？"}, {"label": "A LITTLE CONVERSATION / A", "en": "Yes. I had to go there for the first time.", "jp": "うん。初めてそこに行かなきゃならなかった。"}, {"label": "WHY IT IS FUNNY", "en": "Bite the bullet means face an unpleasant task. His first gym visit was also his last.", "jp": "退会する覚悟は決めたけれど、\nジムへの来訪自体が初めて。"}]}, {"video": "n1h9zfFzqEs", "number": 12, "word": "throw in the towel", "tone": "", "media": "media/012.mp4", "scenes": [{"label": "TODAY'S IDIOM", "en": "throw in the towel", "jp": "諦めて降参する"}, {"label": "A LITTLE CONVERSATION / A", "en": "I nearly threw in the towel at my first yoga class.", "jp": "初めてのヨガで、もう諦めかけた。"}, {"label": "A LITTLE CONVERSATION / B", "en": "What kept you going?", "jp": "何で続けられたの？"}, {"label": "A LITTLE CONVERSATION / A", "en": "I couldn't get up from the floor.", "jp": "床から起き上がれなかったんだ。"}, {"label": "WHY IT IS FUNNY", "en": "Throw in the towel means give up. Staying on the mat wasn't exactly determination.", "jp": "続けた理由は根性ではなく、\n起き上がれなかったから。"}]}, {"video": "hC-u_E6UoD4", "number": 13, "word": "the tip of the iceberg", "tone": "", "media": "media/013.mp4", "scenes": [{"label": "TODAY'S IDIOM", "en": "the tip of the iceberg", "jp": "問題のごく一部"}, {"label": "A LITTLE CONVERSATION / A", "en": "I found three unpaid bills. Is that the tip of the iceberg?", "jp": "未払いの請求書を3通見つけた。氷山の一角？"}, {"label": "A LITTLE CONVERSATION / B", "en": "No. Those are the reminders.", "jp": "違う。それは督促状。"}, {"label": "A LITTLE CONVERSATION / A", "en": "So the iceberg sends mail now.", "jp": "氷山は郵便まで送ってくるんだね。"}, {"label": "WHY IT IS FUNNY", "en": "The tip of the iceberg is the small visible part of a larger problem. These bills have a backstory.", "jp": "見つけた3通は最初の請求ですらない。\n見えない問題の大きさを想像させます。"}]}, {"video": "9iinXAoxKuQ", "number": 14, "word": "a blessing in disguise", "tone": "", "media": "media/014.mp4", "scenes": [{"label": "TODAY'S IDIOM", "en": "a blessing in disguise", "jp": "不運に見えて実は幸運なこと"}, {"label": "A LITTLE CONVERSATION / A", "en": "Missing that train was a blessing in disguise.", "jp": "電車を逃したのは、結果的によかった。"}, {"label": "A LITTLE CONVERSATION / B", "en": "Did you meet someone special?", "jp": "素敵な人に会えたの？"}, {"label": "A LITTLE CONVERSATION / A", "en": "No. I missed the meeting about reducing meetings.", "jp": "いや、会議を減らすための会議に出ずに済んだ。"}, {"label": "WHY IT IS FUNNY", "en": "A blessing in disguise seems bad at first but turns out well. One less meeting already!", "jp": "電車を逃す不運が、会議を減らす幸運に。\n会議の目的を欠席で達成！"}]}, {"video": "OapbyCqVYWA", "number": 15, "word": "walk on eggshells", "tone": "", "media": "media/015.mp4", "scenes": [{"label": "TODAY'S IDIOM", "en": "walk on eggshells", "jp": "相手を怒らせないよう慎重に振る舞う"}, {"label": "A LITTLE CONVERSATION / A", "en": "We walk on eggshells around the new chef.", "jp": "新しいシェフには気を使うよ。"}, {"label": "A LITTLE CONVERSATION / B", "en": "Is he that sensitive?", "jp": "そんなに繊細なの？"}, {"label": "A LITTLE CONVERSATION / A", "en": "Yes. Yesterday I called his foam bubbles.", "jp": "うん。昨日、彼の泡料理を「泡」と呼んじゃった。"}, {"label": "WHY IT IS FUNNY", "en": "Walk on eggshells means act very carefully to avoid upsetting someone. Apparently, bubbles need a fancier name.", "jp": "高級な料理名で呼ばないと怒られる。\nただの「泡」が禁句という皮肉。"}]}, {"video": "Zz7JWVNQR7U", "number": 16, "word": "rock the boat", "tone": "", "media": "media/016.mp4", "scenes": [{"label": "TODAY'S IDIOM", "en": "rock the boat", "jp": "波風を立てる"}, {"label": "A LITTLE CONVERSATION / A", "en": "Don't rock the boat at the budget meeting.", "jp": "予算会議では波風を立てないで。"}, {"label": "A LITTLE CONVERSATION / B", "en": "I only asked why we bought a boat.", "jp": "なぜ船を買ったのか聞いただけだよ。"}, {"label": "A LITTLE CONVERSATION / A", "en": "Exactly. The director loves that boat.", "jp": "そう。社長のお気に入りなんだ。"}, {"label": "WHY IT IS FUNNY", "en": "Rock the boat means disturb a situation. Here, the awkward question is about an actual boat.", "jp": "「波風を立てる」と本物の船を重ね、\n無駄遣いを追及できない職場を皮肉に。"}]}, {"video": "yLxcwJ8eb4A", "number": 17, "word": "miss the boat", "tone": "", "media": "media/017.mp4", "scenes": [{"label": "TODAY'S IDIOM", "en": "miss the boat", "jp": "好機を逃す"}, {"label": "A LITTLE CONVERSATION / A", "en": "Did I miss the boat on those concert tickets?", "jp": "あのコンサートの券、買う機会を逃した？"}, {"label": "A LITTLE CONVERSATION / B", "en": "Yes. They sold out while you compared the booking fees.", "jp": "うん。手数料を比較してる間に売り切れた。"}, {"label": "A LITTLE CONVERSATION / A", "en": "At least I saved the entire ticket price.", "jp": "少なくともチケット代は全額節約できた。"}, {"label": "WHY IT IS FUNNY", "en": "Miss the boat means lose an opportunity. His bargain hunting saved more money than intended.", "jp": "安く買おうとして買えずじまい。\n全額節約という負け惜しみです。"}]}, {"video": "mfFmshUDA6w", "number": 18, "word": "in the same boat", "tone": "", "media": "media/018.mp4", "scenes": [{"label": "TODAY'S IDIOM", "en": "in the same boat", "jp": "同じ困難な状況にある"}, {"label": "A LITTLE CONVERSATION / A", "en": "Nobody understands the new printer. We're all in the same boat.", "jp": "誰も新しいプリンターを使えない。同じ状況だね。"}, {"label": "A LITTLE CONVERSATION / B", "en": "Good. Does the boat have a manual?", "jp": "よかった。その船には説明書がある？"}, {"label": "A LITTLE CONVERSATION / A", "en": "Yes. We need to print it.", "jp": "ある。印刷しなきゃ。"}, {"label": "WHY IT IS FUNNY", "en": "In the same boat means sharing a difficult situation. Even the instructions depend on the broken plan.", "jp": "全員困っているのに、解決の説明書も\n使えないプリンター頼みという堂々巡り。"}]}, {"video": "Fx_GfEG46Jw", "number": 19, "word": "burn your bridges", "tone": "", "media": "media/019.mp4", "scenes": [{"label": "TODAY'S IDIOM", "en": "burn your bridges", "jp": "後戻りできないよう関係を断つ"}, {"label": "A LITTLE CONVERSATION / A", "en": "Don't burn your bridges when you quit.", "jp": "退職するとき関係を壊さないで。"}, {"label": "A LITTLE CONVERSATION / B", "en": "I sent everyone a thank-you cake.", "jp": "全員にお礼のケーキを送ったよ。"}, {"label": "A LITTLE CONVERSATION / A", "en": "Lovely. Why does it say finally free?", "jp": "いいね。なぜ「やっと自由だ」と書いてあるの？"}, {"label": "WHY IT IS FUNNY", "en": "Burn your bridges means damage relationships you may need later. The cake was polite. The icing wasn't.", "jp": "お礼のケーキは丁寧でも、\n本音が文字に出て関係を台無しに。"}]}, {"video": "JIdiwIbgKkg", "number": 20, "word": "cross that bridge when you come to it", "tone": "", "media": "media/020.mp4", "scenes": [{"label": "TODAY'S IDIOM", "en": "cross that bridge when you come to it", "jp": "その問題は必要になってから考える"}, {"label": "A LITTLE CONVERSATION / A", "en": "What if our bakery becomes too popular?", "jp": "パン屋が人気になりすぎたらどうしよう？"}, {"label": "A LITTLE be a tough act to follow", "tone": "", "media": "media/098.mp4", "scenes": [{"label": "TODAY'S IDIOM", "en": "be a tough act to follow", "jp": "次の人が並ぶのが難しいほど優れている"}, {"label": "A LITTLE CONVERSATION / A", "en": "The previous speaker is a tough act to follow.", "jp": "前の発表者がすごくて、次は大変だね。"}, {"label": "A LITTLE CONVERSATION / B", "en": "What did she do?", "jp": "何をしたの？"}, {"label": "A LITTLE CONVERSATION / A", "en": "Finished ten minutes early. The audience adored her.", "jp": "10分早く終わった。大人気だった。"}, {"label": "WHY IT IS FUNNY", "en": "A tough act to follow sets a high standard. Her greatest talent was giving everyone their time back.", "jp": "名演説かと思ったら、\n早く終わることが一番の魅力でした。"}]}, {"video": "weNwYcP2v4g", "number": 99, "word": "the writing is on the wall", "tone": "", "media": "media/099.mp4", "scenes": [{"label": "TODAY'S IDIOM", "en": "the writing is on the wall", "jp": "悪い結末の兆しが明らかだ"}, {"label": "A LITTLE CONVERSATION / A", "en": "The writing is on the wall for this restaurant.", "jp": "この店、先行きが怪しいね。"}, {"label": "A LITTLE CONVERSATION / B", "en": "What makes you say that?", "jp": "どうしてそう思うの？"}, {"label": "A LITTLE CONVERSATION / A", "en": "The daily special is yesterday's daily special.", "jp": "今日のおすすめが、昨日のおすすめなんだ。"}, {"label": "WHY IT IS FUNNY", "en": "The writing is on the wall means there are clear signs of trouble ahead. Today's menu isn't very reassuring.", "jp": "危機の兆しを指す表現。\nおすすめが昨日の残りに見えて不安になります。"}]}, {"video": "gaIvE35qmWM", "number": 100, "word": "grasp at straws", "tone": "", "media": "media/100.mp4", "scenes": [{"label": "TODAY'S IDIOM", "en": "grasp at straws", "jp": "わずかな可能性に必死にすがる"}, {"label": "A LITTLE CONVERSATION / A", "en": "You're grasping at straws if you think that plant will recover.", "jp": "その植物が復活すると思うのは、わらにもすがる思いだね。"}, {"label": "A LITTLE CONVERSATION / B", "en": "But it still looks green.", "jp": "でも緑色だよ。"}, {"label": "A LITTLE CONVERSATION / A", "en": "That's the pot.", "jp": "それは鉢。"}, {"label": "WHY IT IS FUNNY", "en": "Grasp at straws means cling to a very weak hope. His evidence isn't part of the plant.", "jp": "復活の根拠にした緑色が、\n植物ではなく鉢だったという落差。"}]}];const el=id=>document.getElementById(id);let current=items[0];
function list(){const q=el('search').value.trim().toLowerCase().replace(/^#/,'');const found=items.filter(x=>!q||(/^\d+$/.test(q)?x.number===Number(q):[x.word,x.tone,...x.scenes.map(s=>s.jp)].join(' ').toLowerCase().includes(q)));el('count').textContent=`${found.length} / ${items.length}件`;el('empty').hidden=!!found.length;el('list').replaceChildren(...found.map(x=>{const b=document.createElement('button');b.textContent=`${String(x.number).padStart(3,'0')} ${x.word}`;b.setAttribute('aria-current',String(x===current));b.onclick=()=>choose(x.number,true);return b;}));}
function choose(n,update=false){current=items.find(x=>x.number===n)||items[0];el('word').textContent=current.word;el('tone').textContent=current.tone;el('number').textContent=`EXPRESSION ${String(current.number).padStart(3,'0')} / ${items.length}`;el('direct').href=current.video?`https://www.youtube.com/shorts/${current.video}`:current.media;el('direct').textContent=current.video?'YouTube Shortsで見る ↗':'動画を別画面で見る ↗';el('prev').disabled=current.number===1;el('next').disabled=current.number===items.length;el('scenes').replaceChildren(...current.scenes.map((s,i)=>{const section=document.createElement('section');const neutral=s.label.includes('NEUTRAL');const meaning=s.label==='THE MEANING'||s.label==='WHEN TO USE IT';section.className='scene'+(neutral?' neutral':meaning?' meaning':'');const h=document.createElement('h3');h.textContent=s.label==='THE DIFFERENCE'?'意味の違い':s.label.includes('FUNNY')?'笑いどころ':meaning?'意味・使い方':i===0?'今回の表現':s.label.includes(' / ')?s.label.split(' / ').pop()+' のセリフ':s.label;const en=document.createElement('p');en.lang='en';en.textContent=s.en;const jp=document.createElement('p');jp.className='jp';jp.textContent=s.jp;section.append(h,en,jp);return section;}));const b=document.createElement('button');b.textContent=current.video?'YouTubeプレーヤーを表示':'▶ 動画を再生';b.onclick=()=>{if(current.video){const f=document.createElement('iframe');f.title=current.word;f.src=`https://www.youtube-nocookie.com/embed/${current.video}?autoplay=0&playsinline=1&loop=1&playlist=${current.video}`;f.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';f.allowFullscreen=true;f.referrerPolicy='strict-origin-when-cross-origin';el('player').replaceChildren(f);return;}const v=document.createElement('video');v.controls=true;v.loop=true;v.playsInline=true;v.src=current.media;v.setAttribute('aria-label',current.word);el('player').replaceChildren(v);v.play().catch(()=>{});};el('player').replaceChildren(b);if(current.video)b.onclick();if(update)history.pushState(null,'',`#expression-${current.number}`);list();}
el('search').oninput=list;el('prev').onclick=()=>choose(current.number-1,true);el('next').onclick=()=>choose(current.number+1,true);function fromHash(){choose(Number(location.hash.match(/^#expression-(\d+)$/)?.[1])||1);}addEventListener('popstate',fromHash);addEventListener('hashchange',fromHash);fromHash();
</script></body></html>
