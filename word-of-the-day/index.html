s we don't own."}], "translation": ["予備電池を買ったのは賢明だった？", "うん。持ってない機器にも備えられた。"], "explanation": "prudent は「先を考えて慎重な」。予備電池を十分に買い、持っていない機器にも備えられる状態に。慎重な準備を通り越し、実際の必要性より備蓄が先行しているのがオチです。", "video": "", "media": "media/word-362.mp4"}, {"number": 363, "word": "selfless", "meaning": "自分より他人を大切にする", "dialogue": [{"speaker": "A", "text": "That was selfless of you to share the cake."}, {"speaker": "B", "text": "I gave him the larger piece. It had the candle wax."}], "translation": ["大きいケーキを譲るなんて無私だね。", "彼の方が大きかった。ろうそくのろう付きで。"], "explanation": "selfless は「自分より他人を大切にする」。大きい方のケーキを譲ったので無私の行為に見えますが、その一切れにはろうが付着していました。親切そうな選択に、自分に都合のよい理由が隠れています。", "video": "", "media": "media/word-363.mp4"}, {"number": 364, "word": "flustered", "meaning": "慌ててうろたえた", "dialogue": [{"speaker": "A", "text": "Why was the waiter flustered?"}, {"speaker": "B", "text": "I ordered confidently, then realized I was reading the wine list."}], "translation": ["店員はなぜうろたえた？", "自信満々に注文した後、ワインリストだと気づいた。"], "explanation": "flustered は「慌ててうろたえた」。堂々と食事を注文したつもりが、読んでいたのはワインリスト。自信のある客の言葉と内容がかみ合わず、店員が対応に困る場面です。", "video": "", "media": "media/word-364.mp4"}, {"number": 365, "word": "cryptic", "meaning": "意味が分かりにくく謎めいた", "dialogue": [{"speaker": "A", "text": "Was the message cryptic?"}, {"speaker": "B", "text": "It said the owl knows. I only asked for the Wi-Fi password."}], "translation": ["メッセージは謎めいていた？", "「フクロウは知る」と。Wi-Fiのパスワードを聞いただけ。"], "explanation": "cryptic は「意味が分かりにくく謎めいた」。Wi-Fiのパスワードを聞いただけなのに、「フクロウは知っている」という謎めいた返答。実用的な質問が突然暗号解読のようになる落差です。", "video": "", "media": "media/word-365.mp4"}, {"number": 366, "word": "ostentatious", "meaning": "見せびらかすような", "dialogue": [{"speaker": "A", "text": "Is the new mailbox ostentatious?"}, {"speaker": "B", "text": "It has a chandelier. For the bills."}], "translation": ["新しい郵便受けは派手すぎる？", "シャンデリア付きだ。請求書のためにね。"], "explanation": "ostentatious は「見せびらかすような」。郵便受けにシャンデリアを付けても、入るのは請求書。地味で嬉しくない郵便物に過剰な豪華さを用意する、見せびらかしの誇張です。", "video": "", "media": "media/word-366.mp4"}, {"number": 367, "word": "irreversible", "meaning": "元に戻せない", "dialogue": [{"speaker": "A", "text": "Was sending that email irreversible?"}, {"speaker": "B", "text": "The boss has printed it. In color."}], "translation": ["あのメール送信は取り消せない？", "上司が印刷した。カラーで。"], "explanation": "irreversible は「元に戻せない」。送ったメールは上司がカラー印刷済みで、取り消せそうにありません。デジタルな送信失敗が物理的な証拠になったうえ、カラーという細部が妙に決定的に響きます。", "video": "", "media": "media/word-367.mp4"}, {"number": 368, "word": "verify", "meaning": "真実かどうか確認する", "dialogue": [{"speaker": "A", "text": "Did you verify the address?"}, {"speaker": "B", "text": "Yes. Unfortunately, after ringing the bell in my pajamas."}], "translation": ["住所を確認した？", "うん。残念ながらパジャマで呼び鈴を押した後に。"], "explanation": "verify は「真実かどうか確認する」。住所は確認しましたが、パジャマ姿で呼び鈴を鳴らした後でした。必要な確認でも順番が遅ければ、気まずい間違いを防げません。", "video": "", "media": "media/word-368.mp4"}, {"number": 369, "word": "appease", "meaning": "なだめて怒りを鎮める", "dialogue": [{"speaker": "A", "text": "How did you appease the angry customer?"}, {"speaker": "B", "text": "A refund, an apology, and custody of the bread basket."}], "translation": ["怒った客をどうなだめた？", "返金、謝罪、そしてパン籠の所有権。"], "explanation": "appease は「なだめて怒りを鎮める」。怒った客をなだめるため、返金と謝罪に加えてパンかごの所有権まで渡します。食事の付属品を交渉の譲歩条件にする、大げさな和解です。", "video": "", "media": "media/word-369.mp4"}, {"number": 370, "word": "reinforce", "meaning": "強めて支える", "dialogue": [{"speaker": "A", "text": "Did the extra screws reinforce the shelf?"}, {"speaker": "B", "text": "Yes. Now the wall looks nervous."}], "translation": ["追加のねじで棚は強くなった？", "うん。今度は壁が不安そう。"], "explanation": "reinforce は「強めて支える」。ねじを追加して棚は丈夫になりましたが、今度は壁が不安そうです。支える力の問題が壁へ移ったように描き、構造物を心配する人として扱っています。", "video": "", "media": "media/word-370.mp4"}, {"number": 371, "word": "hypocrisy", "meaning": "言行が一致しない偽善", "dialogue": [{"speaker": "A", "text": "What's the hypocrisy in his speech about waste?"}, {"speaker": "B", "text": "He printed a separate copy for every empty chair."}], "translation": ["無駄をなくす演説の偽善は？", "空席一つ一つにも資料を印刷した。"], "explanation": "hypocrisy は「言行が一致しない偽善」。無駄をなくせという演説資料を、誰も座っていない椅子の分まで印刷します。説く内容と本人の行為が正反対で、偽善を具体的に示しています。", "video": "", "media": "media/word-371.mp4"}, {"number": 372, "word": "contingency", "meaning": "備えるべき不測の事態", "dialogue": [{"speaker": "A", "text": "What's your contingency plan if it rains?"}, {"speaker": "B", "text": "Call the picnic a water-themed dining experience."}], "translation": ["雨の場合の備えは？", "ピクニックを水がテーマの食事体験と呼ぶ。"], "explanation": "contingency は「備えるべき不測の事態」。雨天時の代案は、ピクニックを「水をテーマにした食事体験」と呼ぶこと。場所や行動を変えず、名称だけで悪天候を演出の一部にしています。", "video": "", "media": "media/word-372.mp4"}, {"number": 373, "word": "resourceful", "meaning": "工夫ができる", "dialogue": [{"speaker": "A", "text": "The chef is resourceful."}, {"speaker": "B", "text": "The rolling pin broke, so tonight's bread was flattened with a trophy."}], "translation": ["シェフは工夫が上手だ。", "麺棒が壊れたので、パンをトロフィーで延ばした。"], "explanation": "resourceful は「工夫ができる」。麺棒が壊れた料理人は、トロフィーでパン生地をのばします。表彰品が急に台所道具へ転用され、手元の物で工夫する力を意外な道具で示しています。", "video": "", "media": "media/word-373.mp4"}, {"number": 374, "word": "shrewd", "meaning": "判断が鋭く抜け目のない", "dialogue": [{"speaker": "A", "text": "That was a shrewd business decision."}, {"speaker": "B", "text": "Yes. He opened a coffee stand outside a sleep clinic."}], "translation": ["抜け目のない商売の判断だね。", "うん。睡眠外来の前でコーヒー店を開いた。"], "explanation": "shrewd は「判断が鋭く抜け目のない」。睡眠の診療所の前にコーヒー店を出します。眠気や睡眠に悩む人が来る場所と、眠気を覚ます飲み物の組み合わせが、商機にも矛盾にも見える冗談です。", "video": "", "media": "media/word-374.mp4"}, {"number": 375, "word": "altruistic", "meaning": "他人の利益を思って行動する", "dialogue": [{"speaker": "A", "text": "Was donating your prize money altruistic?"}, {"speaker": "B", "text": "Yes. My bank account is still trying to understand the concept."}], "translation": ["賞金の寄付は利他的だった？", "うん。銀行口座はまだその概念を理解しようとしてる。"], "explanation": "altruistic は「他人の利益を思って行動する」。賞金を寄付する利他的な判断を、銀行口座だけは理解できていません。口座を残高重視の人格に見立て、善意と金銭的損得を対比しています。", "video": "", "media": "media/word-375.mp4"}, {"number": 376, "word": "flabbergasted", "meaning": "仰天した", "dialogue": [{"speaker": "A", "text": "Why was the librarian flabbergasted?"}, {"speaker": "B", "text": "Someone returned a book early and apologized for rushing."}], "translation": ["司書はなぜ仰天した？", "早めに返却した人が、急いですみませんと言った。"], "explanation": "flabbergasted は「仰天した」。本を早く返した人が、急いだことまで謝ったので司書は仰天します。返却の遅れで謝る普通の場面を逆にし、丁寧すぎる行動を描いています。", "video": "", "media": "media/word-376.mp4"}, {"number": 377, "word": "enigmatic", "meaning": "謎めいて理解しにくい", "dialogue": [{"speaker": "A", "text": "Why is the portrait so enigmatic?"}, {"speaker": "B", "text": "Everyone disagrees whether he's smiling or remembering an unpaid bill."}], "translation": ["肖像画はなぜ謎めいている？", "笑顔か未払いの請求書を思い出した顔かで意見が割れる。"], "explanation": "enigmatic は「謎めいて理解しにくい」。肖像画の表情が微笑みなのか、未払い請求を思い出しているのか分かりません。芸術的な謎へありふれた金銭の心配を持ち込み、解釈の落差を作っています。", "video": "", "media": "media/word-377.mp4"}, {"number": 378, "word": "extravagant", "meaning": "度を越してぜいたくな", "dialogue": [{"speaker": "A", "text": "Was the party extravagant?"}, {"speaker": "B", "text": "The ice cubes had their own lighting designer."}], "translation": ["パーティーは贅沢すぎた？", "氷専属の照明デザイナーがいた。"], "explanation": "extravagant は「度を越してぜいたくな」。パーティーでは氷専属の照明デザイナーまでいます。すぐ溶ける小さな物に専門家を付ける、費用のかけ方の極端さがオチです。", "video": "", "media": "media/word-378.mp4"}, {"number": 379, "word": "inefficient", "meaning": "効率が悪い", "dialogue": [{"speaker": "A", "text": "Why is this filing system inefficient?"}, {"speaker": "B", "text": "Finding a document requires creating another document."}], "translation": ["この整理方法はなぜ非効率？", "書類を探すために別の書類を作るから。"], "explanation": "inefficient は「効率が悪い」。書類を一つ探すために、もう一つ書類を作らなければなりません。情報を取り出す仕組みが仕事と書類を増やし、目的を妨げています。", "video": "", "media": "media/word-379.mp4"}, {"number": 380, "word": "refute", "meaning": "証拠を挙げて反論する", "dialogue": [{"speaker": "A", "text": "Can you refute the claim that you never cook?"}, {"speaker": "B", "text": "Certainly. Here's the fire department's report."}], "translation": ["料理をしないという主張を反証できる？", "もちろん。消防署の報告書がある。"], "explanation": "refute は「証拠を挙げて反論する」。料理を全くしないという主張への反証が、消防署の報告書です。料理をした証拠にはなっても、上手だとは全く言えない成果を堂々と提示しています。", "video": "", "media": "media/word-380.mp4"}, {"number": 381, "word": "placate", "meaning": "相手の怒りを和らげる", "dialogue": [{"speaker": "A", "text": "How did you placate your roommate?"}, {"speaker": "B", "text": "I replaced the milk and wrote a formal apology to his cereal."}], "translation": ["同居人の怒りをどう鎮めた？", "牛乳を補充し、シリアルに正式な謝罪文を書いた。"], "explanation": "placate は「相手の怒りを和らげる」。牛乳を使った相手をなだめるため、補充だけでなくシリアルへ正式に謝罪します。食べ物を被害者扱いする大げさな誠意が、仲直りの方法になっています。", "video": "", "media": "media/word-381.mp4"}, {"number": 382, "word": "sustain", "meaning": "持続させる", "dialogue": [{"speaker": "A", "text": "Can you sustain this running pace?"}, {"speaker": "B", "text": "Until the ice cream truck stops."}], "translation": ["この走る速さを維持できる？", "アイスクリームの車が止まるまでなら。"], "explanation": "sustain は「持続させる」。走るペースを維持できるのは、アイスクリーム販売車が止まるまで。体力やトレーニング計画ではなく、食べ物を追う意欲が走力を支えています。", "video": "", "media": "media/word-382.mp4"}, {"number": 383, "word": "integrity", "meaning": "誠実で原則を守る姿勢", "dialogue": [{"speaker": "A", "text": "Did the cashier show integrity?"}, {"speaker": "B", "text": "Yes. She returned the extra money I hadn't noticed I'd lost."}], "translation": ["レジ係は誠実だった？", "うん。なくしたと気づかなかった余分なお金を返した。"], "explanation": "integrity は「誠実で原則を守る姿勢」。店員は客も気づかなかった余分なお金を返します。これは強いオチより、気づかれなくても正しく行動する誠実さの例です。本人だけが知らなかった損を店員が防ぐ、小さな意外性があります。", "video": "", "media": "media/word-383.mp4"}, {"number": 384, "word": "redundancy", "meaning": "重複による余分な部分", "dialogue": [{"speaker": "A", "text": "Is there redundancy in this report?"}, {"speaker": "B", "text": "Yes. It says final conclusion at the end of the ending."}], "translation": ["報告書には余分な重複がある？", "うん。終わりの末尾に最終結論とある。"], "explanation": "redundancy は「重複による余分な部分」。「終わりの最後」に「最終的な結論」と書いてあり、同じ意味を重ねています。冗長さについての説明自体も冗長になっている、表現そのものの笑いです。", "video": "", "media": "media/word-384.mp4"}, {"number": 385, "word": "resilient", "meaning": "立ち直る力がある", "dialogue": [{"speaker": "A", "text": "Your garden is resilient."}, {"speaker": "B", "text": "Even after my care, something is still alive."}], "translation": ["庭は立ち直る力があるね。", "僕が世話した後でも何か生きてる。"], "explanation": "resilient は「立ち直る力がある」。庭が丈夫なのは「自分が世話をしてもまだ生きている物がある」から。世話を助けでなく試練として扱い、園芸の腕を自虐しています。", "video": "", "media": "media/word-385.mp4"}, {"number": 386, "word": "astute", "meaning": "状況を見抜くのが巧みな", "dialogue": [{"speaker": "A", "text": "That child is astute."}, {"speaker": "B", "text": "She asks for dessert while her parents are discussing politics."}], "translation": ["あの子は状況を読むのが上手だ。", "親が政治の話をしている間にデザートを頼む。"], "explanation": "astute は「状況を見抜くのが巧みな」。子どもは親が政治の話に夢中な時を狙ってデザートを頼みます。注意がそれて許可が出やすそうな瞬間を見抜く、幼い交渉上手の姿です。", "video": "", "media": "media/word-386.mp4"}, {"number": 387, "word": "benevolent", "meaning": "善意に満ちた", "dialogue": [{"speaker": "A", "text": "Was the king benevolent?"}, {"speaker": "B", "text": "He lowered taxes on things nobody could afford anyway."}], "translation": ["王は慈悲深かった？", "誰も買えない品物の税を下げた。"], "explanation": "benevolent は「善意に満ちた」。王は税を下げましたが、対象は誰にも買えない物でした。慈悲深い政策に見えて実際に助かる人がいない、うわべだけの親切への皮肉です。", "video": "", "media": "media/word-387.mp4"}, {"number": 388, "word": "bewildered", "meaning": "何が起きたか分からず混乱した", "dialogue": [{"speaker": "A", "text": "Why does Grandpa look bewildered?"}, {"speaker": "B", "text": "The fridge just asked him to accept its terms."}], "translation": ["おじいさんはなぜ混乱してるの？", "冷蔵庫が利用規約への同意を求めた。"], "explanation": "bewildered は「何が起きたか分からず混乱した」。祖父は冷蔵庫から利用規約への同意を求められて困惑します。食べ物を冷やすだけの家電に、ネットサービスの手続きが入り込む意外さです。", "video": "", "media": "media/word-388.mp4"}, {"number": 389, "word": "explicit", "meaning": "明確に述べられた", "dialogue": [{"speaker": "A", "text": "Were your instructions explicit?"}, {"speaker": "B", "text": "Yes. I said no glitter. The room now sparkles in protest."}], "translation": ["指示は明確だった？", "うん。ラメ禁止と言ったら、部屋が抗議で輝いてる。"], "explanation": "explicit は「明確に述べられた」。「ラメは禁止」と明確に言ったのに、部屋中がきらめいています。伝達が曖昧だったのではなく守られなかったことを、部屋の「抗議」として描いています。", "video": "", "media": "media/word-389.mp4"}, {"number": 390, "word": "lavish", "meaning": "惜しみなく豪華な", "dialogue": [{"speaker": "A", "text": "Was the reception lavish?"}, {"speaker": "B", "text": "The napkins felt wealthier than I did."}], "translation": ["披露宴は豪華だった？", "ナプキンの方が僕より裕福そうだった。"], "explanation": "lavish は「惜しみなく豪華な」。豪華な披露宴では、ナプキンさえ自分より裕福に感じます。小さな備品にまで高級感があることを、人と物の経済力を比べる形で誇張しています。", "video": "", "media": "media/word-390.mp4"}, {"number": 391, "word": "futile", "meaning": "努力してもむだな", "dialogue": [{"speaker": "A", "text": "Was arguing with the parking meter futile?"}, {"speaker": "B", "text": "Yes. It only accepts coins, not explanations."}], "translation": ["駐車メーターとの議論は無駄だった？", "うん。説明ではなく硬貨しか受け付けない。"], "explanation": "futile は「努力してもむだな」。駐車メーターに事情を説明しても無駄なのは、受け付けるのが硬貨だけだから。機械に人間同士の交渉を持ちかける、通じない説得の可笑しさです。", "video": "", "media": "media/word-391.mp4"}, {"number": 392, "word": "debunk", "meaning": "誤りやうそを暴く", "dialogue": [{"speaker": "A", "text": "Did you debunk the haunted-house story?"}, {"speaker": "B", "text": "Yes. The ghost was a badly balanced washing machine."}], "translation": ["幽霊屋敷の話の誤りを暴いた？", "うん。幽霊はバランスの悪い洗濯機だった。"], "explanation": "debunk は「誤りやうそを暴く」。幽霊屋敷の正体は、バランスの悪い洗濯機が立てる音でした。超自然的で怖い話を、家電のありふれた不具合へ引き戻しています。", "video": "", "media": "media/word-392.mp4"}, {"number": 393, "word": "defuse", "meaning": "緊張した状況を和らげる", "dialogue": [{"speaker": "A", "text": "How did you defuse the argument?"}, {"speaker": "B", "text": "I announced that the pizza had arrived. Peace has toppings."}], "translation": ["口論をどう和らげた？", "ピザが来たと告げた。平和にはトッピングがある。"], "explanation": "defuse は「緊張した状況を和らげる」。口論を鎮めたのは立派な仲裁ではなく、ピザ到着の知らせ。「平和にはトッピングがある」と言い、食欲が争いより強いことを表しています。", "video": "", "media": "media/word-393.mp4"}, {"number": 394, "word": "persevere", "meaning": "困難でもやり続ける", "dialogue": [{"speaker": "A", "text": "Why persevere with learning the violin?"}, {"speaker": "B", "text": "Eventually, the neighbors will move or I'll improve."}], "translation": ["なぜバイオリンを諦めないの？", "いつか隣人が引っ越すか、僕が上達する。"], "explanation": "persevere は「困難でもやり続ける」。バイオリンを続ければ、自分が上達するか近所の人が引っ越すかのどちらかだと言います。努力の成果に、音に耐える側の退避まで含めた自虐です。", "video": "", "media": "media/word-394.mp4"}, {"number": 395, "word": "credibility", "meaning": "信頼性", "dialogue": [{"speaker": "A", "text": "Did his story lose credibility?"}, {"speaker": "B", "text": "At the part where his bicycle needed an oil change."}], "translation": ["彼の話は信頼性を失った？", "自転車のオイル交換が必要、と言った所で。"], "explanation": "credibility は「信頼性」。自転車にオイル交換が必要という部分で話が怪しくなります。自転車にも注油はしますが、自動車のようなエンジンオイル交換を持ち出した点が、言い訳の取り違えとして響きます。", "video": "", "media": "media/word-395.mp4"}, {"number": 396, "word": "inevitability", "meaning": "避けられないこと", "dialogue": [{"speaker": "A", "text": "What's the inevitability of buying a white shirt?"}, {"speaker": "B", "text": "Lunch suddenly involves tomato sauce."}], "translation": ["白いシャツを買うと避けられないことは？", "昼食に突然トマトソースが登場する。"], "explanation": "inevitability は「避けられないこと」。白いシャツを買うと、なぜか昼食がトマトソースになります。汚したくない時ほど染みになる物に出会う、偶然を避けられない法則のように嘆いています。", "video": "", "media": "media/word-396.mp4"}, {"number": 397, "word": "frugal", "meaning": "倹約する", "dialogue": [{"speaker": "A", "text": "How frugal is your uncle?"}, {"speaker": "B", "text": "He saves hotel soap and labels it by vintage."}], "translation": ["おじさんはどのくらい倹約家？", "ホテルの石けんを保存し、年代を付ける。"], "explanation": "frugal は「倹約する」。ホテルのせっけんを保存するだけでなく、ワインのように年代を付けて分類します。倹約で取っておいた日用品を、貴重な収集品のように扱っています。", "video": "", "media": "media/word-397.mp4"}, {"number": 398, "word": "naive", "meaning": "世間知らずで信じやすい", "dialogue": [{"speaker": "A", "text": "Was it naive to believe the delivery estimate?"}, {"speaker": "B", "text": "It said sometime today. You took the word today seriously."}], "translation": ["配達予定を信じたのは世間知らず？", "「今日中」の「今日」を真に受けたんだね。"], "explanation": "naive は「世間知らずで信じやすい」。配達予定の「今日のどこか」を信じたこと自体が甘かったとからかわれます。時間帯だけでなく「今日」まで疑う返事で、曖昧な配達予告への不信を表しています。", "video": "", "media": "media/word-398.mp4"}, {"number": 399, "word": "magnanimous", "meaning": "相手を許す度量が大きい", "dialogue": [{"speaker": "A", "text": "Was the winner magnanimous?"}, {"speaker": "B", "text": "Yes. He let me hold the trophy while he tied his shoe."}], "translation": ["勝者は寛大だった？", "うん。靴ひもを結ぶ間、トロフィーを持たせてくれた。"], "explanation": "magnanimous は「相手を許す度量が大きい」。勝者が寛大にトロフィーを持たせたようで、実際は靴ひもを結ぶ間の荷物持ち。相手を立てた親切に見せつつ、単に自分の用を済ませています。", "video": "", "media": "media/word-399.mp4"}, {"number": 400, "word": "baffled", "meaning": "理解できず困惑した", "dialogue": [{"speaker": "A", "text": "Why is the dog baffled?"}, {"speaker": "B", "text": "The automatic door opened for everyone except his reflection."}], "translation": ["犬はなぜ困惑してるの？", "自動ドアが、映った自分以外には開いたから。"], "explanation": "baffled は「理解できず困惑した」。犬は自動ドアが他の人には開くのに、自分の映り込みには反応しないことを不思議がります。反射像を本物の別の存在のように受け止める、犬視点の混乱です。", "video": "", "media": "media/word-400.mp4"}, {"number": 401, "word": "implicit", "meaning": "直接言わず含まれた", "dialogue": [{"speaker": "A", "text": "Was there implicit criticism in her gift?"}, {"speaker": "B", "text": "It was a cookbook called Anyone Can Learn."}], "translation": ["贈り物に暗黙の批判があった？", "「誰でも学べる」という料理本だった。"], "explanation": "implicit は「直接言わず含まれた」。贈られた料理本の題名が「誰でも学べる」。料理が下手だと直接は言わなくても、これから学んでほしいという批判が贈り物に含まれていそうです。", "video": "", "media": "media/word-401.mp4"}, {"number": 402, "word": "meager", "meaning": "乏しく不十分な", "dialogue": [{"speaker": "A", "text": "Was the portion meager?"}, {"speaker": "B", "text": "The waiter called it a tasting menu. One taste finished it."}], "translation": ["量は乏しかった？", "試食メニューと言われた。一口で終わった。"], "explanation": "meager は「乏しく不十分な」。試食メニューという名目でも、一口で全部終わるほどの量でした。少量を味わう形式と、物足りないほど少ない盛り付けの境界をからかっています。", "video": "", "media": "media/word-402.mp4"}, {"number": 403, "word": "precarious", "meaning": "不安定で危うい", "dialogue": [{"speaker": "A", "text": "Is that stack of books precarious?"}, {"speaker": "B", "text": "Yes. The bottom book is called Achieving Balance."}], "translation": ["その本の山は不安定？", "うん。一番下は「バランスの取り方」という本。"], "explanation": "precarious は「不安定で危うい」。今にも崩れそうな本の山の一番下には「バランスを保つ」という本。書かれた理想と本自体の置かれ方が反対になっている、視覚的な皮肉です。", "video": "", "media": "media/word-403.mp4"}, {"number": 404, "word": "dispute", "meaning": "正しさを疑い異議を唱える", "dialogue": [{"speaker": "A", "text": "Do you dispute the bill?"}, {"speaker": "B", "text": "Yes. I rented a room, not a share of the hotel."}], "translation": ["請求額に異議がある？", "うん。借りたのは部屋で、ホテルの持ち分じゃない。"], "explanation": "dispute は「正しさを疑い異議を唱える」。宿泊代が高すぎて、部屋を借りただけなのにホテルの持ち分を買ったようだと抗議します。料金の大きさを所有権の購入に例えた誇張です。", "video": "", "media": "media/word-404.mp4"}, {"number": 405, "word": "mediate", "meaning": "対立する双方の間を取り持つ", "dialogue": [{"speaker": "A", "text": "Who will mediate the argument over the remote?"}, {"speaker": "B", "text": "The baby. He just switched off the television."}], "translation": ["リモコン争いは誰が仲裁する？", "赤ちゃん。今、テレビを消した。"], "explanation": "mediate は「対立する双方の間を取り持つ」。リモコン争いの仲裁役は、テレビを消した赤ちゃん。どちらが持つかを決めるのでなく、争う理由そのものをなくして解決しています。", "video": "", "media": "media/word-405.mp4"}, {"number": 406, "word": "persist", "meaning": "やめずに続ける", "dialogue": [{"speaker": "A", "text": "Why persist with that difficult crossword?"}, {"speaker": "B", "text": "The pen was expensive. It needs a victory."}], "translation": ["なぜ難しいクロスワードを続けるの？", "高いペンだった。勝利を経験させたい。"], "explanation": "persist は「やめずに続ける」。難しいクロスワードを続ける理由は、高価なペンに勝利を味わわせたいから。道具を頑張る人格として扱い、買った物の元を取りたい気持ちを表しています。", "video": "", "media": "media/word-406.mp4"}, {"number": 407, "word": "accountability", "meaning": "説明責任", "dialogue": [{"speaker": "A", "text": "How does your team ensure accountability?"}, {"speaker": "B", "text": "Every missing stapler gets its own investigation."}], "translation": ["チームではどう説明責任を果たすの？", "消えたホチキスごとに調査をする。"], "explanation": "accountability は「説明責任」。チームの責任の明確化は、なくなったホチキス一つごとに調査すること。大事な仕事の説明責任を期待したのに、小さな備品へ厳格な仕組みを適用しています。", "video": "", "media": "media/word-407.mp4"}, {"number": 408, "word": "plausibility", "meaning": "もっともらしさ", "dialogue": [{"speaker": "A", "text": "Does my excuse have plausibility?"}, {"speaker": "B", "text": "A traffic jam in your hallway needs more detail."}], "translation": ["僕の言い訳はもっともらしい？", "廊下での渋滞には、もっと説明が要る。"], "explanation": "plausibility は「もっともらしさ」。遅れた理由が自宅の廊下の渋滞では、普通の交通渋滞の言い訳ほど納得できません。もっともらしく聞こえる言葉も、場所を当てはめると不自然さが現れます。", "video": "", "media": "media/word-408.mp4"}, {"number": 409, "word": "procrastinate", "meaning": "先延ばしにする", "dialogue": [{"speaker": "A", "text": "Why do you procrastinate about opening bills?"}, {"speaker": "B", "text": "Sealed envelopes still contain possibilities."}], "translation": ["なぜ請求書の開封を先延ばしにするの？", "封をしたままなら可能性が残っている。"], "explanation": "procrastinate は「先延ばしにする」。請求書を開かないのは、封をしたままならまだ良い可能性も残るから。金額を知らない状態を希望として保ち、現実への対処を先延ばししています。", "video": "", "media": "media/word-409.mp4"}, {"number": 410, "word": "gullible", "meaning": "だまされやすい", "dialogue": [{"speaker": "A", "text": "Was I gullible to buy invisible ink online?"}, {"speaker": "B", "text": "They sent an empty bottle. You left a five-star review."}], "translation": ["見えないインクを買ったのはだまされやすい？", "空瓶が届いて、君は星5個を付けたね。"], "explanation": "gullible は「だまされやすい」。見えないインクを買って空瓶が届いたのに、星5つの評価を付けました。中身がないことまで商品の効果だと信じたような、騙されやすさの誇張です。", "video": "", "media": "media/word-410.mp4"}, {"number": 411, "word": "petty", "meaning": "小さなことにこだわり心が狭い", "dialogue": [{"speaker": "A", "text": "Was moving his chair petty?"}, {"speaker": "B", "text": "Only if he notices it's one centimeter farther from success."}], "translation": ["椅子を動かしたのは心が狭かった？", "成功から1センチ遠のいたと気づけばね。"], "explanation": "petty は「小さなことにこだわり心が狭い」。相手の椅子を1センチだけ動かし、成功から遠ざけたと言います。嫌がらせの規模が極小なのに、心理的な意味だけ大きく付ける小ささがオチです。", "video": "", "media": "media/word-411.mp4"}, {"number": 412, "word": "perplexed", "meaning": "どう考えればよいか分からない", "dialogue": [{"speaker": "A", "text": "Why are you perplexed by the menu?"}, {"speaker": "B", "text": "The salad has a biography but no ingredients."}], "translation": ["なぜメニューに困惑してるの？", "サラダの生い立ちはあるのに材料がない。"], "explanation": "perplexed は「どう考えればよいか分からない」。メニューのサラダには長い身の上話があるのに、材料が書かれていません。凝った紹介が、何を食べるか知りたいという基本的な目的を満たしていません。", "video": "", "media": "media/word-412.mp4"}, {"number": 413, "word": "coherent", "meaning": "筋が通って分かりやすい", "dialogue": [{"speaker": "A", "text": "Was the plan coherent?"}, {"speaker": "B", "text": "Until step four required us to own a helicopter."}], "translation": ["計画は筋が通っていた？", "手順4でヘリ所有が必要になるまでは。"], "explanation": "coherent は「筋が通って分かりやすい」。筋の通った計画も、4番目の手順でヘリコプターの所有が必要になって破綻します。突然現実離れした前提が現れ、それまでの納得を崩しています。", "video": "", "media": "media/word-413.mp4"}, {"number": 414, "word": "scarce", "meaning": "不足している", "dialogue": [{"speaker": "A", "text": "Are parking spaces scarce here?"}, {"speaker": "B", "text": "I've seen people write thank-you notes to empty ones."}], "translation": ["ここは駐車場所が不足してる？", "空いた場所にお礼状を書く人を見た。"], "explanation": "scarce は「不足している」。駐車スペースが貴重すぎて、空き区画へお礼状を書く人までいます。無機物へ感謝を伝えるほど、空きを見つける喜びが大きいという誇張です。", "video": "", "media": "media/word-414.mp4"}, {"number": 415, "word": "volatile", "meaning": "急に変化しやすい", "dialogue": [{"speaker": "A", "text": "Is the market volatile?"}, {"speaker": "B", "text": "My shares have more mood swings than my teenager."}], "translation": ["相場は変動しやすい？", "僕の株は思春期の子どもより気分が変わる。"], "explanation": "volatile は「急に変化しやすい」。株価の変動を、十代の子の気分以上に激しいと言います。金融の動きを家庭で知る感情の揺れに例え、不安定さを身近にしています。", "video": "", "media": "media/word-415.mp4"}, {"number": 416, "word": "contradict", "meaning": "反対のことを述べる", "dialogue": [{"speaker": "A", "text": "Did you contradict yourself?"}, {"speaker": "B", "text": "Never. Except just now, and possibly tomorrow."}], "translation": ["自分の発言と矛盾した？", "絶対にない。今と、多分明日を除いて。"], "explanation": "contradict は「反対のことを述べる」。矛盾したことは絶対ないと言いながら、今と明日は例外かもしれないと続けます。否定の直後にその否定を崩し、台詞自体が矛盾の見本です。", "video": "", "media": "media/word-416.mp4"}, {"number": 417, "word": "concede", "meaning": "しぶしぶ認める", "dialogue": [{"speaker": "A", "text": "Will you concede that I was right?"}, {"speaker": "B", "text": "I'll acknowledge that reality temporarily agreed with you."}], "translation": ["私が正しかったと認める？", "現実が一時的に君に同意したとは認める。"], "explanation": "concede は「しぶしぶ認める」。相手が正しかったとは認めず、現実が一時的に相手へ賛成したと言い換えます。事実上は譲歩しながら、面子を守るため言葉をこねているのがオチです。", "video": "", "media": "media/word-417.mp4"}, {"number": 418, "word": "improvise", "meaning": "その場の工夫で行う", "dialogue": [{"speaker": "A", "text": "Did you improvise when the projector failed?"}, {"speaker": "B", "text": "Yes. I became a very low-resolution slideshow."}], "translation": ["映写機が壊れたとき、その場で工夫した？", "うん。僕が低解像度のスライドショーになった。"], "explanation": "improvise は「その場の工夫で行う」。プロジェクターが壊れたため、自分が低解像度のスライドショーになったと言います。身ぶりなどで代役を務める即興の対応を、映像機器の性能のように評しています。", "video": "", "media": "media/word-418.mp4"}, {"number": 419, "word": "bias", "meaning": "偏った見方", "dialogue": [{"speaker": "A", "text": "Is there bias in your restaurant ratings?"}, {"speaker": "B", "text": "Possibly. Free bread earns two stars before I sit down."}], "translation": ["店の評価に偏りはある？", "多分。無料パンなら座る前から星2個。"], "explanation": "bias は「偏った見方」。無料のパンがあるだけで、着席前に星2つを付けます。料理やサービス全体を見ず、自分の好みの特典で評価が大きく動く偏りです。", "video": "", "media": "media/word-419.mp4"}, {"number": 420, "word": "vulnerability", "meaning": "傷ついたり被害を受けたりしやすさ", "dialogue": [{"speaker": "A", "text": "What's your greatest vulnerability when shopping?"}, {"speaker": "B", "text": "Someone saying this is the last one."}], "translation": ["買い物での最大の弱点は？", "「これが最後の一つ」と言われること。"], "explanation": "vulnerability は「傷ついたり被害を受けたりしやすさ」。買い物の弱点は「残り一つ」と言われること。必要性より逃す不安に心を動かされる、売り文句に対する弱さを自覚しています。", "video": "", "media": "media/word-420.mp4"}, {"number": 421, "word": "overestimate", "meaning": "過大評価する", "dialogue": [{"speaker": "A", "text": "Did you overestimate your cooking skills?"}, {"speaker": "B", "text": "I invited twelve people before checking whether I owned a pan."}], "translation": ["料理の腕を過大評価した？", "鍋があるか確認する前に12人を招いた。"], "explanation": "overestimate は「過大評価する」。鍋を持っているか確かめる前に12人を食事へ招待します。料理の腕だけでなく、基本的な準備もないまま自信が先走っています。", "video": "", "media": "media/word-421.mp4"}, {"number": 422, "word": "cynical", "meaning": "人の善意を信じない", "dialogue": [{"speaker": "A", "text": "Why are you cynical about the free seminar?"}, {"speaker": "B", "text": "The first slide is a payment plan."}], "translation": ["無料講習になぜ懐疑的なの？", "最初のスライドが支払いプランだから。"], "explanation": "cynical は「人の善意を信じない」。無料セミナーを疑うのは、最初のスライドから支払いプランが出るため。学びの提供という表向きの目的より、販売への誘導が見えているという皮肉です。", "video": "", "media": "media/word-422.mp4"}, {"number": 423, "word": "spiteful", "meaning": "意地悪をしたがる", "dialogue": [{"speaker": "A", "text": "Was that message spiteful?"}, {"speaker": "B", "text": "She sent a beach photo while I was shoveling snow."}], "translation": ["あのメッセージは意地悪だった？", "雪かき中の僕に、彼女は浜辺の写真を送った。"], "explanation": "spiteful は「意地悪をしたがる」。雪かき中の相手に海辺の写真を送ります。写真だけなら普通でも、相手の寒く大変な状況との対比で、羨ましがらせたい意地悪に見える場面です。", "video": "", "media": "media/word-423.mp4"}, {"number": 424, "word": "disconcerted", "meaning": "不意を突かれて落ち着かない", "dialogue": [{"speaker": "A", "text": "Why did the interviewer look disconcerted?"}, {"speaker": "B", "text": "I asked whether the office ghost had a pension."}], "translation": ["面接官はなぜ面食らったの？", "職場の幽霊にも年金があるか聞いた。"], "explanation": "disconcerted は「不意を突かれて落ち着かない」。面接で職場の幽霊にも年金があるか質問し、面接官を戸惑わせます。待遇の質問という普通の形に、幽霊という予想外の対象を混ぜています。", "video": "", "media": "media/word-424.mp4"}, {"number": 425, "word": "incoherent", "meaning": "話の筋が通らない", "dialogue": [{"speaker": "A", "text": "Was his explanation incoherent?"}, {"speaker": "B", "text": "It began with tax policy and ended with a missing hamster."}], "translation": ["彼の説明は筋が通らなかった？", "税制で始まり、消えたハムスターで終わった。"], "explanation": "incoherent は「話の筋が通らない」。説明が税制から始まり、最後は行方不明のハムスターの話になります。つながりをたどれないほど話題が飛ぶことで、まとまりのなさを示しています。", "video": "", "media": "media/word-425.mp4"}, {"number": 426, "word": "abundant", "meaning": "豊富な", "dialogue": [{"speaker": "A", "text": "What's abundant in your vegetable garden?"}, {"speaker": "B", "text": "Advice from people who never pull weeds."}], "translation": ["菜園に豊富なものは？", "草むしりをしない人からの助言。"], "explanation": "abundant は「豊富な」。菜園で豊富なのは作物ではなく、草取りをしない人たちからの助言。実際に手伝う労力と、口だけ出す人数の不釣り合いを皮肉っています。", "video": "", "media": "media/word-426.mp4"}, {"number": 427, "word": "erratic", "meaning": "動きが不規則な", "dialogue": [{"speaker": "A", "text": "Is the bus service erratic?"}, {"speaker": "B", "text": "The timetable reads more like a collection of wishes."}], "translation": ["バスの運行は不規則？", "時刻表が願望集に見える。"], "explanation": "erratic は「動きが不規則な」。バスの時刻表が予定ではなく願望集のようです。書かれた時刻に実際は来ないため、運行の不規則さを「こうなればいい」という希望にたとえています。", "video": "", "media": "media/word-427.mp4"}, {"number": 428, "word": "misinterpret", "meaning": "意味を取り違える", "dialogue": [{"speaker": "A", "text": "Did he misinterpret the instruction to go green?"}, {"speaker": "B", "text": "Yes. He painted the office printer."}], "translation": ["環境に優しく、という指示を取り違えた？", "うん。職場のプリンターを緑に塗った。"], "explanation": "misinterpret は「意味を取り違える」。go green は環境に配慮する意味ですが、プリンターを緑色に塗りました。green を環境への配慮ではなく文字どおりの色として解釈した言葉遊びです。", "video": "", "media": "media/word-428.mp4"}, {"number": 429, "word": "comply", "meaning": "規則や要求に従う", "dialogue": [{"speaker": "A", "text": "Will you comply with the clean-desk policy?"}, {"speaker": "B", "text": "Certainly. Everything is now in one enormous drawer."}], "translation": ["机の整理規則には従う？", "もちろん。全部一つの巨大な引き出しに入れた。"], "explanation": "comply は「規則や要求に従う」。机を片づける規則には従いましたが、物を全部巨大な引き出しへ押し込んだだけ。見える表面はきれいでも、整理という目的は達成していません。", "video": "", "media": "media/word-429.mp4"}, {"number": 430, "word": "salvage", "meaning": "失敗や損害から救い出す", "dialogue": [{"speaker": "A", "text": "Could you salvage anything from dinner?"}, {"speaker": "B", "text": "The candles survived. We ordered pizza by candlelight."}], "translation": ["夕食の失敗から何か救えた？", "ろうそくは無事だった。灯りの下でピザを注文した。"], "explanation": "salvage は「失敗や損害から救い出す」。失敗した夕食から救えたのはろうそくだけでした。それを使って注文したピザを食べ、料理は残せなくても雰囲気は再利用する展開です。", "video": "", "media": "media/word-430.mp4"}, {"number": 431, "word": "prejudice", "meaning": "根拠の薄い先入観", "dialogue": [{"speaker": "A", "text": "Why judge the whole town from one cafe?"}, {"speaker": "B", "text": "You're right. My prejudice is based on just one terrible muffin."}], "translation": ["一つのカフェで町全体を判断するの？", "その通り。僕の偏見の根拠はまずいマフィン一つ。"], "explanation": "prejudice は「根拠の薄い先入観」。ひどいマフィン一つから町全体を悪く評価していました。一例だけで広い対象を決めつける偏見を、本人が認める形で具体化しています。", "video": "", "media": "media/word-431.mp4"}, {"number": 432, "word": "resilience", "meaning": "困難から立ち直る力", "dialogue": [{"speaker": "A", "text": "What shows your startup's resilience?"}, {"speaker": "B", "text": "We've survived three failed launches and the office microwave."}], "translation": ["新興企業の回復力を示すものは？", "失敗3回と職場の電子レンジを乗り越えた。"], "explanation": "resilience は「困難から立ち直る力」。会社は3回の製品公開の失敗だけでなく、職場の電子レンジにも耐えてきました。大きな経営上の試練と、危なっかしい家電を同列に並べる落差です。", "video": "", "media": "media/word-432.mp4"}, {"number": 433, "word": "underestimate", "meaning": "過小評価する", "dialogue": [{"speaker": "A", "text": "Did you underestimate the hike?"}, {"speaker": "B", "text": "I brought one biscuit and a very confident hat."}], "translation": ["ハイキングを甘く見た？", "ビスケット一枚と自信満々な帽子を持って行った。"], "explanation": "underestimate は「過小評価する」。ハイキングの装備がビスケット一枚と「自信たっぷりの帽子」。実用的な準備の不足を、見た目の自信では補えないという自虐です。", "video": "", "media": "media/word-433.mp4"}, {"number": 434, "word": "arrogant", "meaning": "傲慢な", "dialogue": [{"speaker": "A", "text": "Was the guest speaker arrogant?"}, {"speaker": "B", "text": "He thanked the audience for attending his existence."}], "translation": ["講演者は傲慢だった？", "自分の存在に出席してくれてありがとうと言った。"], "explanation": "arrogant は「傲慢な」。講演者は講演を聞きに来たことではなく、自分の「存在」に来場したことを感謝します。自分がいるだけで催しになると思うほどの尊大さです。", "video": "", "media": "media/word-434.mp4"}, {"number": 435, "word": "devious", "meaning": "ずるく遠回しに目的を果たす", "dialogue": [{"speaker": "A", "text": "That was a devious way to get the window seat."}, {"speaker": "B", "text": "I told my brother the aisle had better Wi-Fi."}], "translation": ["窓側席を取るずるい方法だったね。", "弟に通路側の方がWi-Fiがいいと言った。"], "explanation": "devious は「ずるく遠回しに目的を果たす」。窓側席を得るため、弟へ通路側の方がWi-Fiが良いと伝えます。自分の希望を言わず、相手が自ら席を譲りたくなる情報で誘導するずるい作戦です。", "video": "", "media": "media/word-435.mp4"}, {"number": 436, "word": "disheartened", "meaning": "落胆して意欲を失った", "dialogue": [{"speaker": "A", "text": "Why is the inventor disheartened?"}, {"speaker": "B", "text": "His new gadget was mistaken for the packaging."}], "translation": ["発明家はなぜ意気消沈してるの？", "新製品が梱包材と間違われた。"], "explanation": "disheartened は「落胆して意欲を失った」。発明品が梱包材と間違えられ、発明家は落胆します。画期的な道具として注目されるどころか、中身を守る不要な外側として見られた落差です。", "video": "", "media": "media/word-436.mp4"}, {"number": 437, "word": "laconic", "meaning": "口数が少なく簡潔な", "dialogue": [{"speaker": "A", "text": "Was the sailor laconic?"}, {"speaker": "B", "text": "I asked how the voyage went. He said wet."}], "translation": ["船乗りは口数が少なかった？", "航海はどうだったと聞いたら「濡れた」と。"], "explanation": "laconic は「口数が少なく簡潔な」。航海の感想を聞かれた船員の返事は「ぬれた」の一語。長い冒険談を期待させて、最小限の事実だけ答える極端な簡潔さです。", "video": "", "media": "media/word-437.mp4"}, {"number": 438, "word": "ubiquitous", "meaning": "至る所にある", "dialogue": [{"speaker": "A", "text": "Are cameras ubiquitous in this city?"}, {"speaker": "B", "text": "Even my toast seems to have a better profile picture."}], "translation": ["この街はどこにでもカメラがある？", "トーストまで僕よりいい顔写真を持ってそう。"], "explanation": "ubiquitous は「至る所にある」。街のカメラが多すぎて、トーストまで自分より良いプロフィール写真を持つように感じます。何でも撮影される時代を、朝食にも人物紹介があるかのように誇張しています。", "video": "", "media": "media/word-438.mp4"}, {"number": 439, "word": "sporadic", "meaning": "時々不規則に起こる", "dialogue": [{"speaker": "A", "text": "Is your jogging sporadic?"}, {"speaker": "B", "text": "Yes. Mostly when I see the bus arriving."}], "translation": ["ジョギングは時々不定期にするの？", "うん。主にバスが来たとき。"], "explanation": "sporadic は「時々不規則に起こる」。ジョギングは不定期で、主にバスが来た時だけ。健康習慣と呼んでいた行動の実態が、乗り遅れまいと走ることだったという言い換えです。", "video": "", "media": "media/word-439.mp4"}, {"number": 440, "word": "misconstrue", "meaning": "言動の意図を誤解する", "dialogue": [{"speaker": "A", "text": "Did she misconstrue your silence as agreement?"}, {"speaker": "B", "text": "Yes. Apparently, chewing isn't a recognized objection."}], "translation": ["沈黙を賛成と誤解された？", "うん。咀嚼は正式な反対意見ではないらしい。"], "explanation": "misconstrue は「言動の意図を誤解する」。黙っていたのを賛成だと解釈されましたが、実際には食べ物をかんでいました。意見を言わないことと賛成することは別なのに、口がふさがった事情が伝わりません。", "video": "", "media": "media/word-440.mp4"}, {"number": 441, "word": "defy", "meaning": "公然と逆らう", "dialogue": [{"speaker": "A", "text": "Did the puppy defy your command?"}, {"speaker": "B", "text": "He sat down. On the sandwich I told him to leave."}], "translation": ["子犬は命令に逆らった？", "お座りした。触るなと言ったサンドイッチの上に。"], "explanation": "defy は「公然と逆らう」。子犬は座る指示には従ったようで、触るなと言われたサンドイッチの上へ座ります。指示の一部を守りながら肝心な禁止を破る、いたずらな従順さです。", "video": "", "media": "media/word-441.mp4"}, {"number": 442, "word": "squander", "meaning": "無駄遣いする", "dialogue": [{"speaker": "A", "text": "Did you squander the afternoon?"}, {"speaker": "B", "text": "No. I thoroughly researched which task to avoid."}], "translation": ["午後を無駄にしたの？", "違う。避けるべき仕事を徹底調査した。"], "explanation": "squander は「無駄遣いする」。午後を無駄にしたのではなく、どの仕事を避けるか十分調査したと言います。何も進めなかった時間を、念入りな準備のように正当化しています。", "video": "", "media": "media/word-442.mp4"}, {"number": 443, "word": "stereotype", "meaning": "固定化されたイメージ", "dialogue": [{"speaker": "A", "text": "Does your accountant fit the boring stereotype?"}, {"speaker": "B", "text": "He juggles flaming torches. Very carefully itemized ones."}], "translation": ["会計士は退屈という固定観念に合う？", "火の付いた棒で曲芸する。きちんと明細化した棒で。"], "explanation": "stereotype は「固定化されたイメージ」。退屈そうという会計士像を、燃えるたいまつの曲芸で裏切ります。ただし道具はきちんと項目別に記録され、意外な趣味にも職業らしい几帳面さが残っています。", "video": "", "media": "media/word-443.mp4"}, {"number": 444, "word": "ingenuity", "meaning": "巧みな発想力", "dialogue": [{"speaker": "A", "text": "That repair shows ingenuity."}, {"speaker": "B", "text": "Thanks. The doorbell now rings a saucepan."}], "translation": ["あの修理は巧みな発想だね。", "ありがとう。呼び鈴で鍋が鳴るようになった。"], "explanation": "ingenuity は「巧みな発想力」。修理した呼び鈴は、鍋を鳴らす仕組みになりました。専用部品で元どおりにせず、別用途の道具で必要な機能を実現する工夫です。", "video": "", "media": "media/word-444.mp4"}, {"number": 445, "word": "counterproductive", "meaning": "逆効果の", "dialogue": [{"speaker": "A", "text": "Was the efficiency seminar counterproductive?"}, {"speaker": "B", "text": "It took the entire day we were meant to save."}], "translation": ["効率化研修は逆効果だった？", "節約するはずの一日を全部使った。"], "explanation": "counterproductive は「逆効果の」。時間節約のセミナーで、節約したかった一日全部を使いました。効率を学ぶ活動が時間を奪い、目的に逆行した結果になっています。", "video": "", "media": "media/word-445.mp4"}, {"number": 446, "word": "conceited", "meaning": "うぬぼれた", "dialogue": [{"speaker": "A", "text": "Is your cousin conceited?"}, {"speaker": "B", "text": "He signs birthday cards with a photograph of himself."}], "translation": ["いとこはうぬぼれてる？", "誕生日カードに自分の写真で署名する。"], "explanation": "conceited は「うぬぼれた」。誕生日カードの署名に、自分の写真を添えます。祝われる相手より自分を見せたい気持ちが前に出る、うぬぼれを表す冗談です。", "video": "", "media": "media/word-446.mp4"}, {"number": 447, "word": "manipulative", "meaning": "人を巧みに操ろうとする", "dialogue": [{"speaker": "A", "text": "Was her suggestion manipulative?"}, {"speaker": "B", "text": "She said generous people always volunteer for the washing-up."}], "translation": ["彼女の提案は人を操るものだった？", "寛大な人は必ず皿洗いを申し出ると言った。"], "explanation": "manipulative は「人を巧みに操ろうとする」。「寛大な人は皿洗いに名乗り出る」と言い、相手が良い人でありたくなる気持ちを利用します。直接頼まず、断ると不親切に見える形で誘導しています。", "video": "", "media": "media/word-447.mp4"}, {"number": 448, "word": "remorseful", "meaning": "自分の悪い行いを深く悔いた", "dialogue": [{"speaker": "A", "text": "Was he remorseful about breaking the lamp?"}, {"speaker": "B", "text": "Yes. He wrote it a farewell poem."}], "translation": ["ランプを壊して深く反省してた？", "うん。ランプに別れの詩を書いた。"], "explanation": "remorseful は「自分の悪い行いを深く悔いた」。ランプを壊した人が、ランプへ別れの詩を書いて後悔を示します。物の破損を親しい相手との死別のように扱う、大げさな悔やみ方です。", "video": "", "media": "media/word-448.mp4"}, {"number": 449, "word": "equivocal", "meaning": "どちらとも取れる", "dialogue": [{"speaker": "A", "text": "Was the critic's verdict equivocal?"}, {"speaker": "B", "text": "He called the film an experience that certainly occurred."}], "translation": ["評論家の評はどちらとも取れた？", "確かに発生した体験、と映画を呼んだ。"], "explanation": "equivocal は「どちらとも取れる」。映画評が「確かに起きた体験」では、良いとも悪いとも分かりません。存在した事実しか認めない曖昧さで、評価を避けている態度が伝わります。", "video": "", "media": "media/word-449.mp4"}, {"number": 450, "word": "elusive", "meaning": "捉えたり見つけたりしにくい", "dialogue": [{"speaker": "A", "text": "What's the most elusive thing in your house?"}, {"speaker": "B", "text": "The end of a roll of clear tape."}], "translation": ["家で一番見つけにくいものは？", "透明テープの端。"], "explanation": "elusive は「捉えたり見つけたりしにくい」。家で最も見つけにくいのは、透明テープの端。壮大な謎を期待する言い方に、ごく身近で探しづらい物を当てはめています。", "video": "", "media": "media/word-450.mp4"}, {"number": 451, "word": "intermittent", "meaning": "途切れ途切れの", "dialogue": [{"speaker": "A", "text": "Is the internet connection intermittent?"}, {"speaker": "B", "text": "Yes. My video calls now resemble modern dance."}], "translation": ["通信は途切れ途切れ？", "うん。ビデオ通話が現代舞踊みたいになった。"], "explanation": "intermittent は「途切れ途切れの」。通信が途切れるビデオ通話をモダンダンスに例えています。映像の停止や飛びによるぎこちない動きを、意図的な表現のように言い換えています。", "video": "", "media": "media/word-451.mp4"}, {"number": 452, "word": "overlook", "meaning": "見落とす", "dialogue": [{"speaker": "A", "text": "Did we overlook anything on the camping list?"}, {"speaker": "B", "text": "Just the tent. The marshmallows are beautifully organized."}], "translation": ["キャンプのリストで何か見落とした？", "テントだけ。マシュマロは完璧に整理済み。"], "explanation": "overlook は「見落とす」。キャンプ用品で忘れたのは最重要のテントなのに、お菓子は完璧に整理済み。準備に力を入れた部分と、本当に必要な物の優先順位が逆転しています。", "video": "", "media": "media/word-452.mp4"}, {"number": 453, "word": "evade", "meaning": "巧みに避ける", "dialogue": [{"speaker": "A", "text": "How did he evade the question about his age?"}, {"speaker": "B", "text": "He gave us a detailed history of calendars."}], "translation": ["年齢の質問をどうかわした？", "暦の歴史を詳しく教えてくれた。"], "explanation": "evade は「巧みに避ける」。年齢を聞かれ、暦の歴史を詳しく説明します。関連がありそうな話を長くすることで、自分の年齢という具体的な質問から逃げています。", "video": "", "media": "media/word-453.mp4"}, {"number": 454, "word": "hoard", "meaning": "ため込む", "dialogue": [{"speaker": "A", "text": "Why hoard so many empty jars?"}, {"speaker": "B", "text": "Someday I'll make jam. The jars are very patient."}], "translation": ["なぜ空瓶をそんなにため込むの？", "いつかジャムを作る。瓶は辛抱強いんだ。"], "explanation": "hoard は「ため込む」。いつかジャムを作るつもりで空き瓶を大量にため、瓶は辛抱強いと評します。長く実行されない計画を、待たされる道具の立場から描いています。", "video": "", "media": "media/word-454.mp4"}, {"number": 455, "word": "consensus", "meaning": "集団での意見の一致", "dialogue": [{"speaker": "A", "text": "Did the committee reach a consensus?"}, {"speaker": "B", "text": "Yes. Everyone agreed the biscuits were better last week."}], "translation": ["委員会は合意に達した？", "うん。先週のビスケットの方がよかった、と。"], "explanation": "consensus は「集団での意見の一致」。委員会全員が合意したのは、先週のビスケットの方がおいしかったという点。重要な議題への結論を期待したのに、おやつの評価だけ一致しています。", "video": "", "media": "media/word-455.mp4"}, {"number": 456, "word": "foresight", "meaning": "先を見通す力", "dialogue": [{"speaker": "A", "text": "That was good foresight, bringing a spare shirt."}, {"speaker": "B", "text": "I know how enthusiastically he opens ketchup."}], "translation": ["替えのシャツを持つとは先を見てたね。", "彼のケチャップの開け方を知ってるから。"], "explanation": "foresight は「先を見通す力」。替えのシャツを持った先見性は、相手がケチャップを勢いよく開けると知っていたから。大げさな未来予測ではなく、汚れそうな習慣を見越した準備です。", "video": "", "media": "media/word-456.mp4"}, {"number": 457, "word": "indecisive", "meaning": "決断できない", "dialogue": [{"speaker": "A", "text": "Are you indecisive about dessert?"}, {"speaker": "B", "text": "I'll answer after another look at everyone else's plate."}], "translation": ["デザートが決められないの？", "皆の皿をもう一度見てから答える。"], "explanation": "indecisive は「決断できない」。デザートに迷っているかどうかさえ、皆の皿をもう一度見てから答えると言います。優柔不断かという質問への返答も決められず、態度を実演しています。", "video": "", "media": "media/word-457.mp4"}, {"number": 458, "word": "presumptuous", "meaning": "立場をわきまえず出過ぎた", "dialogue": [{"speaker": "A", "text": "Was it presumptuous to rearrange their kitchen?"}, {"speaker": "B", "text": "You were delivering a parcel."}], "translation": ["台所を並べ替えたのは出過ぎた行動？", "君は荷物の配達員だったんだよ。"], "explanation": "presumptuous は「立場をわきまえず出過ぎた」。他人の台所を勝手に整理した人は、家事を頼まれたのでなく荷物の配達に来ただけ。立場に比べて踏み込みすぎた行動が、短い指摘で明らかになります。", "video": "", "media": "media/word-458.mp4"}, {"number": 459, "word": "deceitful", "meaning": "人をだますような", "dialogue": [{"speaker": "A", "text": "Was the seller deceitful about the antique?"}, {"speaker": "B", "text": "He forgot to remove the manufactured yesterday sticker."}], "translation": ["売り手は骨董品について嘘をついた？", "昨日製造のシールを剥がし忘れていた。"], "explanation": "deceitful は「人をだますような」。骨董品として売った品に「昨日製造」のシールが残っています。古い物だという説明を、商品自身の表示があっさり否定するオチです。", "video": "", "media": "media/word-459.mp4"}, {"number": 460, "word": "wistful", "meaning": "かなわないものを切なく思う", "dialogue": [{"speaker": "A", "text": "Why are you looking wistful at that cake?"}, {"speaker": "B", "text": "I'm remembering the metabolism I had at nineteen."}], "translation": ["ケーキを切なそうに見るのはなぜ？", "19歳の頃の代謝を思い出してる。"], "explanation": "wistful は「かなわないものを切なく思う」。ケーキを懐かしそうに見るのは、その味より19歳の頃の代謝を思い出すから。以前のように気軽に食べたい気持ちが、体の変化への郷愁になっています。", "video": "", "media": "media/word-460.mp4"}, {"number": 461, "word": "emphatic", "meaning": "強調した", "dialogue": [{"speaker": "A", "text": "Was his refusal emphatic?"}, {"speaker": "B", "text": "He said no in three languages and closed the curtains."}], "translation": ["彼の拒否は強いものだった？", "3か国語で断り、カーテンを閉めた。"], "explanation": "emphatic は「強調した」。断り方が3言語の「ノー」に加え、カーテンを閉める動作まで伴います。言葉でも態度でも拒否を重ね、誤解の余地をなくしています。", "video": "", "media": "media/word-461.mp4"}, {"number": 462, "word": "illusory", "meaning": "実在するように見えて実はない", "dialogue": [{"speaker": "A", "text": "Was the extra space in the suitcase illusory?"}, {"speaker": "B", "text": "Yes. Then she added the just-in-case shoes."}], "translation": ["スーツケースの余裕は幻想だった？", "うん。その後、念のための靴が追加された。"], "explanation": "illusory は「実在するように見えて実はない」。スーツケースに余裕があると思ったのは、「念のため」の靴が入るまで。まだ荷物が全部そろっていなかったので、空きスペースは見かけだけでした。", "video": "", "media": "media/word-462.mp4"}, {"number": 463, "word": "perpetual", "meaning": "絶えず続く", "dialogue": [{"speaker": "A", "text": "Why is the office in perpetual renovation?"}, {"speaker": "B", "text": "Every finished room makes the next one look worse."}], "translation": ["なぜ職場は永遠に改装中なの？", "完成した部屋の隣が、必ず古く見えるから。"], "explanation": "perpetual は「絶えず続く」。一部屋きれいに改装すると隣が見劣りし、今度はそこを直したくなります。完成が次の工事の動機となるため、終わりのない改装が続きます。", "video": "", "media": "media/word-463.mp4"}, {"number": 464, "word": "understate", "meaning": "実際より控えめに述べる", "dialogue": [{"speaker": "A", "text": "Did he understate the repair costs?"}, {"speaker": "B", "text": "He said a few pennies. Apparently, in a very large truck."}], "translation": ["修理費を控えめに言った？", "小銭が少し、と。とても大きなトラック一杯らしい。"], "explanation": "understate は「実際より控えめに述べる」。修理費を小銭程度と言ったものの、その小銭を運ぶには巨大なトラックが必要でした。単位を小さくして金額を控えめに聞かせる、大げさな言葉遊びです。", "video": "", "media": "media/word-464.mp4"}, {"number": 465, "word": "endorse", "meaning": "公に支持する", "dialogue": [{"speaker": "A", "text": "Will you endorse my new cookbook?"}, {"speaker": "B", "text": "Can I see the survival statistics first?"}], "translation": ["新しい料理本を推薦してくれる？", "先に生存率を見てもいい？"], "explanation": "endorse は「公に支持する」。料理本の推薦を頼まれ、まず生存率を見たいと返します。おいしさより食べた人が無事かを心配することで、料理への不信を誇張しています。", "video": "", "media": "media/word-465.mp4"}, {"number": 466, "word": "splurge", "meaning": "思い切って大金を使う", "dialogue": [{"speaker": "A", "text": "Did you splurge on the hotel?"}, {"speaker": "B", "text": "Yes. The robe came with an attitude of superiority."}], "translation": ["ホテルに奮発した？", "うん。バスローブに優越感が付いてきた。"], "explanation": "splurge は「思い切って大金を使う」。奮発したホテルのバスローブには、優越感まで付いてきたと言います。豪華な物を身につけただけで、自分まで偉くなったような気分になる冗談です。", "video": "", "media": "media/word-466.mp4"}, {"number": 467, "word": "conformity", "meaning": "周囲に合わせること", "dialogue": [{"speaker": "A", "text": "Does the club encourage conformity?"}, {"speaker": "B", "text": "Everyone must express individuality in the approved shade of blue."}], "translation": ["クラブは同調を求める？", "全員、指定の青で個性を表現する決まり。"], "explanation": "conformity は「周囲に合わせること」。個性は表現してよいが、使う青色は指定どおりでなければいけません。自由を勧める言葉と、全員同じにさせる規則の矛盾です。", "video": "", "media": "media/word-467.mp4"}, {"number": 468, "word": "hindsight", "meaning": "後になって分かること", "dialogue": [{"speaker": "A", "text": "What did hindsight teach you about the picnic?"}, {"speaker": "B", "text": "That under a sprinkler is not a type of shade."}], "translation": ["ピクニックを後から振り返って学んだことは？", "散水機の下は日陰の一種ではない。"], "explanation": "hindsight は「後になって分かること」。ピクニック後に学んだのは、散水機の下は日陰の一種ではないこと。涼しさを期待してもぬれるだけという、経験後には明白な判断ミスを振り返っています。", "video": "", "media": "media/word-468.mp4"}, {"number": 469, "word": "pretentious", "meaning": "気取った", "dialogue": [{"speaker": "A", "text": "Is the cafe pretentious?"}, {"speaker": "B", "text": "They call toast a bread-based awakening."}], "translation": ["カフェは気取ってる？", "トーストをパン由来の覚醒と呼んでる。"], "explanation": "pretentious は「気取った」。ただのトーストを「パンを基盤とした目覚め」と呼びます。身近な食べ物を必要以上に高尚な言葉で包む、気取った店の表現をからかっています。", "video": "", "media": "media/word-469.mp4"}, {"number": 470, "word": "unassuming", "meaning": "気取らず控えめな", "dialogue": [{"speaker": "A", "text": "The champion seems unassuming."}, {"speaker": "B", "text": "Yes. He stores his medals in a biscuit tin labeled screws."}], "translation": ["優勝者は気取らないね。", "うん。メダルは「ねじ」と書いた菓子缶に入れてる。"], "explanation": "unassuming は「気取らず控えめな」。優勝メダルを「ねじ」と書いたビスケット缶にしまっています。実績を見せびらかす飾り方と正反対の、地味で実用的な保管方法です。", "video": "", "media": "media/word-470.mp4"}, {"number": 471, "word": "hypocritical", "meaning": "言うことと行いが矛盾した", "dialogue": [{"speaker": "A", "text": "Was his lecture hypocritical?"}, {"speaker": "B", "text": "He told us to put phones away while checking his messages."}], "translation": ["彼の説教は言行不一致だった？", "自分のメッセージを見ながら携帯をしまえと言った。"], "explanation": "hypocritical は「言うことと行いが矛盾した」。携帯をしまえと説教しながら、自分はメッセージを確認しています。他人に要求する規則を自分では守らない、分かりやすい言行不一致です。", "video": "", "media": "media/word-471.mp4"}, {"number": 472, "word": "ambivalent", "meaning": "相反する気持ちを抱いた", "dialogue": [{"speaker": "A", "text": "Are you ambivalent about your promotion?"}, {"speaker": "B", "text": "I love the raise. The extra meetings have their own weather system."}], "translation": ["昇進には複雑な気持ち？", "昇給は好き。増えた会議は独自の気候を形成してる。"], "explanation": "ambivalent は「相反する気持ちを抱いた」。昇進の昇給は嬉しくても、会議は独自の気象が生じそうなほど増えます。一つの変化に対する喜びと憂鬱が同居し、会議の多さを大げさに表しています。", "video": "", "media": "media/word-472.mp4"}, {"number": 473, "word": "rhetorical", "meaning": "答えを求めず効果を狙った", "dialogue": [{"speaker": "A", "text": "Was how hard can it be a rhetorical question?"}, {"speaker": "B", "text": "Yes. The flat-pack furniture gave a very detailed answer anyway."}], "translation": ["「そんなに難しい？」は答えを求めない質問？", "うん。でも組立家具が詳しく答えてくれた。"], "explanation": "rhetorical は「答えを求めず効果を狙った」。「そんなに難しいか？」は簡単だと言いたい反語なのに、組み立て家具が難しさで答えてきます。答えを求めないつもりの問いへ、現実が手強い回答を返します。", "video": "", "media": "media/word-473.mp4"}, {"number": 474, "word": "deceptive", "meaning": "見かけにだまされやすい", "dialogue": [{"speaker": "A", "text": "Is the path's gentle appearance deceptive?"}, {"speaker": "B", "text": "Yes. The hill is hiding behind its smaller friends."}], "translation": ["道が緩やかに見えるのは見せかけ？", "うん。大きな坂が小さな仲間の後ろに隠れてる。"], "explanation": "deceptive は「見かけにだまされやすい」。平坦そうに見えた道の先で、大きな坂が小さな坂の陰に隠れていました。穏やかな第一印象にだまされた感覚を、坂が意図的に隠れるように描いています。", "video": "", "media": "media/word-474.mp4"}, {"number": 475, "word": "fleeting", "meaning": "ほんの短時間の", "dialogue": [{"speaker": "A", "text": "Was your feeling of success fleeting?"}, {"speaker": "B", "text": "It lasted until the next email arrived."}], "translation": ["成功の喜びは一瞬だった？", "次のメールが来るまで続いた。"], "explanation": "fleeting は「ほんの短時間の」。仕事を終えた達成感は、次のメールが届くまでしか続きません。一区切りついた喜びを新しい仕事がすぐ打ち消す、短い満足の瞬間です。", "video": "", "media": "media/word-475.mp4"}, {"number": 476, "word": "overstate", "meaning": "実際より大きく述べる", "dialogue": [{"speaker": "A", "text": "Did you overstate your experience with horses?"}, {"speaker": "B", "text": "I counted every ride on a carousel."}], "translation": ["乗馬経験を大げさに言った？", "メリーゴーラウンドに乗るたび数えた。"], "explanation": "overstate は「実際より大きく述べる」。乗馬経験を多く見せるため、メリーゴーラウンドに乗った回数まで数えています。見た目が馬でも実際の乗馬ではない経験を足して、水増ししています。", "video": "", "media": "media/word-476.mp4"}, {"number": 477, "word": "boycott", "meaning": "抗議として利用を拒む", "dialogue": [{"speaker": "A", "text": "Will you boycott the overpriced cafe?"}, {"speaker": "B", "text": "Yes. Right after I use my final loyalty stamp."}], "translation": ["高すぎるカフェを利用拒否する？", "うん。最後のスタンプを使った直後に。"], "explanation": "boycott は「抗議として利用を拒む」。高すぎるカフェを利用しないと決めても、最後のポイント特典は使ってから。抗議の信念と得をしたい気持ちがぶつかり、行動開始を先延ばしにしています。", "video": "", "media": "media/word-477.mp4"}, {"number": 478, "word": "relinquish", "meaning": "権利や所有を手放す", "dialogue": [{"speaker": "A", "text": "Will you relinquish control of the barbecue?"}, {"speaker": "B", "text": "Only after a formal transfer of the tongs."}], "translation": ["バーベキューの指揮を譲る？", "トングの正式な引き継ぎが済んだら。"], "explanation": "relinquish は「権利や所有を手放す」。バーベキューの担当を譲るにも、トングの正式な引き渡しが必要です。調理の主導権を国家の権限のように扱う、大げさな交代儀式です。", "video": "", "media": "media/word-478.mp4"}, {"number": 479, "word": "autonomy", "meaning": "自分で決める自由", "dialogue": [{"speaker": "A", "text": "Do you have autonomy at work?"}, {"speaker": "B", "text": "Yes. I choose which pen to use for the mandatory forms."}], "translation": ["職場に自己決定の自由はある？", "うん。必須書類に使うペンは選べる。"], "explanation": "autonomy は「自分で決める自由」。仕事の裁量として認められるのは、義務の書類を書くペンを選ぶことだけ。自由があると言いながら、その範囲が極端に小さい職場への皮肉です。", "video": "", "media": "media/word-479.mp4"}, {"number": 480, "word": "discretion", "meaning": "慎重に判断する力", "dialogue": [{"speaker": "A", "text": "Did you use discretion when describing the meal?"}, {"speaker": "B", "text": "I complimented the plates. Very sincerely."}], "translation": ["料理の感想は慎重に判断した？", "皿を褒めた。心からね。"], "explanation": "discretion は「慎重に判断する力」。料理の感想を慎重に伝えるため、皿を心から褒めます。まずいとは言わず、正直に褒められる別の対象へ焦点を移す配慮です。", "video": "", "media": "media/word-480.mp4"}, {"number": 481, "word": "plausible", "meaning": "もっともらしい", "dialogue": [{"speaker": "A", "text": "Is a pigeon stealing my keys plausible?"}, {"speaker": "B", "text": "More plausible than you putting them in the fridge again."}], "translation": ["ハトが鍵を盗んだ話はあり得る？", "また冷蔵庫に入れた話よりはありそう。"], "explanation": "plausible は「もっともらしい」。鍵をハトに盗まれた話より、また冷蔵庫へ入れた方がありそうです。ところが返答は逆を言い、過去のうっかりを持ち出しながら、ありそうもない弁明を皮肉に受け入れています。", "video": "", "media": "media/word-481.mp4"}, {"number": 482, "word": "implausible", "meaning": "ありそうもない", "dialogue": [{"speaker": "A", "text": "Was his story implausible?"}, {"speaker": "B", "text": "He claimed the dog submitted his tax return."}], "translation": ["彼の話はありそうもなかった？", "犬が確定申告を提出したと言ってた。"], "explanation": "implausible は「ありそうもない」。犬が確定申告を提出したという話は、動物に人の複雑な事務を任せています。日常的な手続きをあり得ない担当者へ結びつけ、信じ難さを示しています。", "video": "", "media": "media/word-482.mp4"}, {"number": 483, "word": "redundant", "meaning": "余分で不要な", "dialogue": [{"speaker": "A", "text": "Is that label redundant?"}, {"speaker": "B", "text": "It says wet water. I'd be more worried about dry water."}], "translation": ["あのラベルは不要な重複？", "濡れた水、とある。乾いた水の方が心配だよ。"], "explanation": "redundant は「余分で不要な」。水に「ぬれている」と表示するのは、分かりきった情報の重複です。むしろ「乾いた水」なら気になると返すことで、不要な修飾の可笑しさを際立たせています。", "video": "", "media": "media/word-483.mp4"}, {"number": 484, "word": "obsolete", "meaning": "時代遅れの", "dialogue": [{"speaker": "A", "text": "Is this technology obsolete?"}, {"speaker": "B", "text": "The museum asked whether they could borrow my charger."}], "translation": ["この技術は時代遅れ？", "博物館が僕の充電器を借りたがった。"], "explanation": "obsolete は「時代遅れの」。充電器が古すぎて、博物館から展示用に借りたいと言われます。まだ日用品として使っている物を歴史資料扱いする、時代遅れの誇張です。", "video": "", "media": "media/word-484.mp4"}, {"number": 485, "word": "tedious", "meaning": "退屈でうんざりする", "dialogue": [{"speaker": "A", "text": "Was entering the data tedious?"}, {"speaker": "B", "text": "I started naming the rows for company."}], "translation": ["データ入力は退屈だった？", "寂しくて行に名前を付け始めた。"], "explanation": "tedious は「退屈でうんざりする」。単調なデータ入力が寂しくなり、表の行に名前を付けて話し相手にします。無機的な作業を人付き合いに変えるほどの退屈さを描いています。", "video": "", "media": "media/word-485.mp4"}, {"number": 486, "word": "trivial", "meaning": "取るに足りない", "dialogue": [{"speaker": "A", "text": "Is this dispute trivial?"}, {"speaker": "B", "text": "It's about whose mug has the better handle."}], "translation": ["取るに足りない争いなの？", "どちらのマグの取っ手が優れているか、という争い。"], "explanation": "trivial は「取るに足りない」。争点はマグカップの取っ手の優劣。大きな対立のように見せながら、生活上ほとんど影響のない好みの違いを持ち出しています。", "video": "", "media": "media/word-486.mp4"}, {"number": 487, "word": "arbitrary", "meaning": "根拠なく決めた", "dialogue": [{"speaker": "A", "text": "Why is the deadline arbitrary?"}, {"speaker": "B", "text": "The boss chose Tuesday because he likes the sound."}], "translation": ["なぜ締め切りは根拠がないの？", "上司が響きを気に入って火曜にした。"], "explanation": "arbitrary は「根拠なく決めた」。締め切りが火曜なのは、上司がその言葉の響きを気に入っているから。作業量や予定と関係のない基準で決まる、根拠のなさがオチです。", "video": "", "media": "media/word-487.mp4"}, {"number": 488, "word": "tentative", "meaning": "仮の・まだ確定していない", "dialogue": [{"speaker": "A", "text": "Is the dinner plan tentative?"}, {"speaker": "B", "text": "Yes. It depends on whether my bread dough develops ambition."}], "translation": ["夕食の予定はまだ仮？", "うん。パン生地に膨らむ意欲が出るか次第。"], "explanation": "tentative は「仮の・まだ確定していない」。夕食の予定は、パン生地がやる気を出すか次第。膨らむかどうかを生地の意欲に見立て、まだ確定できない調理の進み具合を表しています。", "video": "", "media": "media/word-488.mp4"}, {"number": 489, "word": "inevitable", "meaning": "避けられない", "dialogue": [{"speaker": "A", "text": "What's inevitable when you wash the car?"}, {"speaker": "B", "text": "A bird announces its opinion from above."}], "translation": ["洗車すると避けられないことは？", "鳥が上から意見を表明する。"], "explanation": "inevitable は「避けられない」。洗車すると鳥が上から「意見を述べる」と言います。ふんを落とされる残念な出来事を批評になぞらえ、きれいにした直後の運の悪さを嘆いています。", "video": "", "media": "media/word-489.mp4"}, {"number": 490, "word": "unprecedented", "meaning": "前例のない", "dialogue": [{"speaker": "A", "text": "Was the meeting's result unprecedented?"}, {"speaker": "B", "text": "Yes. We made a decision without forming a subcommittee."}], "translation": ["会議の結果は前例がなかった？", "うん。小委員会を作らずに決定した。"], "explanation": "unprecedented は「前例のない」。会議で小委員会を作らず、その場で決定できたことが前代未聞。普通に効率よく進むだけで驚かれるほど、普段は手続きが多いという皮肉です。", "video": "", "media": "media/word-490.mp4"}, {"number": 491, "word": "discreet", "meaning": "目立たないよう配慮した", "dialogue": [{"speaker": "A", "text": "Was the waiter discreet about the surprise?"}, {"speaker": "B", "text": "He whispered happy birthday to every table until someone answered."}], "translation": ["店員はサプライズに気を配った？", "返事があるまで全テーブルで誕生日おめでとうと囁いた。"], "explanation": "discreet は「目立たないよう配慮した」。誕生日を内緒にするため小声で話しても、全卓に順番に聞いて回っています。音量は控えめでも知らせる範囲は広く、慎重さの狙いが外れています。", "video": "", "media": "media/word-491.mp4"}, {"number": 492, "word": "impartial", "meaning": "公平な", "dialogue": [{"speaker": "A", "text": "Is the judge impartial in the baking contest?"}, {"speaker": "B", "text": "He eats equal quantities from every plate. Repeatedly."}], "translation": ["お菓子コンテストの審査員は公平？", "各皿から同量ずつ食べる。何度も。"], "explanation": "impartial は「公平な」。審査員はすべての皿から同量を何度も食べます。公平さを守っているようで、たくさん食べる都合のよい理由にもなっています。", "video": "", "media": "media/word-492.mp4"}, {"number": 493, "word": "complacent", "meaning": "現状に満足し油断した", "dialogue": [{"speaker": "A", "text": "Were you complacent after your first driving lesson?"}, {"speaker": "B", "text": "A little. I started comparing sports cars before learning reverse."}], "translation": ["初回の運転授業で油断した？", "少し。後退を習う前にスポーツカーを比べ始めた。"], "explanation": "complacent は「現状に満足し油断した」。運転初回の成功で満足し、後退を習う前からスポーツカーを比較しています。まだ基本を覚える途中なのに、十分できた気になる早すぎる自信です。", "video": "", "media": "media/word-493.mp4"}, {"number": 494, "word": "condescending", "meaning": "見下すような", "dialogue": [{"speaker": "A", "text": "Was his explanation condescending?"}, {"speaker": "B", "text": "He explained how a spoon works. Slowly."}], "translation": ["説明は見下す感じだった？", "スプーンの使い方を説明した。ゆっくりと。"], "explanation": "condescending は「見下すような」。相手へスプーンの使い方を、しかもゆっくり説明します。普通は知っていることまで教え込む態度が、親切でなく見下しとして響きます。", "video": "", "media": "media/word-494.mp4"}, {"number": 495, "word": "vindictive", "meaning": "仕返しをしたがる", "dialogue": [{"speaker": "A", "text": "Was the review vindictive?"}, {"speaker": "B", "text": "He gave the hotel one star because it stopped him taking the chandelier."}], "translation": ["その評価は仕返しだった？", "シャンデリアの持ち帰りを止められ、星1個にした。"], "explanation": "vindictive は「仕返しをしたがる」。ホテルのシャンデリアを持ち帰らせてもらえず、星1つを付けます。正当なサービス評価ではなく、無理な要求を断られた腹いせになっています。", "video": "", "media": "media/word-495.mp4"}, {"number": 496, "word": "nonchalant", "meaning": "平然とした", "dialogue": [{"speaker": "A", "text": "How did you remain nonchalant when the cake collapsed?"}, {"speaker": "B", "text": "I announced that dessert would be served horizontally."}], "translation": ["ケーキが崩れてなぜ平然としていたの？", "デザートは横向きで出すと発表した。"], "explanation": "nonchalant は「平然とした」。ケーキが崩れても、デザートは横向きで提供すると平然と発表します。失敗を予定された盛り付けのように言い換え、動揺を見せません。", "video": "", "media": "media/word-496.mp4"}, {"number": 497, "word": "exasperated", "meaning": "いら立ってうんざりした", "dialogue": [{"speaker": "A", "text": "Why is the teacher exasperated?"}, {"speaker": "B", "text": "The class asked whether the silence exercise could be a group discussion."}], "translation": ["先生はなぜうんざりしてるの？", "静かな練習をグループ討論にできるか聞かれた。"], "explanation": "exasperated は「いら立ってうんざりした」。静かにする練習をグループ討論にしてよいかと、生徒たちが尋ねます。練習の目的そのものに反する提案で、教師がうんざりする理由が伝わります。", "video": "", "media": "media/word-497.mp4"}, {"number": 498, "word": "apprehensive", "meaning": "先のことを心配している", "dialogue": [{"speaker": "A", "text": "Are you apprehensive about the haircut?"}, {"speaker": "B", "text": "The stylist just said let's try something brave."}], "translation": ["散髪が不安なの？", "美容師が今、勇気ある挑戦をしようと言った。"], "explanation": "apprehensive は「先のことを心配している」。美容師が「思い切ったことを試そう」と言ったため、散髪が不安になります。客は無難な仕上がりを望むのに、実験が始まりそうな言葉を聞いた落差です。", "video": "", "media": "media/word-498.mp4"}, {"number": 499, "word": "serendipity", "meaning": "思いがけない幸運な発見", "dialogue": [{"speaker": "A", "text": "Was finding that cafe serendipity?"}, {"speaker": "B", "text": "Yes. I got lost and discovered a cake worth getting lost for."}], "translation": ["あのカフェの発見は幸運な偶然？", "うん。迷う価値のあるケーキに出会った。"], "explanation": "serendipity は「思いがけない幸運な発見」。道に迷った失敗から、迷ってでも食べに行きたいケーキを見つけます。予定外の出来事が価値ある発見につながる、幸運な偶然です。", "video": "", "media": "media/word-499.mp4"}, {"number": 500, "word": "anticlimax", "meaning": "期待外れの結末", "dialogue": [{"speaker": "A", "text": "Was the treasure hunt an anticlimax?"}, {"speaker": "B", "text": "After six clues, the prize was a map back to the car."}], "translation": ["宝探しは期待外れの結末だった？", "六つの謎の後、賞品は車に戻る地図だった。"], "explanation": "anticlimax は「期待外れの結末」。宝探しで6つのヒントを解いたご褒美が、駐車した車へ戻る地図でした。冒険の最後に大きな宝を期待させて、ただ帰宅できるだけという拍子抜けです。", "video": "", "media": "media/word-500.mp4"}];
const el=id=>document.getElementById(id);let current=items[0];
function list(){const q=el('search').value.trim().toLowerCase().replace(/^#/,'');const found=items.filter(i=>!q||(/^\d+$/.test(q)?i.number===Number(q):[i.word,i.meaning].join(' ').toLowerCase().includes(q)));el('count').textContent=`${found.length} / ${items.length}語`;el('empty').hidden=!!found.length;el('list').replaceChildren(...found.map(i=>{const b=document.createElement('button');b.textContent=`${String(i.number).padStart(3,'0')}  ${i.word}`;b.setAttribute('aria-current',String(i===current));b.onclick=()=>choose(i.number,true);return b;}));}
function paragraphs(id,values){el(id).replaceChildren(...values.map(t=>{const p=document.createElement('p');p.textContent=t;return p;}));}
function choose(n,update=false){current=items.find(i=>i.number===n)||items[0];el('number').textContent=`WORD ${String(current.number).padStart(3,'0')} / ${items.length}`;for(const key of ['word','meaning','explanation'])el(key).textContent=current[key];paragraphs('dialogue',current.dialogue.map(d=>`${d.speaker}: ${d.text}`));paragraphs('translation',current.translation);el('detail').querySelector('details').open=false;const help=el('media-help');help.replaceChildren();const link=document.createElement('a');link.href=current.video?`https://www.youtube.com/watch?v=${current.video}`:current.media;link.target='_blank';link.rel='noopener noreferrer';link.textContent=current.video?'YouTubeで見る ↗':'動画を別画面で見る ↗';help.append(current.video?'再生するとYouTubeに接続します。 ':'再生できない場合は ',link);el('prev').disabled=current.number===1;el('next').disabled=current.number===items.length;const b=document.createElement('button');b.textContent=current.video?'YouTubeプレーヤーを表示':'▶ 動画を再生';b.onclick=()=>{if(current.media){const v=document.createElement('video');v.controls=true;v.playsInline=true;v.src=current.media;v.setAttribute('aria-label',current.word+' — Word of the Day');el('player').replaceChildren(v);v.play().catch(()=>{});return;}const f=document.createElement('iframe');f.title=`${current.word} — Word of the Day`;f.src=`https://www.youtube-nocookie.com/embed/${current.video}?autoplay=0&playsinline=1`;f.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';f.allowFullscreen=true;f.referrerPolicy='strict-origin-when-cross-origin';el('player').replaceChildren(f);};el('player').replaceChildren(b);if(update)history.pushState(null,'',`#word-${current.number}`);list();}
el('search').oninput=list;el('prev').onclick=()=>choose(current.number-1,true);el('next').onclick=()=>choose(current.number+1,true);function fromHash(){choose(Number(location.hash.match(/^#word-(\d+)$/)?.[1])||1);}window.addEventListener('hashchange',fromHash);window.addEventListener('popstate',fromHash);fromHash();
</script></body></html>
