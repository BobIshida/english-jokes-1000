<script>
const items=[{"number": 1, "word": "balance", "meaning": "両立、釣り合い", "dialogue": [{"speaker": "A", "text": "How's your work-life balance?"}, {"speaker": "B", "text": "Work gets five days. Life gets two."}], "translation": ["仕事と私生活のバランスはどう？", "仕事が五日。生活は二日。"], "explanation": "work-life balance は「仕事と私生活の両立」。ところが返事は「仕事に5日、生活に2日」と、1週間の配分を数字で示しています。バランスが取れているかを聞かれて、むしろ仕事に偏っている現実が見えてしまう、働く人の「あるある」です。", "video": "pCkuIrPiYkw"}, {"number": 2, "word": "productive", "meaning": "生産的な", "dialogue": [{"speaker": "A", "text": "Was your morning productive?"}, {"speaker": "B", "text": "Very. I finished my to-do list. Tomorrow I'll do the things on it."}], "translation": ["午前中ははかどった？", "とても。やることリストを完成させたよ。中身は明日やる。"], "explanation": "productive は「成果を上げる、生産的な」。たくさん仕事を終えたのかと思ったら、完成したのは「やることリスト」だけでした。リストの中身に取りかかるのは明日。計画を立てた達成感と、実際の成果とのズレがオチです。", "video": "PT2Jtf1ix_s"}, {"number": 3, "word": "considerate", "meaning": "思いやりのある", "dialogue": [{"speaker": "A", "text": "Is your neighbor considerate?"}, {"speaker": "B", "text": "Very. He drums only when I vacuum. Now I clean for three hours."}], "translation": ["隣の人は気遣いができるの？", "とても。掃除機をかけている間だけドラムをたたく。おかげで掃除は三時間。"], "explanation": "considerate は「相手を思いやる」。隣人は掃除機の音に合わせてドラムをたたき、気を遣っているつもりです。でも、その説明の直後に「今では3時間も掃除している」と続きます。ドラムの音を紛らわせるために掃除を続ける羽目になった、と読むと、親切がかえって負担になる皮肉が見えます。", "video": "RHMHMIwN3u8"}, {"number": 4, "word": "frustrated", "meaning": "思うようにいかずいら立った", "dialogue": [{"speaker": "A", "text": "Why are you so frustrated?"}, {"speaker": "B", "text": "To report that the app won't open, I have to open the app."}], "translation": ["どうしてそんなにいら立っているの？", "アプリが開かないと報告するには、そのアプリを開かなきゃいけない。"], "explanation": "frustrated は「思いどおりにいかず、いら立った」。アプリが開かないと報告したいのに、報告するにはそのアプリを開く必要があります。解決の入口が、まさに困っている問題でふさがれている、という理不尽さが笑いどころです。", "video": "X-IjbseyuVM"}, {"number": 5, "word": "unexpected", "meaning": "予想外の", "dialogue": [{"speaker": "A", "text": "Did the magic show have an unexpected ending?"}, {"speaker": "B", "text": "Yes. He made my watch disappear, then announced his retirement."}], "translation": ["マジックショーの結末は予想外だった？", "うん。僕の時計を消してから、引退を宣言した。"], "explanation": "unexpected は「予想外の」。手品で消えた時計は、最後に戻ってくると思いますよね。ところが手品師はそのまま引退を発表！ 時計を戻すはずの展開が突然打ち切られ、持ち主だけが取り残されるのがオチです。", "video": "sIHXSwjRptE"}, {"number": 6, "word": "consider", "meaning": "よく考える", "dialogue": [{"speaker": "A", "text": "Would you consider working here for less money?"}, {"speaker": "B", "text": "Certainly. Would you consider getting less work?"}], "translation": ["もっと安い給料でここで働くことを検討してもらえますか？", "もちろん。仕事量を減らすことも検討してもらえますか？"], "explanation": "consider は「よく考える、検討する」。雇う側の「もっと安い給料で働くことを考えてくれる？」に、働く側も同じ形で「では、仕事が減ることも考えてくれますか？」と返しています。自分だけに都合のよい提案を、そのまま相手に返す切り返しです。", "video": "XN1ungo0hCg"}, {"number": 7, "word": "recommend", "meaning": "勧める", "dialogue": [{"speaker": "A", "text": "Would you recommend that hotel?"}, {"speaker": "B", "text": "Absolutely. The Wi-Fi was so bad, I finally finished writing my novel."}], "translation": ["あのホテルはおすすめ？", "もちろん。Wi-Fiがひどくて、ようやく小説を書き終えられた。"], "explanation": "recommend は「勧める」。ホテルを絶賛する理由が、普通なら欠点になる「Wi-Fiのひどさ」でした。ネットに気を取られなくなり、小説を書き終えられたからです。悪い設備を、自分にとっての思わぬ利点として評価しているのが面白いところです。", "video": "EXYhKrpRbzo"}, {"number": 8, "word": "organize", "meaning": "整理して整える", "dialogue": [{"speaker": "A", "text": "How did you organize your bills?"}, {"speaker": "B", "text": "By how nervous I feel opening them. This drawer is terrifying."}], "translation": ["請求書はどう整理したの？", "開けるときの怖さ順。この引き出しは恐怖だよ。"], "explanation": "organize は「整理する」。請求書なら日付や支払期限で分けそうですが、この人は「開けるのがどれだけ怖いか」で分類しています。「この引き出しは恐ろしい」と、請求額への不安を整理の基準にしてしまうのがオチです。", "video": "rIT_gcFA8Mc"}, {"number": 9, "word": "agenda", "meaning": "会議の議題一覧", "dialogue": [{"speaker": "A", "text": "What's first on today's agenda?"}, {"speaker": "B", "text": "Deciding which meeting to cancel so we can get some work done."}], "translation": ["今日の最初の議題は？", "仕事を進めるために、どの会議をやめるか決めること。"], "explanation": "agenda は「会議の議題一覧」。最初の議題が「仕事をするために、どの会議をやめるか」です。仕事を進めるはずの会議が仕事の邪魔になり、減らす相談にも会議が必要という、職場への皮肉です。", "video": "aRVqmRfZ4kA"}, {"number": 10, "word": "attitude", "meaning": "物事に対する姿勢", "dialogue": [{"speaker": "A", "text": "Has your attitude toward Mondays improved?"}, {"speaker": "B", "text": "Yes. I used to blame Monday. Now I blame whoever invented alarm clocks."}], "translation": ["月曜日への考え方は良くなった？", "うん。前は月曜を恨んでいた。今は目覚まし時計を発明した人を恨んでいる。"], "explanation": "attitude は「物事に対する姿勢」。月曜への態度がよくなったと聞くと、前向きになったように思えます。でも変わったのは、責める相手が「月曜日」から「目覚まし時計の発明者」になっただけ。早起きへの不満はそのままです。", "video": "lgt6EIB6VKs"}, {"number": 11, "word": "alternative", "meaning": "別の選択肢", "dialogue": [{"speaker": "A", "text": "Do we have an alternative to this meeting?"}, {"speaker": "B", "text": "Yes. We could actually read the email."}], "translation": ["この会議の代わりになる方法はある？", "うん。メールをちゃんと読むとかね。"], "explanation": "alternative は「別の選択肢」。会議の代わりに提案されたのは、すでに届いているメールを「実際に読む」ことでした。メールを読めば済む話なのに会議を開いている、という無駄を短い一言で突いています。", "video": "3YlM82VCNRU"}, {"number": 12, "word": "budget", "meaning": "予算・使えるお金の計画", "dialogue": [{"speaker": "A", "text": "Does your holiday fit the budget?"}, {"speaker": "B", "text": "Perfectly. We're visiting the airport, then coming home."}], "translation": ["旅行は予算内に収まる？", "ぴったり。空港を見物して帰ってくるんだ。"], "explanation": "budget は「予算」。旅行が予算にぴったり収まる理由は、飛行機に乗らず、空港を訪れてそのまま帰るからでした。「旅行」と聞いて想像する楽しみと、予算内でできることの小ささのギャップがオチです。", "video": "x7t34t81fQo"}, {"number": 13, "word": "competitive", "meaning": "競争力のある", "dialogue": [{"speaker": "A", "text": "Are your prices competitive?"}, {"speaker": "B", "text": "Very. They keep racing each other upward."}], "translation": ["価格に競争力はある？", "とても。互いに競って上がり続けているよ。"], "explanation": "competitive prices は普通「他社と比べて競争力のある価格」という褒め言葉です。ここでは値段同士が競争して、どんどん高くなるイメージにすり替えています。競争の結果、お得になるどころか値上がりするのが皮肉です。", "video": "xMWxyM-GjmY"}, {"number": 14, "word": "thoughtful", "meaning": "気配りのある", "dialogue": [{"speaker": "A", "text": "That was a thoughtful gift."}, {"speaker": "B", "text": "Noise-canceling headphones. Now you can ignore me in comfort."}], "translation": ["気の利いたプレゼントだね。", "ノイズキャンセリングのヘッドホン。これで快適に僕を無視できるよ。"], "explanation": "thoughtful は「気配りのある」。静かに過ごせるヘッドホンは親切な贈り物。でも贈った本人が「これで快適に僕を無視できるね」と言います。相手を喜ばせる道具が、自分を遠ざける道具にもなる、という自虐的なひと言です。", "video": "tRNc5xL8CLw"}, {"number": 15, "word": "relieved", "meaning": "ほっとした", "dialogue": [{"speaker": "A", "text": "You look relieved."}, {"speaker": "B", "text": "The dentist canceled. My tooth and I needed more time apart from him."}], "translation": ["ほっとした顔だね。", "歯医者の予約がなくなった。僕も歯も、先生からもう少し離れていたかったんだ。"], "explanation": "relieved は「ほっとした」。歯医者の予約が取り消されて安心した気持ちを、「僕と歯には、先生と離れて過ごす時間が必要だった」と表現しています。歯まで自分と一緒に歯医者を避けたがっているように描く、擬人化のユーモアです。", "video": "EkA6bZ2vueY"}, {"number": 16, "word": "unusual", "meaning": "普通と違う", "dialogue": [{"speaker": "A", "text": "Anything unusual at work today?"}, {"speaker": "B", "text": "Someone asked a question and actually listened to the answer."}], "translation": ["今日、職場で珍しいことはあった？", "質問した人が、ちゃんと答えを聞いていたよ。"], "explanation": "unusual は「普通と違う、珍しい」。職場で起きた珍しいことが、「質問した人が、ちゃんと答えを聞いた」ことでした。本来は当たり前の行動を珍事扱いすることで、人の話を聞かない職場を皮肉っています。", "video": "91YOtYC7F5I"}, {"number": 17, "word": "evaluate", "meaning": "価値や質を評価する", "dialogue": [{"speaker": "A", "text": "How did you evaluate the camping gear?"}, {"speaker": "B", "text": "I slept in the tent. In the living room. Excellent weather protection."}], "translation": ["キャンプ道具はどう評価したの？", "テントで寝た。居間でね。雨風は完璧に防げたよ。"], "explanation": "evaluate は「質や価値を評価する」。テントの天候への強さを試したと言いますが、寝た場所は屋外ではなくリビング。雨も風も当たらない場所で「悪天候にも強い！」と評価しても、テストになっていません。立派な評価に見えて、根拠がないのがオチです。", "video": "AptCfCyC67s"}, {"number": 18, "word": "propose", "meaning": "提案する", "dialogue": [{"speaker": "A", "text": "What do you propose for saving electricity?"}, {"speaker": "B", "text": "Fewer presentations. Starting with this one."}], "translation": ["節電のために何を提案する？", "プレゼンを減らすこと。まずこのプレゼンから。"], "explanation": "propose は「提案する」。節電のために「プレゼンを減らそう」と言い、まず今やっているプレゼンを終わらせようとします。省エネというもっともらしい理由で、退屈な説明から抜け出そうとする切り返しです。", "video": "0DNPplsqkJA"}, {"number": 19, "word": "coordinate", "meaning": "連携を調整する", "dialogue": [{"speaker": "A", "text": "Can you coordinate everyone's schedules?"}, {"speaker": "B", "text": "Sure. We're all free in February. Different years, though."}], "translation": ["全員の予定を合わせられる？", "うん。みんな二月なら空いている。ただし年が違うけど。"], "explanation": "coordinate は「予定などを調整する」。全員が2月に空いているなら調整成功、と思ったところで「ただし、年がそれぞれ違う」と付け足します。同じ月でも同じ時には集まれないので、成功したようで何も解決していません。", "video": "LiYYf-Nc9ng"}, {"number": 20, "word": "assignment", "meaning": "割り当てられた仕事", "dialogue": [{"speaker": "A", "text": "Was the assignment difficult?"}, {"speaker": "B", "text": "It said, Write about your future. I requested an extension of ten years."}], "translation": ["課題は難しかった？", "将来について書けって。提出を十年延ばしてもらうよう頼んだ。"], "explanation": "assignment は「課題、割り当てられた仕事」。「自分の将来について書く」という課題に、提出期限を10年延ばしてほしいと頼みます。将来を想像して書くのではなく、実際に10年たって確かめようとする、妙に文字どおりの受け止め方がオチです。", "video": "7vo1PjmHWXM"}, {"number": 21, "word": "behavior", "meaning": "振る舞い", "dialogue": [{"speaker": "A", "text": "Has your dog's behavior improved?"}, {"speaker": "B", "text": "Yes. He now wipes his paws before stealing food from the table."}], "translation": ["犬の行儀は良くなった？", "うん。テーブルの食べ物を盗む前に、足を拭くようになった。"], "explanation": "behavior は「振る舞い」。犬の行動が改善したと聞くと、盗み食いをやめたと思いますよね。でも直ったのは、盗む前に足を拭くことだけ。悪いことは続けながら、礼儀だけよくなったズレが面白いところです。", "video": "QxXvWku-pi4"}, {"number": 22, "word": "advantage", "meaning": "有利な点", "dialogue": [{"speaker": "A", "text": "What's the advantage of working upstairs?"}, {"speaker": "B", "text": "By lunchtime, forgetting things counts as exercise."}], "translation": ["二階で働く利点は？", "昼までには、忘れ物を取りに行くのが運動になるよ。"], "explanation": "advantage は「利点」。上の階で働く利点は、忘れ物を取りに階段を何度も往復するうちに運動になること。普通なら困る「忘れっぽさ」を、健康のための利点として前向きに言い換えています。", "video": "e5DQDdBZM-Q"}, {"number": 23, "word": "deadline", "meaning": "締め切り", "dialogue": [{"speaker": "A", "text": "Can you meet the deadline?"}, {"speaker": "B", "text": "We've met before. It never stays long."}], "translation": ["締め切りに間に合う？", "前にも会ったよ。いつもすぐ行ってしまうけど。"], "explanation": "meet a deadline は「締め切りに間に合わせる」という決まり表現です。ここでは meet を「人に会う」の意味で受け取り、「前にも会ったよ。でも長居しないんだ」と返します。すぐ過ぎ去る締め切りを、さっと帰る知り合いに見立てた言葉遊びです。", "video": "hjsRv5IwVvo"}, {"number": 24, "word": "capable", "meaning": "能力がある", "dialogue": [{"speaker": "A", "text": "Is your robot capable of cooking?"}, {"speaker": "B", "text": "Yes. It ordered a pizza and took all the credit."}], "translation": ["そのロボットは料理ができる？", "うん。ピザを注文して、全部自分の手柄にした。"], "explanation": "capable は「能力がある」。料理のできるロボットかと思ったら、自分では作らずピザを注文しただけ。それなのに手柄は全部自分のものにします。食事は用意できても、それを料理の腕前として誇るのは違う、というズレがオチです。", "video": "9X1ak7maufc"}, {"number": 25, "word": "supportive", "meaning": "支えてくれる", "dialogue": [{"speaker": "A", "text": "Is your family supportive of your singing?"}, {"speaker": "B", "text": "Very. They bought me lessons. At a school two towns away."}], "translation": ["家族は歌を応援してくれる？", "とても。レッスン代を出してくれた。二つ隣の町の学校で。"], "explanation": "supportive は「応援してくれる」。家族が歌のレッスンを用意してくれたのは親切に見えます。でも学校は、わざわざ二つ先の町。上達を応援するだけでなく、家から歌声を遠ざけたいのでは？ と感じさせる最後の付け足しがオチです。", "video": "QK0zhz7xOfE"}, {"number": 26, "word": "embarrassed", "meaning": "恥ずかしく感じた", "dialogue": [{"speaker": "A", "text": "Why were you embarrassed at the interview?"}, {"speaker": "B", "text": "I waved back at someone who was opening an automatic door."}], "translation": ["面接でどうして恥ずかしかったの？", "自動ドアを開けようとしていた人に、手を振り返しちゃった。"], "explanation": "embarrassed は「恥ずかしい思いをした」。誰かが手を振ってくれたと思って振り返したら、その人は自動ドアを開けようとしていただけでした。自分への合図ではなかったと後から気づく、気まずい勘違いの「あるある」です。", "video": "tvYpoiLlfZA"}, {"number": 27, "word": "remarkable", "meaning": "注目に値する", "dialogue": [{"speaker": "A", "text": "That's a remarkable memory."}, {"speaker": "B", "text": "Thanks. I remember every password I've stopped using."}], "translation": ["すごい記憶力だね。", "ありがとう。もう使っていないパスワードは全部覚えている。"], "explanation": "remarkable は「注目に値する、すごい」。記憶力を褒められた人が覚えているのは、もう使っていないパスワードばかり。記憶力は確かにすごくても、今必要なものに役立つとは限らない、という残念なズレです。", "video": "sh8MYL8V3x4"}, {"number": 28, "word": "assess", "meaning": "状況や程度を判断する", "dialogue": [{"speaker": "A", "text": "How did you assess the damage?"}, {"speaker": "B", "text": "I counted the pieces. Then I counted how many times my wife said my full name."}], "translation": ["被害はどう判断したの？", "破片を数えた。それから、妻が僕をフルネームで呼んだ回数を数えた。"], "explanation": "assess は「状況や程度を判断する」。壊れた物の破片だけでなく、妻が自分のフルネームを呼んだ回数でも被害を測っています。ここではフルネーム呼びが「かなり怒っている」合図。物の損害と、自分がどれだけ叱られるかを一緒に数えているのがオチです。", "video": "QYEpRFXsFP8"}, {"number": 29, "word": "suggest", "meaning": "案を出す", "dialogue": [{"speaker": "A", "text": "What do you suggest for a quiet evening?"}, {"speaker": "B", "text": "Invite the houseplants. They're excellent listeners."}], "translation": ["静かな夜にするにはどうすればいい？", "観葉植物を招こう。聞き上手だから。"], "explanation": "suggest は「提案する」。静かな夜を過ごすため、観葉植物を招待しようと提案します。植物は話せないので、確かに静かで、口を挟まない「聞き上手」。植物を会話の相手のように扱う、ほのぼのしたユーモアです。", "video": "u51V0yIVNtQ"}, {"number": 30, "word": "delegate", "meaning": "仕事を任せる", "dialogue": [{"speaker": "A", "text": "Have you learned to delegate?"}, {"speaker": "B", "text": "Yes. I asked my assistant to take the course for me."}], "translation": ["仕事を人に任せる方法は学んだ？", "うん。代わりに講座を受けるよう助手に頼んだ。"], "explanation": "delegate は「仕事を人に任せる」。任せ方を学んだかと聞かれ、「その講座を受けること自体を助手に任せた」と答えます。自分が学ぶはずのことまで丸投げして、すでに実践できていると言わんばかりなのがオチです。", "video": "tT4bbnly5gM"}, {"number": 31, "word": "proposal", "meaning": "提案", "dialogue": [{"speaker": "A", "text": "Did they accept your proposal?"}, {"speaker": "B", "text": "Almost. They liked everything except doing it."}], "translation": ["提案は通った？", "ほぼね。実行すること以外は全部気に入ったって。"], "explanation": "proposal は、ここでは「提案」。採用されそうだと言いながら、「実行すること以外は全部気に入ってもらえた」と続きます。提案を褒めることと、本当に動くことは別。肝心の実行だけ断られているのに、成功に近いように言うのが皮肉です。", "video": "piafkp50MPY"}, {"number": 32, "word": "reputation", "meaning": "周囲からの評判", "dialogue": [{"speaker": "A", "text": "Does he have a reputation for being punctual?"}, {"speaker": "B", "text": "Yes. He's famous for arriving exactly when the food appears."}], "translation": ["彼は時間に正確だと評判なの？", "うん。料理が出る瞬間にぴったり来ることで有名。"], "explanation": "reputation は「評判」。時間に正確な人かと思ったら、正確に合わせるのは食べ物が出てくるタイミングだけでした。punctual（時間を守る）という褒め言葉を、食事目当ての行動に使っているのがオチです。", "video": "K45FOXs3wVI"}, {"number": 33, "word": "drawback", "meaning": "欠点", "dialogue": [{"speaker": "A", "text": "Any drawback to that tiny apartment?"}, {"speaker": "B", "text": "The virtual tour was bigger than the actual room."}], "translation": ["その小さな部屋に欠点はある？", "バーチャル見学の方が実物の部屋より広かった。"], "explanation": "drawback は「欠点」。部屋が狭いことを、「実物よりバーチャル見学のほうが大きかった」と大げさに表しています。画面では広く魅力的に見えたのに、実際は窮屈だったという、広告と現実の落差を楽しむ会話です。", "video": "kmLBTC-jIm4"}, {"number": 34, "word": "priority", "meaning": "優先事項", "dialogue": [{"speaker": "A", "text": "What's your top priority?"}, {"speaker": "B", "text": "Finding the list of my top priorities."}], "translation": ["最優先のことは何？", "最優先事項のリストを見つけること。"], "explanation": "priority は「優先事項」。最優先でやることを聞かれ、「優先事項のリストを探すこと」と答えます。何を先にするか整理したはずなのに、そのリストをなくしてしまった。本来の仕事に入る前の段階でつまずいているのがオチです。", "video": "hmpmmZyFBQQ"}, {"number": 35, "word": "competent", "meaning": "有能な", "dialogue": [{"speaker": "A", "text": "Is the new technician competent?"}, {"speaker": "B", "text": "He fixed the problem before I finished explaining how I'd made it worse."}], "translation": ["新しい技術者は腕がいい？", "僕が悪化させた経緯を説明し終える前に、直してくれた。"], "explanation": "competent は「有能な」。技術者の腕前を褒める話ですが、依頼した人は「自分がどうやって問題を悪化させたか」をまだ説明中です。専門家が直す速さと、素人が余計なことをしてしまった自白の対比が、軽い自虐になっています。", "video": "JELsZW1pxcc"}, {"number": 36, "word": "cooperative", "meaning": "協力的な", "dialogue": [{"speaker": "A", "text": "Were the children cooperative?"}, {"speaker": "B", "text": "Absolutely. They all agreed it was the dog's fault."}], "translation": ["子どもたちは協力的だった？", "もちろん。犬のせいだという点で全員一致した。"], "explanation": "cooperative は「協力的な」。子どもたちはよく協力したそうですが、協力したのは「犬のせいにする」ため。大人の手伝いではなく、責任逃れで一致団結しているのがオチです。", "video": "IZbs2Y61NGM"}, {"number": 37, "word": "disappointed", "meaning": "がっかりした", "dialogue": [{"speaker": "A", "text": "Why are you disappointed with the smart fridge?"}, {"speaker": "B", "text": "It knows we're out of milk but still won't go shopping."}], "translation": ["スマート冷蔵庫にどうしてがっかりしているの？", "牛乳がないと分かっているのに、買い物には行かない。"], "explanation": "disappointed は「がっかりした」。スマート冷蔵庫は牛乳が切れたと分かるのに、買い物までは行ってくれません。便利な機能に対して、人間のように買い出しまで期待してしまう、要求の大きさが笑いどころです。", "video": "4dCyNs3MsRk"}, {"number": 38, "word": "memorable", "meaning": "記憶に残る", "dialogue": [{"speaker": "A", "text": "Was the wedding memorable?"}, {"speaker": "B", "text": "Very. The best man thanked everyone for coming to the wrong couple's wedding."}], "translation": ["記憶に残る結婚式だった？", "とても。友人代表が、別のカップルの結婚式への出席を感謝したんだ。"], "explanation": "memorable は「記憶に残る」。結婚式が忘れられない理由は、感動ではなく、花婿の付き添い役 best man の挨拶が別のカップルの式のものだったから。晴れの日の立派なスピーチを期待したら、とんでもない取り違えだった、というオチです。", "video": "B3pluueeMfQ"}, {"number": 39, "word": "estimate", "meaning": "おおよその数を見積もる", "dialogue": [{"speaker": "A", "text": "Can you estimate the repair cost?"}, {"speaker": "B", "text": "Yes. Take the amount you're hoping for and add a sigh."}], "translation": ["修理代を見積もれる？", "うん。希望している金額に、ため息を足して。"], "explanation": "estimate は「見積もる」。修理代を数字で答えず、「あなたが期待している金額に、ため息を足してください」と返します。実際は予想より高くてがっかりする、と金額ではなく反応で伝えるユーモアです。", "video": "WrpnoXZvlkU"}, {"number": 40, "word": "request", "meaning": "依頼する", "dialogue": [{"speaker": "A", "text": "Did you request a window seat?"}, {"speaker": "B", "text": "Yes. They moved my desk beside a picture of a window."}], "translation": ["窓際の席を頼んだの？", "うん。窓の写真の横に机を移された。"], "explanation": "request は「依頼する」。「窓際の席」を頼んだのに、机を移された先は本物の窓ではなく、窓の絵の横。眺めや明るさが欲しかったはずなのに、言葉の形だけ満たされ、願いの中身がかなっていないのがオチです。", "video": "ATakZfCPluw"}, {"number": 41, "word": "supervise", "meaning": "監督する", "dialogue": [{"speaker": "A", "text": "Who supervises the home renovation?"}, {"speaker": "B", "text": "The cat. Every surface needs his personal inspection."}], "translation": ["家の改装は誰が監督しているの？", "猫。どの面も自分で検査しないと気が済まない。"], "explanation": "supervise は「監督する」。家の改装を監督しているのは人ではなく猫。猫があちこちに乗ったり確かめたりする様子を、「すべての面を自分で検査する監督」に見立てています。猫の好奇心を立派な仕事のように表す笑いです。", "video": "LJ3R23FdO4Y"}, {"number": 42, "word": "requirement", "meaning": "必要条件", "dialogue": [{"speaker": "A", "text": "What's the main requirement for this job?"}, {"speaker": "B", "text": "Experience. Preferably from a job that didn't require experience."}], "translation": ["この仕事の主な条件は？", "経験。できれば、経験不要の仕事で得たもの。"], "explanation": "requirement は「必要条件」。応募には経験が必要なのに、経験を得るための最初の仕事にも経験が求められます。「経験不要の仕事で積んだ経験が望ましい」という返事が、その堂々巡りを浮き彫りにしています。", "video": "F1q_ouW7Qds"}, {"number": 43, "word": "impression", "meaning": "受けた印象", "dialogue": [{"speaker": "A", "text": "Did I make a good first impression?"}, {"speaker": "B", "text": "Definitely. Everyone remembers the man who shook hands with the coat rack."}], "translation": ["第一印象は良かった？", "もちろん。コート掛けと握手した人を、みんな覚えている。"], "explanation": "impression は「印象」。よい第一印象を残せたかと聞くと、確かに全員が覚えています。ただし理由は、コート掛けと握手したから。「よい印象」と「強く記憶に残ること」は同じではない、というすり替えです。", "video": "K9JDW0q0EKE"}, {"number": 44, "word": "obstacle", "meaning": "妨げとなるもの", "dialogue": [{"speaker": "A", "text": "What's the biggest obstacle to your morning run?"}, {"speaker": "B", "text": "The dog. He hides when I pick up the shoes."}], "translation": ["朝のランニングの一番の障害は？", "犬。靴を手に取ると隠れるんだ。"], "explanation": "obstacle は「障害、妨げ」。朝のランニングを阻むのは疲れでも天気でもなく、靴を持つと隠れる犬。散歩に喜んでついてくる犬を想像すると、その逆の反応が面白くなります。犬まで運動を避けたがっている場面です。", "video": "Gq_pPM_nxQE"}, {"number": 45, "word": "flexible", "meaning": "柔軟な", "dialogue": [{"speaker": "A", "text": "Are your working hours flexible?"}, {"speaker": "B", "text": "Yes. They keep stretching into dinner."}], "translation": ["勤務時間は柔軟なの？", "うん。夕食の時間まで、どんどん伸びていく。"], "explanation": "flexible working hours は普通「都合に合わせて調整できる勤務時間」。ところがこの人の勤務時間は、夕食の時間まで「伸びる」ばかり。flexible の柔らかく伸びるイメージを使い、自由な働き方のはずが長時間労働になっていると皮肉っています。", "video": "xns5ay1P1HQ"}, {"number": 46, "word": "qualified", "meaning": "必要な資格がある", "dialogue": [{"speaker": "A", "text": "Are you qualified to lead this expedition?"}, {"speaker": "B", "text": "I own the biggest backpack. Apparently that was enough."}], "translation": ["探検隊を率いる資格はあるの？", "一番大きなリュックを持っている。それで十分らしい。"], "explanation": "qualified は「必要な資格や適性がある」。探検隊のリーダーを任された理由が、経験や技術ではなく「いちばん大きなリュックを持っていた」こと。重要な役割に対して選考基準があまりに頼りなく、本人も他人事のように語るのがオチです。", "video": "kIry766tEgg"}, {"number": 47, "word": "approachable", "meaning": "話しかけやすい", "dialogue": [{"speaker": "A", "text": "Is the manager approachable?"}, {"speaker": "B", "text": "Yes. Getting near him is easy. Getting an answer is the adventure."}], "translation": ["上司は話しかけやすい？", "うん。近づくのは簡単。答えをもらうのが冒険なんだ。"], "explanation": "approachable は普通「気軽に話しかけられる」。返事はそれを「物理的に近づける」と受け取り、近づくのは簡単でも答えをもらうのは大冒険だと言います。距離は近くても話は通じない、という上司への皮肉です。", "video": "uqBOn4Y0bEc"}, {"number": 48, "word": "delighted", "meaning": "大喜びした", "dialogue": [{"speaker": "A", "text": "You must be delighted with the promotion."}, {"speaker": "B", "text": "I am. My problems now have their own office."}], "translation": ["昇進はさぞうれしいでしょう。", "うれしいよ。僕の問題にも専用の部屋ができた。"], "explanation": "delighted は「大喜びした」。昇進で自分の個室ができたはずなのに、「僕の問題たちが専用のオフィスを持った」と言っています。喜びを語りながら、責任や悩みも一緒に昇進したように描く、仕事の自虐です。", "video": "ffM8QBXuZ-Q"}, {"number": 49, "word": "impressive", "meaning": "感銘を与える", "dialogue": [{"speaker": "A", "text": "Your garden is impressive."}, {"speaker": "B", "text": "Thanks. The weeds have exceeded all expectations."}], "translation": ["立派な庭だね。", "ありがとう。雑草が予想をはるかに超えたよ。"], "explanation": "impressive は「感心させる、見事な」。庭を褒められて、誇ったのは花ではなく雑草の育ち具合でした。手入れの成果と思ったら、育ってほしくないものが期待以上に育った、というひっくり返しです。", "video": "E1X2mOD_6lA"}, {"number": 50, "word": "anticipate", "meaning": "起こると予想する", "dialogue": [{"speaker": "A", "text": "Did you anticipate traffic problems?"}, {"speaker": "B", "text": "Yes. I left early and found a completely new traffic jam."}], "translation": ["渋滞は予想していた？", "うん。早く出て、まったく別の渋滞に出会った。"], "explanation": "anticipate は「前もって予想する」。渋滞を見越して早く出発したのに、出会ったのは「まったく新しい渋滞」。先回りした努力が、別の同じ問題にたどり着いてしまうのがオチです。", "video": "OYaTI2YkX8I"}, {"number": 51, "word": "insist", "meaning": "強く言い張る", "dialogue": [{"speaker": "A", "text": "Why did you insist on carrying everything?"}, {"speaker": "B", "text": "I wanted to make one trip. Now I need two people to open the door."}], "translation": ["どうして全部自分で運ぶと言い張ったの？", "一往復で済ませたかった。今はドアを開けるのに二人必要。"], "explanation": "insist は「強く言い張る」。荷物を一度で運ぼうと全部持ったら、両手がふさがってドアを開けられず、二人の助けが必要になりました。手間を省いて一人で済ませるはずが、かえって人手を増やしてしまった逆効果が面白いところです。", "video": "BLMx6qlWFRc"}, {"number": 52, "word": "monitor", "meaning": "継続して様子を見る", "dialogue": [{"speaker": "A", "text": "How do you monitor your spending?"}, {"speaker": "B", "text": "The bank sends alerts. I read them with one eye closed."}], "translation": ["支出はどう確認しているの？", "銀行から通知が来る。片目を閉じて読むんだ。"], "explanation": "monitor は「継続して確認する」。支出は銀行の通知でチェックしていますが、読むときは片目を閉じています。見たくない金額を、少しでも見ないようにするしぐさ。管理はしているのに、現実には向き合いたくない気持ちがオチです。", "video": "_AOspY3eQmo"}, {"number": 53, "word": "procedure", "meaning": "手順", "dialogue": [{"speaker": "A", "text": "What's the procedure for replacing a lost form?"}, {"speaker": "B", "text": "First, fill in the form explaining why you need the form."}], "translation": ["なくした用紙をもらう手順は？", "まず、その用紙が必要な理由を書く用紙に記入して。"], "explanation": "procedure は「手順」。なくした書類の代わりをもらうには、まず別の書類に「その書類が必要な理由」を書かなければなりません。簡単な用事が書類仕事をさらに生む、面倒な手続きへの皮肉です。", "video": "4jZRk8z7wtw"}, {"number": 54, "word": "intention", "meaning": "するつもりのこと", "dialogue": [{"speaker": "A", "text": "Was it your intention to eat the whole cake?"}, {"speaker": "B", "text": "No. I intended to check whether the middle tasted different."}], "translation": ["ケーキを全部食べるつもりだったの？", "違うよ。真ん中の味が違うか確かめるつもりだった。"], "explanation": "intention は「意図、するつもり」。ケーキを全部食べた理由を、「真ん中が違う味か確認したかっただけ」と言い訳しています。味見のつもりだったと言いながら、結果は完食。小さな目的で大きな食べ過ぎを正当化するのがオチです。", "video": "DKfZ7JNcV7Q"}, {"number": 55, "word": "challenge", "meaning": "乗り越えるべき課題", "dialogue": [{"speaker": "A", "text": "What's your biggest challenge as a parent?"}, {"speaker": "B", "text": "Explaining why I need sleep to someone who has never paid rent."}], "translation": ["親として一番大変なことは？", "家賃を払ったことのない相手に、睡眠が必要な理由を説明すること。"], "explanation": "challenge は「乗り越えるべき課題」。家賃など大人の責任を知らない子どもに、親がなぜ睡眠を必要とするか説明しようとしています。育児の苦労を、大人と子どもの生活経験の差で大げさに表した「あるある」です。子どもに睡眠が不要という意味ではありません。", "video": "5r4impoMjjo"}, {"number": 56, "word": "efficient", "meaning": "効率的な", "dialogue": [{"speaker": "A", "text": "Is your new system efficient?"}, {"speaker": "B", "text": "Very. I can now lose six files at once."}], "translation": ["新しい仕組みは効率的？", "とても。一度に六つのファイルをなくせるようになった。"], "explanation": "efficient は「効率的な」。新システムのおかげで一度に処理できる数が増えたそうですが、効率よくできるのは「ファイルをなくす」こと。よい成果ではなく失敗が高速化した、という逆転がオチです。", "video": "DI_eAT900OE"}, {"number": 57, "word": "responsible", "meaning": "責任を負う", "dialogue": [{"speaker": "A", "text": "Who's responsible for watering the office plants?"}, {"speaker": "B", "text": "We formed a committee. The plants have requested a smaller one."}], "translation": ["職場の植物の水やり担当は誰？", "委員会を作った。植物から人数を減らしてほしいと要望が来た。"], "explanation": "responsible は「責任を負う」。植物への水やり担当を決める代わりに委員会を作り、肝心の植物が「もっと小さな委員会にして」と頼みます。単純な仕事が大げさな組織になって進まない様子を、植物自身の苦情として表しています。", "video": "xoVtYR0rIjI"}, {"number": 58, "word": "assertive", "meaning": "自分の意見を明確に言える", "dialogue": [{"speaker": "A", "text": "Are you becoming more assertive?"}, {"speaker": "B", "text": "Yes. I told the self-checkout I don't need a bag. With confidence."}], "translation": ["自分の意見をはっきり言えるようになった？", "うん。セルフレジに袋はいらないと言った。自信を持って。"], "explanation": "assertive は「自分の意見や希望をはっきり言える」。人に堂々と意見した話かと思ったら、相手はセルフレジで、言ったのは「袋はいりません」。大きな成長を語る口調と、小さく安全な挑戦とのギャップが、ほほえましいオチです。", "video": "MktTbub79UY"}, {"number": 59, "word": "amused", "meaning": "面白がっている", "dialogue": [{"speaker": "A", "text": "Why was the teacher amused?"}, {"speaker": "B", "text": "My son listed bedtime as a natural disaster."}], "translation": ["先生はどうして笑っていたの？", "息子が自然災害の例に就寝時間を挙げた。"], "explanation": "amused は「面白がっている」。子どもが就寝時間を「自然災害」の仲間に入れました。大人には毎日の生活習慣でも、まだ遊びたい子どもには大惨事。その大げさな分類に先生も笑ってしまった、という会話です。", "video": "aPiIxD45anM"}, {"number": 60, "word": "disappointing", "meaning": "期待外れの", "dialogue": [{"speaker": "A", "text": "Was the treasure hunt disappointing?"}, {"speaker": "B", "text": "We found the box. Inside was a voucher for another treasure hunt."}], "translation": ["宝探しは期待外れだった？", "箱は見つかった。中身は次の宝探しの券だった。"], "explanation": "disappointing は「期待外れの」。宝探しの最後にやっと開けた箱から出てきたのは、宝物ではなく「次の宝探しの引換券」。ご褒美を期待したのに、また探す側に戻される、終わらない仕組みがオチです。", "video": "SOisx7JbvCw"}, {"number": 61, "word": "predict", "meaning": "先のことを予測する", "dialogue": [{"speaker": "A", "text": "Can you predict tomorrow's weather?"}, {"speaker": "B", "text": "Rain. I've just washed the car and planned a picnic."}], "translation": ["明日の天気を予測できる？", "雨。車を洗って、ピクニックの予定も立てたから。"], "explanation": "predict は「予測する」。雨と予想する根拠は天気図ではなく、「洗車したうえにピクニックまで計画した」こと。楽しみに準備すると台無しになる、という不運の「あるある」を、確実な天気予報のように言っています。", "video": "fvSEkh1NsJ4"}, {"number": 62, "word": "admit", "meaning": "しぶしぶ認める", "dialogue": [{"speaker": "A", "text": "Will you admit you lost the instructions?"}, {"speaker": "B", "text": "Yes. But without them, I can't tell you how it happened."}], "translation": ["説明書をなくしたと認める？", "うん。でも説明書がないから、経緯を説明できない。"], "explanation": "admit は、ここでは「しぶしぶ認める」。説明書をなくしたことは認めるのに、「説明書がないから、どうしてそうなったかは説明できない」と続けます。物の使い方を書く説明書を、自分の失敗の説明にも必要だと言い張る、とぼけた言い訳です。", "video": "s3sX5niAV3U"}, {"number": 63, "word": "maintain", "meaning": "良い状態を保つ", "dialogue": [{"speaker": "A", "text": "How do you maintain that old car?"}, {"speaker": "B", "text": "We have an agreement. I avoid hills, and it avoids retirement."}], "translation": ["その古い車はどう維持しているの？", "約束がある。僕は坂を避け、車は引退を避ける。"], "explanation": "maintain は「良い状態を保つ」。古い車を長持ちさせる方法が、「僕は坂道を避け、車は引退を避ける」という契約になっています。車を交渉相手に見立て、無理をさせない代わりにもう少し走ってもらう、という擬人化のユーモアです。", "video": "lo_X_73B4BA"}, {"number": 64, "word": "policy", "meaning": "組織の方針", "dialogue": [{"speaker": "A", "text": "What's the office policy on pets?"}, {"speaker": "B", "text": "Dogs are welcome. Apparently they're better at staying than employees."}], "translation": ["職場のペット規定は？", "犬は歓迎。社員より「待て」が得意らしい。"], "explanation": "policy は「方針」。犬を職場に歓迎する理由が、「従業員より staying が得意」だから。犬には「待て」の意味、大人には「会社に居続ける」の意味が重なります。犬のしつけの話に見せて、人が辞めてしまう職場を皮肉っています。", "video": "KuutItIXSm4"}, {"number": 65, "word": "expectation", "meaning": "そうなるだろうという期待", "dialogue": [{"speaker": "A", "text": "Did the holiday meet your expectations?"}, {"speaker": "B", "text": "The hotel promised a sea view. I could see it clearly on the brochure."}], "translation": ["旅行は期待どおりだった？", "ホテルは海が見えると約束した。パンフレットでは、はっきり見えたよ。"], "explanation": "expectation は「期待」。ホテルの sea view（海の眺め）を期待したのに、海がよく見えたのは部屋からではなくパンフレットの中。約束どおりだったように答えつつ、実は期待が外れたことを伝える皮肉です。", "video": "owNiiwfh204"}, {"number": 66, "word": "opportunity", "meaning": "好機", "dialogue": [{"speaker": "A", "text": "Was the conference a networking opportunity?"}, {"speaker": "B", "text": "Yes. I met three people while we searched for a working socket."}], "translation": ["会議は人脈作りの機会になった？", "うん。使えるコンセントを探す間に三人と知り合った。"], "explanation": "opportunity は「好機」。会議で人脈を広げられたのは、正式な交流の場ではなく、使えるコンセントを探していたときでした。立派な目的の networking が、充電という切実で身近な用事から生まれた、その対比が面白いところです。", "video": "vWuxzGdiEow"}, {"number": 67, "word": "reliable", "meaning": "頼りになる", "dialogue": [{"speaker": "A", "text": "Is that printer reliable?"}, {"speaker": "B", "text": "Completely. It jams before every deadline."}], "translation": ["そのプリンターは頼りになる？", "完全に。締め切りの前には必ず紙が詰まる。"], "explanation": "reliable は普通「安心して頼れる」。でもこのプリンターが確実にやることは、締め切り前に紙詰まりを起こすこと。よく働くという意味の褒め言葉を、毎回きちんと故障するという悪い意味に反転させています。", "video": "GNcHScVmTSc"}, {"number": 68, "word": "accountable", "meaning": "説明責任がある", "dialogue": [{"speaker": "A", "text": "Who is accountable for the missing biscuits?"}, {"speaker": "B", "text": "We're investigating. The main suspect is leading the investigation."}], "translation": ["消えたビスケットの責任者は誰？", "調査中。最有力容疑者が調査を率いている。"], "explanation": "accountable は「結果について説明責任を負う」。ビスケットがなくなった件を調べているのに、捜査を仕切るのが一番怪しい人物です。自分が疑われている人に真相解明を任せる、という矛盾がオチです。会話の中で犯人と確定したわけではありません。", "video": "qh4dowRAawY"}, {"number": 69, "word": "persuasive", "meaning": "説得力のある", "dialogue": [{"speaker": "A", "text": "Was the salesperson persuasive?"}, {"speaker": "B", "text": "I went in to return a lamp. I came home with matching curtains."}], "translation": ["販売員は説得上手だった？", "ランプを返品しに行ったのに、おそろいのカーテンを買って帰った。"], "explanation": "persuasive は「説得力のある」。ランプを返品してお金を取り戻すはずが、それに合うカーテンを買って帰ってきました。購入を取り消すつもりの客に追加の買い物をさせるほど、店員の説得がうまかったという逆転です。", "video": "tWqxSKGNCl4"}, {"number": 70, "word": "puzzled", "meaning": "困惑した", "dialogue": [{"speaker": "A", "text": "Why do you look puzzled?"}, {"speaker": "B", "text": "My smart watch says I'm asleep. Should I wake it up?"}], "translation": ["どうして困った顔をしているの？", "時計が僕は寝ていると言っている。時計を起こした方がいい？"], "explanation": "puzzled は「困惑した」。起きている自分をスマートウォッチが「睡眠中」と判定。そこで直すべきなのは自分ではなく、寝ぼけた時計のほうでは、と考えて「時計を起こそうか？」と言います。機械を寝ている人のように扱うオチです。", "video": "VrMKw4a6B8k"}, {"number": 71, "word": "ridiculous", "meaning": "ばかげた", "dialogue": [{"speaker": "A", "text": "Is the delivery charge ridiculous?"}, {"speaker": "B", "text": "The sofa travels first class. I can only afford economy."}], "translation": ["配送料はばかげているの？", "ソファはファーストクラス。僕はエコノミーしか買えない。"], "explanation": "ridiculous は「ばかげた」。高すぎるソファの配送料を、飛行機のファーストクラス料金にたとえています。持ち主はエコノミーしか払えないのに、家具のほうがぜいたくに旅をする。その立場の逆転を大げさに描いた笑いです。", "video": "hVcMeYKJvVs"}, {"number": 72, "word": "recognize", "meaning": "見覚えがあり分かる", "dialogue": [{"speaker": "A", "text": "Did your dog recognize you after the haircut?"}, {"speaker": "B", "text": "Eventually. I had to show him my snack credentials."}], "translation": ["散髪したあと、犬は君だと分かった？", "最終的には。おやつで身分証明しないといけなかった。"], "explanation": "recognize は「見覚えがあって分かる」。髪形を変えた飼い主が犬に認めてもらうため、見せたのは身分証ではなくおやつ。snack credentials は、おやつを「身元の証明」のように表す、この会話の遊びです。犬には顔よりおやつが説得力を持っています。", "video": "SBEIxG0gAUA"}, {"number": 73, "word": "deny", "meaning": "否定する", "dialogue": [{"speaker": "A", "text": "Do you deny falling asleep in the meeting?"}, {"speaker": "B", "text": "Absolutely. I was testing whether the chair supports deep thinking."}], "translation": ["会議で寝たことは否定する？", "もちろん。椅子が深い思考を支えるか試していた。"], "explanation": "deny は「否定する」。会議で寝ていたと言われて、「椅子が深い思考を支えられるか試していた」と言い換えます。居眠りを、立派な実験や思索に見せかける言い訳。deep thinking（深い思考）と、実際には眠っていたらしい姿の差がオチです。", "video": "wGoDswoYIdw"}, {"number": 74, "word": "implement", "meaning": "計画を実行に移す", "dialogue": [{"speaker": "A", "text": "Have you implemented the paperless system?"}, {"speaker": "B", "text": "Yes. We printed a manual explaining how to use it."}], "translation": ["ペーパーレス化は実行した？", "うん。使い方を説明する冊子を印刷した。"], "explanation": "implement は「計画を実行に移す」。ペーパーレス化を実施したのに、その使い方の説明書は紙に印刷しています。紙を減らす取り組みの第一歩で紙を使ってしまう、目的と行動のちぐはぐさが皮肉です。", "video": "aLyRpk427ak"}, {"number": 75, "word": "strategy", "meaning": "目標達成のための戦略", "dialogue": [{"speaker": "A", "text": "What's your strategy for the family board game?"}, {"speaker": "B", "text": "Lose early, then gain control of the snacks."}], "translation": ["家族のボードゲームでの戦略は？", "早く負けて、おやつの支配権を得る。"], "explanation": "strategy は「目標達成のための戦略」。ゲームに勝つ作戦かと思ったら、早く負けてお菓子を独占する作戦でした。盤上の勝利より、おやつという別の利益を優先する、意外にちゃっかりした考え方がオチです。", "video": "wRgIGHTbFTk"}, {"number": 76, "word": "assumption", "meaning": "確認せずに置く前提", "dialogue": [{"speaker": "A", "text": "What was your biggest assumption about adulthood?"}, {"speaker": "B", "text": "That someone would tell me when I'd finished the laundry forever."}], "translation": ["大人について一番大きな思い込みは？", "洗濯が一生分終わったら、誰かが教えてくれると思っていた。"], "explanation": "assumption は「確認せずにそうだと思うこと」。大人になれば、いつか洗濯を永久に終えたと告げてもらえると思っていたそうです。でも洗濯物は次々に増え、最終ゴールはありません。家事を一度きりの宿題のように考えていた、という大人の生活への自虐です。", "video": "5MhWJieOAiU"}, {"number": 77, "word": "coincidence", "meaning": "偶然の一致", "dialogue": [{"speaker": "A", "text": "What a coincidence! Same shirt!"}, {"speaker": "B", "text": "Yes. Let's stand apart before someone asks us for store assistance."}], "translation": ["偶然だね！同じシャツ！", "うん。店員と間違われる前に離れて立とう。"], "explanation": "coincidence は「偶然の一致」。同じシャツを着ていた二人が、喜ぶ代わりに離れて立とうとします。並ぶと制服姿の店員に見えて、お客さんから声をかけられそうだから。偶然のおそろいが仕事に見えてしまう、という想像がオチです。", "video": "iCq0a1V7_fY"}, {"number": 78, "word": "reasonable", "meaning": "妥当な", "dialogue": [{"speaker": "A", "text": "Was your request reasonable?"}, {"speaker": "B", "text": "I only asked Monday to start after lunch."}], "translation": ["お願いは妥当だった？", "月曜日は昼食後に始めてほしいと頼んだだけ。"], "explanation": "reasonable は「妥当な、無理のない」。本人は控えめなお願いだと言いますが、頼んだ相手は月曜日で、内容は「昼食後から始まって」。曜日に始まりを遅らせてもらうという無理な願いを、当然の小さな要望のように語っています。", "video": "VNqTC3kGY0A"}, {"number": 79, "word": "available", "meaning": "利用できる・空いている", "dialogue": [{"speaker": "A", "text": "Is a quiet room available?"}, {"speaker": "B", "text": "Yes. But you have to share it with the person selling quiet rooms."}], "translation": ["静かな部屋は空いている？", "うん。ただし、静かな部屋を売り込む人と相部屋だけど。"], "explanation": "available は「利用できる、空いている」。静かな部屋はあるのに、静かな部屋を売る人と相部屋です。静けさが欲しいのに営業担当まで一緒では落ち着かなさそう。「部屋はある」という回答だけでは希望が満たされない、妙な条件がオチです。", "video": "kTeFYs7WOSM"}, {"number": 80, "word": "sincere", "meaning": "誠実な", "dialogue": [{"speaker": "A", "text": "Was his apology sincere?"}, {"speaker": "B", "text": "I think so. He apologized even after discovering the vase was cheap."}], "translation": ["彼の謝罪は心からのものだった？", "たぶん。花瓶が安物だと知ってからも謝っていた。"], "explanation": "sincere は「誠実な、本心からの」。壊した花瓶が安物だと分かった後も謝ったので、本心からの謝罪だろうと言っています。高額な弁償が怖いだけなら安心して謝るのをやめそう、という計算と対比し、小さなことで誠意を判断するユーモアです。", "video": "V1FNJJ6bhd0"}, {"number": 81, "word": "intrigued", "meaning": "興味をそそられた", "dialogue": [{"speaker": "A", "text": "Why are you intrigued by that locked cupboard?"}, {"speaker": "B", "text": "It says, Nothing interesting inside. Someone tried too hard."}], "translation": ["その鍵付き戸棚がどうして気になるの？", "面白い物は入っていませんと書いてある。わざわざ言うのが怪しい。"], "explanation": "intrigued は「興味をそそられた」。鍵のかかった戸棚に「中に面白いものはありません」と書かれているせいで、かえって気になります。わざわざ強く否定すると、何か隠しているように見える。「隠すための説明」が逆効果になるのがオチです。", "video": "q0a_IVAvLZA"}, {"number": 82, "word": "absurd", "meaning": "道理に合わない", "dialogue": [{"speaker": "A", "text": "Is the parking rule absurd?"}, {"speaker": "B", "text": "You need a permit to park while you apply for a parking permit."}], "translation": ["駐車規則はおかしいの？", "駐車許可を申請する間に駐車するための許可が必要。"], "explanation": "absurd は「道理に合わない」。駐車許可を申請しに来たのに、申請中に駐車するためにも許可が必要です。まだ持っていないものを、手に入れる条件として要求される。どこから始めても行き詰まる規則の不合理さを笑っています。", "video": "tr6aRr2ifiM"}, {"number": 83, "word": "acknowledge", "meaning": "事実を認める", "dialogue": [{"speaker": "A", "text": "Did he acknowledge his mistake?"}, {"speaker": "B", "text": "Yes. He called it an important contribution to our learning process."}], "translation": ["彼は間違いを認めた？", "うん。私たちの学びへの重要な貢献と呼んでいた。"], "explanation": "acknowledge は「事実を認める」。失敗を認めたと言いますが、本人の表現は「私たちの学びへの重要な貢献」。間違いを素直に呼ばず、手柄のように飾っているのがオチです。前向きな言い換えで体面を保とうとしています。", "video": "_iB6_9XPoXE"}, {"number": 84, "word": "apologize", "meaning": "謝る", "dialogue": [{"speaker": "A", "text": "Did you apologize for the noise?"}, {"speaker": "B", "text": "Yes. Through the microphone. That may have made things worse."}], "translation": ["騒音のことは謝った？", "うん。マイクで。それで悪化したかもしれない。"], "explanation": "apologize は「謝る」。騒音を謝るためにマイクを使ったので、謝罪そのものも大きな音になりました。迷惑を減らしたい行動が、同じ迷惑をさらに増やしてしまう逆効果の笑いです。", "video": "X85yP0PYAzg"}, {"number": 85, "word": "resolve", "meaning": "問題を解決する", "dialogue": [{"speaker": "A", "text": "Did you resolve the argument about the remote?"}, {"speaker": "B", "text": "Yes. The batteries died. We now disagree about who buys them."}], "translation": ["リモコンの取り合いは解決した？", "うん。電池が切れた。今は誰が買うかで争っている。"], "explanation": "resolve は「問題を解決する」。リモコン争いは電池切れで終わりましたが、今度は誰が電池を買うかで口論しています。争いがなくなったのではなく、テーマが変わっただけ。「解決した」という最初の返事がひっくり返るのがオチです。", "video": "LHJLQfyNiBs"}, {"number": 86, "word": "objective", "meaning": "達成したい目標", "dialogue": [{"speaker": "A", "text": "What's the objective of this training?"}, {"speaker": "B", "text": "To reduce unnecessary training. This is session seven."}], "translation": ["この研修の目的は？", "不要な研修を減らすこと。今回は七回目。"], "explanation": "objective は、ここでは「目標」。研修の目標は不要な研修を減らすことなのに、すでに第7回です。減らすための活動そのものが増え続ける、目的と手段の矛盾を皮肉っています。", "video": "ivPI7r9Jw1E"}, {"number": 87, "word": "preference", "meaning": "好み", "dialogue": [{"speaker": "A", "text": "Do you have a seating preference?"}, {"speaker": "B", "text": "Near the exit. I like my options visible."}], "translation": ["席の好みはある？", "出口の近く。選択肢は見える所に置きたい。"], "explanation": "preference は「好み」。座りたいのは出口の近くで、理由は「選択肢を目に見える所に置いておきたい」から。ここでほのめかす選択肢は、いつでも立ち去ること。帰りたい気持ちを、余裕のある判断のように言う控えめなオチです。", "video": "IX_g3nyWy-s"}, {"number": 88, "word": "incident", "meaning": "起きた出来事", "dialogue": [{"speaker": "A", "text": "Was there an incident at the bakery?"}, {"speaker": "B", "text": "Someone asked for half a doughnut. The room went silent."}], "translation": ["パン屋で何かあったの？", "誰かがドーナツを半分ほしいと言った。店内が静まり返った。"], "explanation": "incident は「出来事、事件」。パン屋で「ドーナツを半分ください」と頼んだだけなのに、店内が静まり返るほどの大事件として語ります。ささいな注文に反応が大きすぎる、という誇張の笑いです。半分を頼んではいけない英語圏の決まりや、特別な慣用句があるわけではありません。", "video": "5fj51EzcXzw"}, {"number": 89, "word": "generous", "meaning": "気前のよい", "dialogue": [{"speaker": "A", "text": "Your boss sounds generous."}, {"speaker": "B", "text": "He gave me all of Friday's unfinished work."}], "translation": ["気前のいい上司だね。", "金曜日の終わらなかった仕事を全部くれたよ。"], "explanation": "generous は普通、よいものを惜しまず与える「気前のよさ」。上司がたっぷりくれたのは、金曜に終わらなかった仕事でした。もらってうれしくないものまで惜しみなく渡すことを、褒め言葉で皮肉っています。", "video": "oAToVrP-DYM"}, {"number": 90, "word": "accessible", "meaning": "利用しやすい", "dialogue": [{"speaker": "A", "text": "Is the help page accessible?"}, {"speaker": "B", "text": "Very. Getting help from it is the difficult part."}], "translation": ["ヘルプページは開きやすい？", "とても。役に立つ答えを得る方が難しい。"], "explanation": "accessible は「アクセスできる、利用しやすい」。ヘルプページ自体は簡単に開けるのに、そこから役に立つ助けを得るのは難しいそうです。「ページにたどり着けること」と「問題が解決すること」の差を突く、サービスへの皮肉です。", "video": "5IMxbyufZBo"}, {"number": 91, "word": "loyal", "meaning": "忠実な", "dialogue": [{"speaker": "A", "text": "Is your dog loyal?"}, {"speaker": "B", "text": "Completely. Unless the visitor has cheese. Then he reviews the contract."}], "translation": ["犬は忠実なの？", "完全に。ただし客がチーズを持っていれば、契約を見直す。"], "explanation": "loyal は「忠実な」。犬は絶対に忠実だと言った直後に、「客がチーズを持っていたら契約を見直す」と例外が登場します。忠誠心を条件交渉のできる契約に見立て、おやつで揺らぐ犬の気持ちを表しています。", "video": "PzK0PvRsItk"}, {"number": 92, "word": "fascinated", "meaning": "強く心を引かれた", "dialogue": [{"speaker": "A", "text": "Why is the baby fascinated by that box?"}, {"speaker": "B", "text": "The toy cost eighty dollars. The box understands its audience."}], "translation": ["赤ちゃんはどうしてその箱に夢中なの？", "おもちゃは八十ドルだった。箱の方が客の心を分かっている。"], "explanation": "fascinated は「強く心を引かれた」。80ドルのおもちゃを買ったのに、赤ちゃんが夢中なのは箱のほう。「箱は自分の客をよく分かっている」と、箱を優秀な商品開発者のように褒めています。高価なおもちゃより包装が人気、という育児の「あるある」です。", "video": "fuj_TBE3YhE"}, {"number": 93, "word": "pointless", "meaning": "意味のない", "dialogue": [{"speaker": "A", "text": "Was the argument pointless?"}, {"speaker": "B", "text": "We argued about which of us argues less."}], "translation": ["その口論は無意味だった？", "どちらの方が口論しないかを争っていた。"], "explanation": "pointless は「意味がない」。どちらが口論をしない人かを、口論で決めようとしています。争えば争うほど、二人とも自分の主張を裏切ってしまう。その自己矛盾がオチです。", "video": "w-L_UEqeFZA"}, {"number": 94, "word": "interpret", "meaning": "意味を解釈する", "dialogue": [{"speaker": "A", "text": "How did you interpret the manager's silence?"}, {"speaker": "B", "text": "As approval. It was the most convenient translation."}], "translation": ["上司の沈黙をどう解釈した？", "賛成と。いちばん都合のいい翻訳だった。"], "explanation": "interpret は「意味を解釈する」。上司の沈黙を賛成と受け取った理由は、それが一番自分に都合がよかったから。本当にそういう意味か確かめず、望む答えを選んでいることを、あっさり白状するのがオチです。", "video": "JTH2Gd0qvPI"}, {"number": 95, "word": "complain", "meaning": "不満を言う", "dialogue": [{"speaker": "A", "text": "Did anyone complain about the free lunch?"}, {"speaker": "B", "text": "Yes. Someone wanted a refund."}], "translation": ["無料の昼食に文句を言った人はいた？", "うん。返金を求めた人がいた。"], "explanation": "complain は「不満を言う」。無料の昼食に不満を持つだけでなく、返金まで求める人がいました。そもそもお金を払っていないので、返してもらう代金がありません。文句を言いたい気持ちが理屈を追い越した、という笑いです。", "video": "0SschyJVVBc"}, {"number": 96, "word": "adapt", "meaning": "状況に合わせる", "dialogue": [{"speaker": "A", "text": "Have you adapted to working from home?"}, {"speaker": "B", "text": "Yes. I now lose my pen in a much more comfortable chair."}], "translation": ["在宅勤務には慣れた？", "うん。ずっと快適な椅子でペンをなくすようになった。"], "explanation": "adapt は「新しい状況に合わせる」。在宅勤務に慣れた成果が、「もっと快適な椅子でペンをなくせるようになった」ことでした。環境はよくなっても、本人のうっかりは変わっていない。その小さな自虐がオチです。", "video": "Hm9By89Cif8"}, {"number": 97, "word": "progress", "meaning": "進み具合", "dialogue": [{"speaker": "A", "text": "Are you making progress on the novel?"}, {"speaker": "B", "text": "Yes. The file is now called Final Final Really Final."}], "translation": ["小説は進んでいる？", "うん。ファイル名が最終・最終・本当に最終になった。"], "explanation": "progress は「進み具合」。小説が進んだ証拠として挙げるのは中身ではなく、「最終・最終・本当に最終」というファイル名。完成したつもりでも修正が続き、最終版が増える「あるある」です。名前だけでは本当に完成したか分からないところも面白さです。", "video": "VKuOXISmZHM"}, {"number": 98, "word": "judgment", "meaning": "判断", "dialogue": [{"speaker": "A", "text": "Do you trust your judgment?"}, {"speaker": "B", "text": "Usually. Except when a menu says limited edition."}], "translation": ["自分の判断力を信頼している？", "たいていは。メニューに期間限定と書いてある時以外。"], "explanation": "judgment は「判断力」。普段は自分の判断を信頼しているのに、メニューに「限定版」とあると例外になるそうです。「今しかない」と言われると冷静に選べなくなる、限定品に弱い自分への軽い自虐です。", "video": "gP6CvWmA-uc"}, {"number": 99, "word": "emergency", "meaning": "緊急事態", "dialogue": [{"speaker": "A", "text": "Why does the office have an emergency biscuit tin?"}, {"speaker": "B", "text": "For meetings that unexpectedly become workshops."}], "translation": ["職場に非常用ビスケット缶があるのはなぜ？", "会議が突然ワークショップに変わる時のため。"], "explanation": "emergency は「緊急事態」。非常用のビスケットを置く理由は、会議が予定外のワークショップに変わるから。長引いて参加も求められる会議を、食料を備えるほどの緊急事態として大げさに扱う、職場の「あるある」です。", "video": "igjnchhpHtc"}, {"number": 100, "word": "confident", "meaning": "自信がある", "dialogue": [{"speaker": "A", "text": "You sound confident."}, {"speaker": "B", "text": "I haven't read the instructions yet."}], "translation": ["自信がありそうだね。", "まだ説明書を読んでいないからね。"], "explanation": "confident は「自信がある」。堂々としている理由は、準備が万全だからではなく、まだ説明書を読んでいないから。難しさや注意点を知らないので不安もない。知識に裏づけられた自信を期待したら、知らないことが自信の源だった、という逆転です。", "video": "2hK2P6qL8NI"}];
const el=id=>document.getElementById(id);let current=items[0];
function list(){const q=el('search').value.trim().toLowerCase().replace(/^#/,'');const found=items.filter(i=>!q||(/^\d+$/.test(q)?i.number===Number(q):[i.word,i.meaning].join(' ').toLowerCase().includes(q)));el('count').textContent=`${found.length} / ${items.length}語`;el('empty').hidden=!!found.length;el('list').replaceChildren(...found.map(i=>{const b=document.createElement('button');b.textContent=`${String(i.number).padStart(3,'0')}  ${i.word}`;b.setAttribute('aria-current',String(i===current));b.onclick=()=>choose(i.number,true);return b;}));}
function paragraphs(id,values){el(id).replaceChildren(...values.map(t=>{const p=document.createElement('p');p.textContent=t;return p;}));}
function choose(n,update=false){current=items.find(i=>i.number===n)||items[0];el('number').textContent=`WORD ${String(current.number).padStart(3,'0')} / 100`;for(const key of ['word','meaning','explanation'])el(key).textContent=current[key];paragraphs('dialogue',current.dialogue.map(d=>`${d.speaker}: ${d.text}`));paragraphs('translation',current.translation);el('detail').querySelector('details').open=false;el('youtube').href=`https://www.youtube.com/watch?v=${current.video}`;el('prev').disabled=current.number===1;el('next').disabled=current.number===100;const b=document.createElement('button');b.textContent='▶ 動画を再生';b.onclick=()=>{const f=document.createElement('iframe');f.title=`${current.word} — Word of the Day`;f.src=`https://www.youtube-nocookie.com/embed/${current.video}?autoplay=1&playsinline=1`;f.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';f.allowFullscreen=true;f.referrerPolicy='strict-origin-when-cross-origin';el('player').replaceChildren(f);};el('player').replaceChildren(b);if(update)history.pushState(null,'',`#word-${current.number}`);list();}
el('search').oninput=list;el('prev').onclick=()=>choose(current.number-1,true);el('next').onclick=()=>choose(current.number+1,true);function fromHash(){choose(Number(location.hash.match(/^#word-(\d+)$/)?.[1])||1);}window.addEventListener('hashchange',fromHash);window.addEventListener('popstate',fromHash);fromHash();
</script></body></html>
