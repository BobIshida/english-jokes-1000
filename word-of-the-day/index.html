には調整が必要だった？", "うん。期待を夕食から科学実験へ調整した。"], "explanation": "adjustment は「調整」。レシピの材料や火加減を調整したのではなく、期待を「夕食」から「科学実験」へ変更。料理の失敗を認める代わりに、評価の基準を下げてしのいでいます。", "video": "", "media": "media/word-176.mp4"}, {"number": 177, "word": "grateful", "meaning": "感謝している", "dialogue": [{"speaker": "A", "text": "Are you grateful for your smart doorbell?"}, {"speaker": "B", "text": "Absolutely. Now I can ignore visitors in high definition."}], "translation": ["高機能なドアベルに感謝してる？", "もちろん。今は高画質で訪問者を無視できる。"], "explanation": "grateful は「感謝している」。スマートドアベルに感謝する理由は、来客を高画質で無視できるから。便利な応対機能を、応対しないために使うという目的のひねりです。", "video": "", "media": "media/word-177.mp4"}, {"number": 178, "word": "adequate", "meaning": "必要な程度を満たした", "dialogue": [{"speaker": "A", "text": "Is your French adequate for the trip?"}, {"speaker": "B", "text": "I can order bread. I have no plans beyond that."}], "translation": ["旅行に十分なフランス語は話せる？", "パンを注文できる。それ以上の予定はない。"], "explanation": "adequate は「必要な程度を満たした」。旅行に十分なフランス語力があるか聞かれ、パンを注文できるから十分と答えます。語学力を広げるのでなく、旅行中にすることをパンの注文へ狭める発想がオチです。", "video": "", "media": "media/word-178.mp4"}, {"number": 179, "word": "fussy", "meaning": "細かいことにうるさい", "dialogue": [{"speaker": "A", "text": "Is your cat a fussy eater?"}, {"speaker": "B", "text": "He rejected three brands, then ate the cardboard box."}], "translation": ["猫は食べ物にうるさい？", "3種類を拒否して、その段ボール箱を食べた。"], "explanation": "fussy は「細かいことにうるさい」。猫は3種類のフードを選り好みした挙げ句、段ボールを食べます。高い食の基準があるようで、最後に選ぶ物が食べ物ですらないという矛盾です。", "video": "", "media": "media/word-179.mp4"}, {"number": 180, "word": "homesick", "meaning": "故郷が恋しい", "dialogue": [{"speaker": "A", "text": "Are you homesick at university?"}, {"speaker": "B", "text": "A little. I even miss being told to clean my room."}], "translation": ["大学でホームシックになってる？", "少し。部屋を片付けろと言われるのも懐かしい。"], "explanation": "homesick は「故郷が恋しい」。大学で恋しいのは、家で部屋を片づけろと言われることまで。普段ならうるさく感じる小言も、離れると懐かしくなるという、ほほえましい逆転です。", "video": "", "media": "media/word-180.mp4"}, {"number": 181, "word": "suspicious", "meaning": "疑わしい", "dialogue": [{"speaker": "A", "text": "Does this offer seem suspicious?"}, {"speaker": "B", "text": "It promises free money, but even the exclamation marks look nervous."}], "translation": ["この話、怪しいと思う？", "無料でお金をくれるらしいけど、感嘆符まで不安そう。"], "explanation": "suspicious は「疑わしい」。無料のお金を約束する怪しい宣伝で、感嘆符まで不安そうに見えると言います。文章の記号も内容を信用していないかのように扱い、怪しさを強調しています。", "video": "", "media": "media/word-181.mp4"}, {"number": 182, "word": "concentrate", "meaning": "集中する", "dialogue": [{"speaker": "A", "text": "Can you concentrate with all that noise?"}, {"speaker": "B", "text": "Yes. I'm concentrating on finding out who's making it."}], "translation": ["この騒音の中で集中できる？", "うん。誰が音を出してるかに集中してる。"], "explanation": "concentrate は「集中する」。騒音の中でも集中できると言いますが、集中しているのは音の出所探し。本来の作業への集中から対象をすり替えて、できているように答えています。", "video": "", "media": "media/word-182.mp4"}, {"number": 183, "word": "interrupt", "meaning": "話を遮る", "dialogue": [{"speaker": "A", "text": "May I interrupt your story?"}, {"speaker": "B", "text": "You already have. Very efficiently, too."}], "translation": ["話を遮ってもいい？", "もう遮ったね。しかも手際よく。"], "explanation": "interrupt は「話を遮る」。「話を遮ってよい？」と尋ねた時点で、すでに相手の話を遮っています。許可を求める行為自体が目的を達成しているので、「効率よくできた」と皮肉られます。", "video": "", "media": "media/word-183.mp4"}, {"number": 184, "word": "reschedule", "meaning": "予定を組み直す", "dialogue": [{"speaker": "A", "text": "Why did you reschedule the dentist appointment?"}, {"speaker": "B", "text": "It conflicted with my plans to avoid the dentist."}], "translation": ["なぜ歯医者の予約を変更したの？", "歯医者を避ける予定と重なったから。"], "explanation": "reschedule は「予定を組み直す」。歯科予約が重なったのは別の用事ではなく、「歯医者を避ける予定」。行きたくない気持ちを正式な予定として扱い、変更を正当化しています。", "video": "", "media": "media/word-184.mp4"}, {"number": 185, "word": "initiative", "meaning": "自ら率先する行動", "dialogue": [{"speaker": "A", "text": "Who showed initiative during the power cut?"}, {"speaker": "B", "text": "Maya. She started the barbecue before anyone found a flashlight."}], "translation": ["停電中、誰が率先して動いた？", "マヤ。懐中電灯を探すより先にバーベキューを始めた。"], "explanation": "initiative は「自ら率先する行動」。停電時、懐中電灯を探すより先にバーベキューを始めた人を評価しています。通常の復旧準備ではなく、すぐ楽しめる方法を自主的に見つける行動力が面白いところです。", "video": "", "media": "media/word-185.mp4"}, {"number": 186, "word": "commitment", "meaning": "責任を持って取り組む約束", "dialogue": [{"speaker": "A", "text": "That's real commitment to your exercise routine."}, {"speaker": "B", "text": "I renew the gym membership every year, without fail."}], "translation": ["運動習慣への強い決意だね。", "毎年欠かさずジムの契約を更新してる。"], "explanation": "commitment は「責任を持って取り組む約束」。運動への熱心な取り組みを褒められ、毎年欠かさずジム会費を更新すると返します。継続しているのは運動そのものではなく契約、というすれ違いです。", "video": "", "media": "media/word-186.mp4"}, {"number": 187, "word": "improvement", "meaning": "改善", "dialogue": [{"speaker": "A", "text": "Have you seen an improvement in my parking?"}, {"speaker": "B", "text": "Yes. This time, the car is in just one space."}], "translation": ["僕の駐車、上達したと思う？", "うん。今回は枠が一つで済んだ。"], "explanation": "improvement は「改善」。駐車が上達した点は、車が一つの区画に収まるようになったこと。普通なら最低限の条件を大きな進歩として褒めるので、以前の状態が想像できます。", "video": "", "media": "media/word-187.mp4"}, {"number": 188, "word": "practical", "meaning": "実用的な", "dialogue": [{"speaker": "A", "text": "Why did you buy a practical wedding gift?"}, {"speaker": "B", "text": "They already have love. They need a can opener."}], "translation": ["なぜ実用的な結婚祝いにしたの？", "愛はもうある。必要なのは缶切りだ。"], "explanation": "practical は「実用的な」。結婚祝いに実用品を選ぶのは、愛はすでにあるが缶切りは必要だから。ロマンチックな祝いを、暮らしの具体的な不足へ引き戻す現実的な返答です。", "video": "", "media": "media/word-188.mp4"}, {"number": 189, "word": "consistent", "meaning": "一貫した", "dialogue": [{"speaker": "A", "text": "Is the service here consistent?"}, {"speaker": "B", "text": "Absolutely. They've forgotten my order three visits in a row."}], "translation": ["ここのサービスは安定してる？", "もちろん。3回続けて注文を忘れられた。"], "explanation": "consistent は「一貫した」。サービスの一貫性を尋ねると、注文を3回連続で忘れたと答えます。安定して良いという期待に反し、毎回同じ失敗をする意味で一貫していると皮肉っています。", "video": "", "media": "media/word-189.mp4"}, {"number": 190, "word": "pushy", "meaning": "強引な", "dialogue": [{"speaker": "A", "text": "Was the salesman pushy?"}, {"speaker": "B", "text": "He offered me a discount while I was locking my car."}], "translation": ["販売員は強引だった？", "車に鍵をかけてる最中も値引きを提案してきた。"], "explanation": "pushy は「強引な」。営業担当者は、相手が車に鍵をかけている最中まで値引きを持ちかけます。商談が終わって離れようとする場面にも食い下がる姿で、押しの強さを示しています。", "video": "", "media": "media/word-190.mp4"}, {"number": 191, "word": "nostalgic", "meaning": "懐かしく思う", "dialogue": [{"speaker": "A", "text": "Does that old computer make you nostalgic?"}, {"speaker": "B", "text": "Yes. I miss having enough time to make tea while it started."}], "translation": ["古いパソコンを見ると懐かしい？", "うん。起動中にお茶を入れる時間があったのがね。"], "explanation": "nostalgic は「懐かしく思う」。古いパソコンの起動の遅さを、お茶を入れる時間があったと懐かしんでいます。不便だった待ち時間を、ゆとりのある良い思い出へ言い換えています。", "video": "", "media": "media/word-191.mp4"}, {"number": 192, "word": "acceptable", "meaning": "受け入れられる", "dialogue": [{"speaker": "A", "text": "Is this an acceptable excuse for being late?"}, {"speaker": "B", "text": "Your cat stole the car? At least give him a driver's license."}], "translation": ["この遅刻の言い訳、通用する？", "猫が車を盗んだ？ せめて免許は持たせて。"], "explanation": "acceptable は「受け入れられる」。遅刻の言い訳が「猫が車を盗んだ」では信じ難いのに、返答はまず猫の免許を要求します。あり得ない話を一度受け入れ、別の細部だけを問題にする冗談です。", "video": "", "media": "media/word-192.mp4"}, {"number": 193, "word": "reflect", "meaning": "じっくり振り返る", "dialogue": [{"speaker": "A", "text": "Do you reflect on your decisions at night?"}, {"speaker": "B", "text": "Yes. Usually the decision to drink coffee at nine."}], "translation": ["夜、自分の判断を振り返る？", "うん。大抵、9時にコーヒーを飲んだ判断を。"], "explanation": "reflect は「じっくり振り返る」。夜に自分の決断を振り返ると言うと深い内省に聞こえますが、対象は夜9時にコーヒーを飲んだこと。眠れない原因となった身近な選択を悔やんでいます。", "video": "", "media": "media/word-193.mp4"}, {"number": 194, "word": "exaggerate", "meaning": "大げさに言う", "dialogue": [{"speaker": "A", "text": "Don't exaggerate. The queue wasn't a mile long."}, {"speaker": "B", "text": "Fine. But I celebrated two birthdays in it."}], "translation": ["大げさに言わないで。列は1マイルもなかったよ。", "分かった。でも並んでる間に誕生日が2回来た。"], "explanation": "exaggerate は「大げさに言う」。行列の長さを大げさに言うなと注意され、今度は待つ間に誕生日を2回迎えたと返します。距離の誇張を引っ込めても、さらに大きな時間の誇張で言い直しています。", "video": "", "media": "media/word-194.mp4"}, {"number": 195, "word": "approve", "meaning": "承認する", "dialogue": [{"speaker": "A", "text": "Did the manager approve your holiday request?"}, {"speaker": "B", "text": "Yes. My inbox is currently appealing the decision."}], "translation": ["上司は休暇申請を承認した？", "うん。受信箱が今、不服を申し立ててる。"], "explanation": "approve は「承認する」。上司が休暇を承認しても、受信箱がその決定に異議を申し立てています。たまるメールを意思のある相手に見立て、許可だけでは安心して休めない状況を描いています。", "video": "", "media": "media/word-195.mp4"}, {"number": 196, "word": "incentive", "meaning": "行動を促す動機や報酬", "dialogue": [{"speaker": "A", "text": "What's your incentive for finishing early?"}, {"speaker": "B", "text": "The bakery closes at five. That's a firm deadline."}], "translation": ["早く終える動機は何？", "パン屋が5時に閉まる。それは動かせない締め切りだ。"], "explanation": "incentive は「行動を促す動機や報酬」。早く仕事を終える動機は、パン屋が5時に閉まること。会社の締め切りより食べたいものの販売時間が強い動機になり、それを厳格な期限として扱っています。", "video": "", "media": "media/word-196.mp4"}, {"number": 197, "word": "responsibility", "meaning": "責任", "dialogue": [{"speaker": "A", "text": "Is feeding the goldfish your son's responsibility?"}, {"speaker": "B", "text": "Yes. The fish now recognizes the sound of a video game ending."}], "translation": ["金魚の餌やりは息子さんの担当？", "うん。金魚はゲームが終わる音を覚えた。"], "explanation": "responsibility は「責任」。金魚はゲームが終わる音を覚えました。息子が担当する餌やりがゲームの後回しになっていると、魚の学習からわかるのがオチです。", "video": "", "media": "media/word-197.mp4"}, {"number": 198, "word": "recovery", "meaning": "回復", "dialogue": [{"speaker": "A", "text": "How is your recovery after the marathon?"}, {"speaker": "B", "text": "My legs are fine. My friends are still recovering from my stories."}], "translation": ["マラソン後の回復はどう？", "脚は元気。友達は僕の体験談からまだ回復中。"], "explanation": "recovery は「回復」。マラソン後に回復が必要なのは脚より、体験談を聞かされた友人たち。走った本人から聞き手へ疲労の主体を移し、長い自慢話を遠回しに示しています。", "video": "", "media": "media/word-198.mp4"}, {"number": 199, "word": "temporary", "meaning": "一時的な", "dialogue": [{"speaker": "A", "text": "Is that a temporary repair?"}, {"speaker": "B", "text": "Of course. The tape has only been there since last summer."}], "translation": ["それは一時的な修理？", "もちろん。テープは去年の夏から貼ってあるだけ。"], "explanation": "temporary は「一時的な」。応急処置のテープが去年の夏から貼られたままでも、「まだそれだけ」と言い張ります。一時的という言葉と、実際に放置された長さの食い違いが面白いところです。", "video": "", "media": "media/word-199.mp4"}, {"number": 200, "word": "thorough", "meaning": "徹底的な", "dialogue": [{"speaker": "A", "text": "Was the apartment inspection thorough?"}, {"speaker": "B", "text": "Very. They found a dust bunny and asked for its lease."}], "translation": ["部屋の点検は徹底していた？", "すごく。綿ぼこりを見つけて賃貸契約を求めた。"], "explanation": "thorough は「徹底的な」。部屋の検査が徹底しすぎて、綿ぼこりにまで賃貸契約を尋ねます。dust bunny は丸まったほこりのこと。それを住人のように扱う、行き過ぎた点検の誇張です。", "video": "", "media": "media/word-200.mp4"}, {"number": 201, "word": "insecure", "meaning": "自信がなく不安な", "dialogue": [{"speaker": "A", "text": "Why is the new actor insecure?"}, {"speaker": "B", "text": "He keeps asking the mirror for a second opinion."}], "translation": ["新人俳優はなぜ自信がないの？", "鏡にも別の意見を求め続けてる。"], "explanation": "insecure は「自信がなく不安な」。自信のない俳優が鏡にまで別の意見を求めます。本来返事をしない鏡にも評価を求める姿で、他人の承認なしでは安心できない気持ちを誇張しています。", "video": "", "media": "media/word-201.mp4"}, {"number": 202, "word": "enthusiastic", "meaning": "熱心な", "dialogue": [{"speaker": "A", "text": "Our intern is enthusiastic about filing."}, {"speaker": "B", "text": "He gave each folder a welcome speech."}], "translation": ["新人は書類整理に熱心だね。", "フォルダーごとに歓迎の挨拶をしたよ。"], "explanation": "enthusiastic は「熱心な」。書類整理への熱意が、フォルダー一つ一つに歓迎のスピーチをするほど。単純な事務作業を入社式のように盛り上げる、熱心さの行き過ぎがオチです。", "video": "", "media": "media/word-202.mp4"}, {"number": 203, "word": "beneficial", "meaning": "有益な", "dialogue": [{"speaker": "A", "text": "Is walking to work beneficial?"}, {"speaker": "B", "text": "My wallet lost weight when I passed the bakery."}], "translation": ["徒歩通勤はためになる？", "パン屋を通ったら財布が痩せたよ。"], "explanation": "beneficial は「有益な」。徒歩通勤で体重が減ったと思わせて、軽くなったのはパン屋でお金を使った財布。運動の健康効果への期待を、途中の買い食いによる出費にひっくり返しています。", "video": "", "media": "media/word-203.mp4"}, {"number": 204, "word": "rely", "meaning": "頼りにする", "dialogue": [{"speaker": "A", "text": "Can I rely on you to keep a secret?"}, {"speaker": "B", "text": "Certainly. My memory has a strict deletion policy."}], "translation": ["秘密を守ると信じていい？", "もちろん。僕の記憶には厳格な削除方針がある。"], "explanation": "rely は「頼りにする」。秘密を守る人として頼れる理由は、記憶がすぐ削除されること。口の堅さという長所ではなく、忘れっぽさという弱点を保証に使っています。", "video": "", "media": "media/word-204.mp4"}, {"number": 205, "word": "mention", "meaning": "話題として触れる", "dialogue": [{"speaker": "A", "text": "Did you mention the broken window?"}, {"speaker": "B", "text": "Briefly. Then I mentioned how lovely the fresh air was."}], "translation": ["窓が割れたことには触れた？", "少しね。それから新鮮な空気を褒めた。"], "explanation": "mention は「話題として触れる」。割れた窓には少しだけ触れ、すぐ新鮮な空気の良さへ話を移します。不都合な事実は隠さず伝えた形を取りつつ、話題を良い面へそらしているのが面白いところです。", "video": "", "media": "media/word-205.mp4"}, {"number": 206, "word": "reject", "meaning": "却下する", "dialogue": [{"speaker": "A", "text": "Why did they reject your restaurant name?"}, {"speaker": "B", "text": "Apparently, Kitchen Experiments doesn't inspire confidence."}], "translation": ["なぜ店名を却下されたの？", "「台所実験室」では安心できないらしい。"], "explanation": "reject は「却下する」。店名の「台所の実験」は、創造的にも聞こえますが、客には料理がまだ試作段階のように響きます。作り手の意欲と、食べる側の安心感が食い違っています。", "video": "", "media": "media/word-206.mp4"}, {"number": 207, "word": "permission", "meaning": "許可", "dialogue": [{"speaker": "A", "text": "Did you get permission to bring your dog?"}, {"speaker": "B", "text": "Yes. He still needs a visitor badge."}], "translation": ["犬を連れてくる許可は取った？", "うん。まだ来客用の名札が必要だけど。"], "explanation": "permission は「許可」。犬の同伴許可は出たのに、犬にも来訪者バッジが必要です。人間向けの事務手続きを犬へそのまま適用する、形式的すぎる対応がオチです。", "video": "", "media": "media/word-207.mp4"}, {"number": 208, "word": "obligation", "meaning": "果たすべき義務", "dialogue": [{"speaker": "A", "text": "Is attending the reunion an obligation?"}, {"speaker": "B", "text": "No. The seventeen reminder emails are purely decorative."}], "translation": ["同窓会に出るのは義務？", "違うよ。17通の催促メールはただの飾り。"], "explanation": "obligation は「果たすべき義務」。同窓会参加は義務ではないと言いながら、催促メールは17通。「ただの飾り」と言うのは皮肉で、自由参加の建前と強い圧力との矛盾を指しています。", "video": "", "media": "media/word-208.mp4"}, {"number": 209, "word": "replacement", "meaning": "代わりとなるもの", "dialogue": [{"speaker": "A", "text": "Have you found a replacement for your assistant?"}, {"speaker": "B", "text": "A calendar. It complains less but makes terrible coffee."}], "translation": ["助手の代わりは見つかった？", "カレンダー。文句は少ないけどコーヒーは苦手。"], "explanation": "replacement は「代わりとなるもの」。助手の代わりに予定表を使えば文句は減りますが、コーヒーは作れません。人と道具を同じ基準で比べ、予定管理以外の仕事まで代替品に期待しています。", "video": "", "media": "media/word-209.mp4"}, {"number": 210, "word": "permanent", "meaning": "永続的な", "dialogue": [{"speaker": "A", "text": "Is that a permanent tattoo?"}, {"speaker": "B", "text": "I hope so. It says temporary decisions are dangerous."}], "translation": ["それは消えないタトゥー？", "そう願うよ。一時の判断は危険、と書いてある。"], "explanation": "permanent は「永続的な」。永久に残るタトゥーの文面が「一時の決断は危険」。衝動的な選択を戒める言葉そのものを、取り消しにくい選択で刻むという皮肉があります。", "video": "", "media": "media/word-210.mp4"}, {"number": 211, "word": "systematic", "meaning": "体系的な", "dialogue": [{"speaker": "A", "text": "Your packing is very systematic."}, {"speaker": "B", "text": "Socks by color, snacks by emotional importance."}], "translation": ["荷造りが体系的だね。", "靴下は色別、おやつは心の重要度順。"], "explanation": "systematic は「体系的な」。荷造りは靴下を色別に整理するだけでなく、お菓子も感情的な重要度順に分類。整然とした作業へ個人的な食べ物への思い入れを持ち込んでいます。", "video": "", "media": "media/word-211.mp4"}, {"number": 212, "word": "defensive", "meaning": "批判に身構える", "dialogue": [{"speaker": "A", "text": "Why are you getting defensive?"}, {"speaker": "B", "text": "I'm not! I've prepared twelve reasons why I'm not."}], "translation": ["なぜ批判に身構えるの？", "身構えてない！ その理由を12個用意した。"], "explanation": "defensive は「批判に身構える」。身構えて反論していると指摘され、否定するための理由を12個も用意します。否定に力を入れる行動自体が、指摘された態度の証拠になっています。", "video": "", "media": "media/word-212.mp4"}, {"number": 213, "word": "indifferent", "meaning": "関心がない", "dialogue": [{"speaker": "A", "text": "Is your cat indifferent to your success?"}, {"speaker": "B", "text": "He sat on my award. I think that's his review."}], "translation": ["猫は君の成功に無関心？", "賞状に座った。それが評価らしい。"], "explanation": "indifferent は「関心がない」。飼い主の受賞に猫が示した反応は、賞の上に座ること。栄誉としては関心がなく、座り場所として扱う様子を、猫なりの批評と解釈しています。", "video": "", "media": "media/word-213.mp4"}, {"number": 214, "word": "harmful", "meaning": "害を及ぼす", "dialogue": [{"speaker": "A", "text": "Is this habit harmful?"}, {"speaker": "B", "text": "Only to your savings. You collect restaurant menus by ordering everything."}], "translation": ["この習慣は有害かな？", "貯金にはね。全品注文してメニューを集めるから。"], "explanation": "harmful は「害を及ぼす」。メニューを集める方法が、全品注文すること。収集自体は無害そうですが、そのたびに代金がかかるため、被害を受けるのは貯金だと答えています。", "video": "", "media": "media/word-214.mp4"}, {"number": 215, "word": "suspect", "meaning": "そうではないかと疑う", "dialogue": [{"speaker": "A", "text": "Do you suspect someone ate your lunch?"}, {"speaker": "B", "text": "The only witness has mustard on his tie."}], "translation": ["誰かに昼食を食べられたと疑ってる？", "唯一の目撃者のネクタイにマスタードが付いてる。"], "explanation": "suspect は「そうではないかと疑う」。昼食を盗み食いしたか疑う相手が、唯一の目撃者で、ネクタイにマスタードを付けています。証言を求めたい人物自身が、食べた痕跡を身に付けているのがオチです。", "video": "", "media": "media/word-215.mp4"}, {"number": 216, "word": "confirm", "meaning": "確かめる", "dialogue": [{"speaker": "A", "text": "Can you confirm the meeting is canceled?"}, {"speaker": "B", "text": "Yes. We're meeting at three to discuss the cancellation."}], "translation": ["会議の中止を確認できますか？", "はい。中止について3時に集まります。"], "explanation": "confirm は「確かめる」。会議の中止を確認したら、その中止を話し合う会議が3時にあります。取りやめて時間を節約するはずが、別の会議を生むという職場の皮肉です。", "video": "", "media": "media/word-216.mp4"}, {"number": 217, "word": "withdraw", "meaning": "申し出などを取り下げる", "dialogue": [{"speaker": "A", "text": "Why did you withdraw your offer to babysit?"}, {"speaker": "B", "text": "They sent me a photo. I thought they had one child."}], "translation": ["なぜ子守の申し出を取り下げたの？", "写真が来た。子どもは一人だと思ってた。"], "explanation": "withdraw は「申し出などを取り下げる」。子守りの申し出を取り下げたのは、写真で子どもが一人ではないと分かったから。親切を申し出た時の想定と、実際の負担との落差が表れています。", "video": "", "media": "media/word-217.mp4"}, {"number": 218, "word": "restriction", "meaning": "制限", "dialogue": [{"speaker": "A", "text": "Is there a restriction on luggage?"}, {"speaker": "B", "text": "Yes. Apparently, emotional baggage must also fit overhead."}], "translation": ["荷物に制限はある？", "うん。心の重荷も頭上の棚に入れるらしい。"], "explanation": "restriction は「制限」。emotional baggage は過去の経験から抱える心の重荷。それまで頭上の荷物棚に収めるよう求めるので、比喩の「荷物」を旅行かばんと同じ物として扱う言葉遊びです。", "video": "", "media": "media/word-218.mp4"}, {"number": 219, "word": "temptation", "meaning": "したくなる誘惑", "dialogue": [{"speaker": "A", "text": "How do you resist temptation at the bakery?"}, {"speaker": "B", "text": "I cross the street. Unfortunately, there's another bakery."}], "translation": ["パン屋で誘惑にどう耐えるの？", "道の反対側へ渡る。残念ながらそこにもパン屋。"], "explanation": "temptation は「したくなる誘惑」。パン屋の誘惑を避けるため道の反対側へ渡ったのに、そちらにもパン屋があります。誘惑から逃れる作戦が、新しい誘惑に直結してしまいます。", "video": "", "media": "media/word-219.mp4"}, {"number": 220, "word": "maintenance", "meaning": "状態を保つ手入れ", "dialogue": [{"speaker": "A", "text": "Does your bicycle need much maintenance?"}, {"speaker": "B", "text": "Less than my reasons for not riding it."}], "translation": ["自転車の手入れは大変？", "乗らない理由を維持するよりは楽。"], "explanation": "maintenance は「状態を保つ手入れ」。自転車の手入れより、乗らない理由を保つ方が手間がかかると言います。怠けるための言い訳を作り続ける作業も「維持管理」と捉えるのが面白いところです。", "video": "", "media": "media/word-220.mp4"}, {"number": 221, "word": "accurate", "meaning": "正確な", "dialogue": [{"speaker": "A", "text": "Is your weather app accurate?"}, {"speaker": "B", "text": "It accurately describes the weather I just walked through."}], "translation": ["天気アプリは正確？", "今歩いてきた天気を正確に説明してくれる。"], "explanation": "accurate は「正確な」。天気アプリは正確でも、教えてくれるのは歩いてきた場所の過去の天気。これからの行動に役立つ予報を期待すると、正しさだけでは不十分だと分かる皮肉です。", "video": "", "media": "media/word-221.mp4"}, {"number": 222, "word": "convenient", "meaning": "便利な", "dialogue": [{"speaker": "A", "text": "Is the new gym convenient?"}, {"speaker": "B", "text": "Very. I can see it from the doughnut shop."}], "translation": ["新しいジムは便利？", "とても。ドーナツ店から見えるんだ。"], "explanation": "convenient は「便利な」。ジムが便利な理由は、ドーナツ店から見えること。運動へ通いやすいのではなく、おやつを食べながら眺めやすいという、利用者の目的のずれがオチです。", "video": "", "media": "media/word-222.mp4"}, {"number": 223, "word": "essential", "meaning": "不可欠な", "dialogue": [{"speaker": "A", "text": "What's essential for camping?"}, {"speaker": "B", "text": "Someone who remembers where we parked."}], "translation": ["キャンプに不可欠なものは？", "駐車場所を覚えている人。"], "explanation": "essential は「不可欠な」。キャンプの必需品に道具ではなく、駐車場所を覚えている人を挙げます。自然の中の装備より、帰りに車へたどり着けるという身近な問題を重視しています。", "video": "", "media": "media/word-223.mp4"}, {"number": 224, "word": "optional", "meaning": "任意の", "dialogue": [{"speaker": "A", "text": "Is the team picnic optional?"}, {"speaker": "B", "text": "Yes. So is explaining your absence to the boss."}], "translation": ["職場のピクニックは自由参加？", "うん。欠席理由を上司に説明するのも自由。"], "explanation": "optional は「任意の」。社内ピクニックは任意でも、欠席を上司に説明することまで「任意」と念押し。文面上は自由なのに、説明を迫られそうな圧力がにじむ返答です。", "video": "", "media": "media/word-224.mp4"}, {"number": 225, "word": "obvious", "meaning": "明らかな", "dialogue": [{"speaker": "A", "text": "Was it obvious I disliked the cake?"}, {"speaker": "B", "text": "You asked whether the plate was edible instead."}], "translation": ["ケーキが嫌いってバレバレだった？", "代わりに皿を食べられるか聞いたからね。"], "explanation": "obvious は「明らかな」。ケーキが嫌いだと明言しなくても、代わりに皿が食べられるか聞けば態度は明白です。食べ物より食器を選びたいほど、という極端な比較で示しています。", "video": "", "media": "media/word-225.mp4"}, {"number": 226, "word": "subtle", "meaning": "さりげない・微妙な", "dialogue": [{"speaker": "A", "text": "Was my hint subtle enough?"}, {"speaker": "B", "text": "You left a ring catalog open on his pillow."}], "translation": ["私のほのめかし、さりげなかった？", "彼の枕に指輪のカタログを開いて置いたね。"], "explanation": "subtle は「さりげない・微妙な」。それとなく伝えたつもりのヒントが、枕の上に開いて置いた指輪カタログ。結婚や贈り物への希望が隠れておらず、控えめという自己評価と行動が食い違います。", "video": "", "media": "media/word-226.mp4"}, {"number": 227, "word": "genuine", "meaning": "本物の・心からの", "dialogue": [{"speaker": "A", "text": "Was her smile genuine?"}, {"speaker": "B", "text": "Yes. I told her the meeting had been moved to my day off."}], "translation": ["彼女の笑顔は本心だった？", "うん。会議が僕の休日に移ったと伝えたから。"], "explanation": "genuine は「本物の・心からの」。会議が話し手の休日へ移ったと聞いた女性の笑顔は、本物だったそうです。ただし、なぜ喜んだのかは会話だけでは断定できません。他人には不都合な知らせと明るい反応の対照を楽しむ場面です。", "video": "", "media": "media/word-227.mp4"}, {"number": 228, "word": "predictable", "meaning": "予測できる", "dialogue": [{"speaker": "A", "text": "Is the ending predictable?"}, {"speaker": "B", "text": "The hero bought travel insurance. Someone's losing a suitcase."}], "translation": ["結末は予測できる？", "主人公が旅行保険に入った。誰かが荷物をなくす。"], "explanation": "predictable は「予測できる」。主人公が旅行保険に入った場面を見て、荷物紛失を予想します。物語でわざわざ見せる細部は後で使われるはず、という読み方を日常的な保険に当てはめています。", "video": "", "media": "media/word-228.mp4"}, {"number": 229, "word": "persuade", "meaning": "説得する", "dialogue": [{"speaker": "A", "text": "How did you persuade Dad to use headphones?"}, {"speaker": "B", "text": "I started learning the recorder beside him."}], "translation": ["どうやって父にヘッドホンを使わせたの？", "隣でリコーダーの練習を始めた。"], "explanation": "persuade は「説得する」。父にヘッドホンを使ってもらうため、隣でリコーダーの練習を始めます。説明して納得させる代わりに、音を遮りたくなる状況を作る間接的な説得です。", "video": "", "media": "media/word-229.mp4"}, {"number": 230, "word": "negotiate", "meaning": "交渉する", "dialogue": [{"speaker": "A", "text": "Did you negotiate the price?"}, {"speaker": "B", "text": "Yes. I paid full price, but he said it very kindly."}], "translation": ["値段は交渉した？", "うん。定価だったけど、優しく言ってくれた。"], "explanation": "negotiate は「交渉する」。値段交渉の結果は定価のままですが、店員が優しく言ってくれたと報告します。金額で何も勝ち取っていないのに、接客の良さを成果として取り繕っています。", "video": "", "media": "media/word-230.mp4"}, {"number": 231, "word": "compromise", "meaning": "妥協・歩み寄り", "dialogue": [{"speaker": "A", "text": "Did you reach a compromise on the music?"}, {"speaker": "B", "text": "She picked the songs. I picked the earplugs."}], "translation": ["音楽の件で歩み寄れた？", "彼女が曲を選び、僕は耳栓を選んだ。"], "explanation": "compromise は「妥協・歩み寄り」。音楽の妥協案は、彼女が曲を選び、話し手が耳栓を選ぶこと。二人とも音楽を楽しむ合意ではなく、一人が聞かないことで成立した折り合いです。", "video": "", "media": "media/word-231.mp4"}, {"number": 232, "word": "hesitate", "meaning": "ためらう", "dialogue": [{"speaker": "A", "text": "Why did you hesitate before tasting it?"}, {"speaker": "B", "text": "The chef put on safety goggles."}], "translation": ["なぜ食べる前にためらったの？", "料理人が保護ゴーグルを着けたから。"], "explanation": "hesitate は「ためらう」。料理を口にする前にためらうのは、料理人が保護メガネをかけたから。試食が危険な実験のように見え、料理への警戒心を大げさに描いています。", "video": "", "media": "media/word-232.mp4"}, {"number": 233, "word": "justify", "meaning": "正当化する", "dialogue": [{"speaker": "A", "text": "How do you justify buying three identical coats?"}, {"speaker": "B", "text": "One for rain, one for snow, one for regret."}], "translation": ["同じコートを3着買う理由は？", "雨用、雪用、そして後悔用。"], "explanation": "justify は「正当化する」。同じコート3着の用途を雨用、雪用と説明し、最後は「後悔用」。実用的な理由を並べた後で、買いすぎた自覚が理由の中へ紛れ込んでいます。", "video": "", "media": "media/word-233.mp4"}, {"number": 234, "word": "assume", "meaning": "確かめずにそう思う", "dialogue": [{"speaker": "A", "text": "Why did you assume he was the manager?"}, {"speaker": "B", "text": "He was holding a clipboard and looking disappointed."}], "translation": ["なぜ彼が責任者だと思い込んだの？", "記入板を持って、がっかりした顔をしていた。"], "explanation": "assume は「確かめずにそう思う」。クリップボードを持って不満そうな顔をしていたので、管理職だと決めつけています。肩書きではなく、職場でよく見る雰囲気だけから判断するステレオタイプの冗談です。", "video": "", "media": "media/word-234.mp4"}, {"number": 235, "word": "evidence", "meaning": "証拠", "dialogue": [{"speaker": "A", "text": "Where's the evidence that you baked this?"}, {"speaker": "B", "text": "The kitchen. Please don't call it a crime scene."}], "translation": ["これを焼いた証拠は？", "台所。事件現場とは呼ばないで。"], "explanation": "evidence は「証拠」。自分で焼いた証拠は台所の状態ですが、「犯罪現場と呼ばないで」と先回りします。完成品より散らかり方の方が雄弁で、料理の苦戦を物語っています。", "video": "", "media": "media/word-235.mp4"}, {"number": 236, "word": "exception", "meaning": "例外", "dialogue": [{"speaker": "A", "text": "Do you ever make an exception to your diet?"}, {"speaker": "B", "text": "Only on days that contain opportunities."}], "translation": ["食事制限に例外はある？", "機会のある日だけ。"], "explanation": "exception は「例外」。食事制限の例外を認めるのは「機会のある日だけ」。ほぼいつでも当てはまる条件なので、限定しているふりをしながら、実は広く抜け道を作っています。", "video": "", "media": "media/word-236.mp4"}, {"number": 237, "word": "consequence", "meaning": "結果・影響", "dialogue": [{"speaker": "A", "text": "What was the consequence of ignoring the instructions?"}, {"speaker": "B", "text": "We now have a rocking bookshelf."}], "translation": ["説明書を無視した結果は？", "揺り椅子ならぬ揺り本棚ができた。"], "explanation": "consequence は「結果・影響」。説明書を無視した結果、本棚がロッキングチェアのように揺れます。組み立ての失敗による不安定さを、新しい家具の機能のように言い換えています。", "video": "", "media": "media/word-237.mp4"}, {"number": 238, "word": "perspective", "meaning": "物の見方", "dialogue": [{"speaker": "A", "text": "Did traveling change your perspective?"}, {"speaker": "B", "text": "Yes. My tiny bathroom now seems like a luxury suite."}], "translation": ["旅行で物の見方は変わった？", "うん。狭い浴室が豪華な部屋に思える。"], "explanation": "perspective は「物の見方」。旅で視野が広がった成果が、自宅の小さな浴室を豪華に感じること。壮大な人生観の変化ではなく、旅先との比較で身近な設備の評価が変わっています。", "video": "", "media": "media/word-238.mp4"}, {"number": 239, "word": "potential", "meaning": "可能性・潜在能力", "dialogue": [{"speaker": "A", "text": "Does this house have potential?"}, {"speaker": "B", "text": "Absolutely. The roof could potentially stay on."}], "translation": ["この家には可能性がある？", "もちろん。屋根が残る可能性もある。"], "explanation": "potential は「可能性・潜在能力」。家に将来性があると言い、屋根も「残っている可能性がある」と続けます。魅力的な発展の余地を期待したのに、最低限の安全さえ不確かな様子です。", "video": "", "media": "media/word-239.mp4"}, {"number": 240, "word": "overwhelmed", "meaning": "圧倒されて・手一杯で", "dialogue": [{"speaker": "A", "text": "Why are you overwhelmed at the cafe?"}, {"speaker": "B", "text": "They asked what milk I wanted. I wasn't ready for a personality test."}], "translation": ["カフェでなぜ手一杯なの？", "ミルクを選べと言われた。性格診断の準備はない。"], "explanation": "overwhelmed は「圧倒されて・手一杯で」。カフェでミルクの種類を選ぶだけなのに、性格検査を受けるように圧倒されています。小さな選択にも個性や価値観が問われる気がする、選択肢の多さへの戸惑いです。", "video": "", "media": "media/word-240.mp4"}, {"number": 241, "word": "optimistic", "meaning": "楽観的な", "dialogue": [{"speaker": "A", "text": "You're optimistic about this traffic."}, {"speaker": "B", "text": "I packed dessert. Now it's a dinner reservation with wheels."}], "translation": ["この渋滞にも楽観的だね。", "デザートを持ってきた。車輪付きの夕食予約だよ。"], "explanation": "optimistic は「楽観的な」。渋滞で足止めされても、デザートを持参したので「車輪付きの夕食予約」だと考えます。動けない車内を食事の場所へ見立て、不便を楽しみに変える楽観です。", "video": "", "media": "media/word-241.mp4"}, {"number": 242, "word": "aloof", "meaning": "人と距離を置く", "dialogue": [{"speaker": "A", "text": "Is the new neighbor aloof?"}, {"speaker": "B", "text": "He waves using only one eyebrow."}], "translation": ["新しい隣人は距離を置く人？", "片眉だけで挨拶する。"], "explanation": "aloof は「人と距離を置く」。隣人は手を振る代わりに、片方の眉だけを動かして挨拶します。交流の動作を極限まで小さくすることで、人と距離を置く態度を描いています。", "video": "", "media": "media/word-242.mp4"}, {"number": 243, "word": "obstinate", "meaning": "意地を張って変えようとしない", "dialogue": [{"speaker": "A", "text": "Why is the captain being obstinate?"}, {"speaker": "B", "text": "He insists the map is wrong because the island is inconvenient."}], "translation": ["船長はなぜ意地を張るの？", "島が邪魔だから地図が間違っていると言う。"], "explanation": "obstinate は「意地を張って変えようとしない」。船長は島の場所が不便だから地図の方が間違いだと言い張ります。現実に計画を合わせるのでなく、都合の悪い現実を否定する頑固さです。", "video": "", "media": "media/word-243.mp4"}, {"number": 244, "word": "elated", "meaning": "大喜びして気分が高揚した", "dialogue": [{"speaker": "A", "text": "Why are you elated over an email?"}, {"speaker": "B", "text": "It said my package arrived. I forgot what I ordered. Double surprise."}], "translation": ["なぜメールで大喜びなの？", "荷物が届いた。注文を忘れてたから二重の驚き。"], "explanation": "elated は「大喜びして気分が高揚した」。荷物到着に大喜びし、注文内容を忘れていたので驚きも二倍だと言います。忘れっぽさを損ではなく、自分へのサプライズを増やす仕組みとして喜んでいます。", "video": "", "media": "media/word-244.mp4"}, {"number": 245, "word": "articulate", "meaning": "考えを明確に表現できる", "dialogue": [{"speaker": "A", "text": "Your child is remarkably articulate."}, {"speaker": "B", "text": "He presented a three-point argument against bedtime."}], "translation": ["お子さんは説明が上手だね。", "就寝時間への反論を三つの論点で述べた。"], "explanation": "articulate は「考えを明確に表現できる」。言葉を巧みに使う子どもが、就寝に反対する理由を3点に整理して発表します。大人の会議のような説明能力を、寝たくないという子どもらしい目的に使っています。", "video": "", "media": "media/word-245.mp4"}, {"number": 246, "word": "credible", "meaning": "信頼できる", "dialogue": [{"speaker": "A", "text": "Is his excuse credible?"}, {"speaker": "B", "text": "Not really. His train was delayed, but he works upstairs."}], "translation": ["彼の言い訳は信じられる？", "あまり。電車が遅れたらしいけど職場は上の階。"], "explanation": "credible は「信頼できる」。遅れた理由が電車の遅延なのに、職場はすぐ上の階。話し手たちの状況では電車に乗る必要がなさそうで、もっともらしい定番の言い訳が成立しません。", "video": "", "media": "media/word-246.mp4"}, {"number": 247, "word": "paradoxical", "meaning": "一見矛盾しているが意味のある", "dialogue": [{"speaker": "A", "text": "Isn't it paradoxical to work hard at relaxing?"}, {"speaker": "B", "text": "Yes. My relaxation coach gives homework."}], "translation": ["くつろぐために努力するのは矛盾してない？", "うん。リラックスの先生が宿題を出す。"], "explanation": "paradoxical は「一見矛盾しているが意味のある」。リラックスに懸命に取り組むだけでも矛盾気味なのに、その指導者から宿題まで出ます。休むことが新たな義務や仕事になる逆説を重ねています。", "video": "", "media": "media/word-247.mp4"}, {"number": 248, "word": "infer", "meaning": "手掛かりから推測する", "dialogue": [{"speaker": "A", "text": "What can you infer from these muddy footprints?"}, {"speaker": "B", "text": "Someone loves the garden more than the carpet."}], "translation": ["泥の足跡から何が推測できる？", "誰かが、じゅうたんより庭を愛している。"], "explanation": "infer は「手掛かりから推測する」。泥の足跡から、誰かがじゅうたんより庭を大切にしていると推測します。単に靴を汚した事実ではなく、家の中への気遣い不足まで遠回しに読み取っています。", "video": "", "media": "media/word-248.mp4"}, {"number": 249, "word": "flatter", "meaning": "お世辞で喜ばせる", "dialogue": [{"speaker": "A", "text": "Are you trying to flatter me?"}, {"speaker": "B", "text": "Only until you agree to drive me to the airport."}], "translation": ["お世辞で私を喜ばせようとしてる？", "空港まで送ると言ってくれるまでね。"], "explanation": "flatter は「お世辞で喜ばせる」。お世辞を言っているのかと聞かれ、空港まで送ってもらうまでだと即答。隠すはずの下心と有効期限をはっきり認める、率直すぎる返事です。", "video": "", "media": "media/word-249.mp4"}, {"number": 250, "word": "alleviate", "meaning": "苦痛や問題を軽くする", "dialogue": [{"speaker": "A", "text": "Did the cushion alleviate your back discomfort?"}, {"speaker": "B", "text": "Yes. Now the discomfort is in my wallet."}], "translation": ["クッションで腰のつらさは和らいだ？", "うん。つらさは財布へ移った。"], "explanation": "alleviate は「苦痛や問題を軽くする」。クッションで背中のつらさは和らいだものの、今度は財布が痛みます。高価な買い物による出費を身体の痛みになぞらえ、問題が場所を変えただけと表現しています。", "video": "", "media": "media/word-250.mp4"}, {"number": 251, "word": "irony", "meaning": "予想や言葉と現実の食い違い", "dialogue": [{"speaker": "A", "text": "What's the irony of your new job?"}, {"speaker": "B", "text": "I repair doorbells. Nobody hears me arrive."}], "translation": ["新しい仕事の皮肉な点は？", "ドアベル修理。訪問しても誰にも聞こえない。"], "explanation": "irony は「予想や言葉と現実の食い違い」。ドアベル修理の仕事なのに、到着しても気づいてもらえません。訪問先のベルは修理が必要な状態だから、職業の役目そのものが訪問時の障害になる皮肉です。", "video": "", "media": "media/word-251.mp4"}, {"number": 252, "word": "nuance", "meaning": "微妙な意味の違い", "dialogue": [{"speaker": "A", "text": "What's the nuance between fine and absolutely fine?"}, {"speaker": "B", "text": "About two hours of not speaking to me."}], "translation": ["「大丈夫」と「全く大丈夫」の微妙な違いは？", "口をきいてもらえない時間が約2時間違う。"], "explanation": "nuance は「微妙な意味の違い」。fine と absolutely fine の差を、口をきいてもらえない時間の差で説明します。どちらも大丈夫という言葉でも、この場面では強調するほど不満が強い含みになっています。", "video": "", "media": "media/word-252.mp4"}, {"number": 253, "word": "pessimistic", "meaning": "悲観的な", "dialogue": [{"speaker": "A", "text": "Why bring an umbrella to an indoor wedding?"}, {"speaker": "B", "text": "I'm pessimistic about both the weather and the roof."}], "translation": ["室内の結婚式になぜ傘？", "天気にも屋根にも悲観的なんだ。"], "explanation": "pessimistic は「悲観的な」。屋内の結婚式に傘を持参するのは、天気だけでなく屋根まで信用していないから。雨を避けられるはずの場所にも悪い可能性を想定する悲観の誇張です。", "video": "", "media": "media/word-253.mp4"}, {"number": 254, "word": "amiable", "meaning": "親しみやすく感じのよい", "dialogue": [{"speaker": "A", "text": "Your dentist seems amiable."}, {"speaker": "B", "text": "He chats so warmly while I'm completely unable to answer."}], "translation": ["歯医者さんは感じがいいね。", "返事が全くできない間、親しく話してくれる。"], "explanation": "amiable は「親しみやすく感じのよい」。歯科医は愛想よく話してくれますが、患者は治療中で返答できません。親しみやすい会話なのに一方通行という、診療室ならではの状況を描いています。", "video": "", "media": "media/word-254.mp4"}, {"number": 255, "word": "tenacious", "meaning": "粘り強く手放さない", "dialogue": [{"speaker": "A", "text": "That reporter is tenacious."}, {"speaker": "B", "text": "She followed the mayor into a costume shop. Now both are pirates."}], "translation": ["あの記者は粘り強いね。", "市長を衣装店まで追った。今は二人とも海賊。"], "explanation": "tenacious は「粘り強く手放さない」。記者が市長を衣装店まで追いかけた結果、二人とも海賊姿に。取材を諦めない粘り強さが、仕事に不似合いな格好まで引き受ける執念になっています。", "video": "", "media": "media/word-255.mp4"}, {"number": 256, "word": "ecstatic", "meaning": "有頂天の", "dialogue": [{"speaker": "A", "text": "Why was the dog ecstatic?"}, {"speaker": "B", "text": "The suitcase opened. It was full of tennis balls, not clothes."}], "translation": ["犬はなぜ有頂天なの？", "開いたスーツケースが服でなくボールでいっぱいだった。"], "explanation": "ecstatic は「有頂天の」。開いたスーツケースが服でなくテニスボールだらけで、犬は大喜び。人の旅行用品という予想を、犬にとっての宝箱へひっくり返しています。", "video": "", "media": "media/word-256.mp4"}, {"number": 257, "word": "eloquent", "meaning": "雄弁な", "dialogue": [{"speaker": "A", "text": "Was his apology eloquent?"}, {"speaker": "B", "text": "Very. I almost thanked him for breaking the vase."}], "translation": ["彼の謝罪は雄弁だった？", "とても。花瓶を割ってくれたことにお礼を言いかけた。"], "explanation": "eloquent は「雄弁な」。花瓶を割った人の謝罪があまりに見事で、被害者が礼を言いそうになります。謝る側と謝られる側の立場まで逆転させるほどの話術、という誇張です。", "video": "", "media": "media/word-257.mp4"}, {"number": 258, "word": "incredible", "meaning": "信じられないほどの", "dialogue": [{"speaker": "A", "text": "That was an incredible magic trick."}, {"speaker": "B", "text": "Yes. He made my entire entertainment budget disappear."}], "translation": ["すごい手品だったね。", "うん。娯楽費の予算を全部消した。"], "explanation": "incredible は「信じられないほどの」。手品師が消したのは物だけでなく、話し手の娯楽予算全部。高い鑑賞料金を「消失マジック」に見立て、驚きと出費への嘆きを重ねています。", "video": "", "media": "media/word-258.mp4"}, {"number": 259, "word": "contradictory", "meaning": "互いに矛盾する", "dialogue": [{"speaker": "A", "text": "Are these instructions contradictory?"}, {"speaker": "B", "text": "They say work independently, then ask permission for everything."}], "translation": ["この指示は矛盾してる？", "自主的に働け、でも全部許可を取れとある。"], "explanation": "contradictory は「互いに矛盾する」。自分で判断して働けと指示する一方、何をするにも許可を求めさせます。同時には満たしにくい二つの要求で、指示の矛盾が具体的に分かります。", "video": "", "media": "media/word-259.mp4"}, {"number": 260, "word": "deduce", "meaning": "事実から論理的に導く", "dialogue": [{"speaker": "A", "text": "How did you deduce that I ate the pie?"}, {"speaker": "B", "text": "There's a fork in your pocket and no pie in the kitchen."}], "translation": ["なぜ僕がパイを食べたと分かった？", "ポケットにフォーク、台所にパイがない。"], "explanation": "deduce は「事実から論理的に導く」。パイが消え、相手のポケットにはフォーク。この二つの手掛かりから食べた人を推理します。本人には謎でも、証拠があまりに分かりやすいところがオチです。", "video": "", "media": "media/word-260.mp4"}, {"number": 261, "word": "patronize", "meaning": "子ども扱いして見下す", "dialogue": [{"speaker": "A", "text": "Please don't patronize me."}, {"speaker": "B", "text": "Of course. That's a very big word you've learned."}], "translation": ["子ども扱いしないで。", "もちろん。難しい言葉を覚えたねえ。"], "explanation": "patronize は「子ども扱いして見下す」。見下した子ども扱いをやめてと言われ、相手は「難しい単語を覚えたね」と返します。まさにやめてほしい態度を繰り返し、単語の意味を行動で実演しています。", "video": "", "media": "media/word-261.mp4"}, {"number": 262, "word": "exacerbate", "meaning": "問題をさらに悪化させる", "dialogue": [{"speaker": "A", "text": "Did your advice exacerbate the argument?"}, {"speaker": "B", "text": "Possibly. I suggested they both calm down."}], "translation": ["助言で口論が悪化した？", "多分。二人とも落ち着けと言ったから。"], "explanation": "exacerbate は「問題をさらに悪化させる」。口論中の二人に「落ち着いて」と助言して、かえって悪化させたようです。穏やかにするつもりの言葉が、上から目線に響いて逆効果になる場面です。", "video": "", "media": "media/word-262.mp4"}, {"number": 263, "word": "sarcasm", "meaning": "皮肉な言い方", "dialogue": [{"speaker": "A", "text": "Was that sarcasm when you called my driving relaxing?"}, {"speaker": "B", "text": "We were facing the wrong way on a roundabout."}], "translation": ["僕の運転を快適と言ったのは皮肉？", "ロータリーで逆向きになっていたからね。"], "explanation": "sarcasm は「皮肉な言い方」。運転を「くつろげる」と言ったのは、環状交差点で逆方向を向いていたから。本当に安心したのではなく、怖い状況を反対の言葉で評する皮肉です。", "video": "", "media": "media/word-263.mp4"}, {"number": 264, "word": "implication", "meaning": "暗に示される意味", "dialogue": [{"speaker": "A", "text": "What's the implication of this gym gift card?"}, {"speaker": "B", "text": "Apparently, my sofa and I should see other people."}], "translation": ["このジムの商品券が暗に示す意味は？", "ソファと僕は距離を置くべきらしい。"], "explanation": "implication は「暗に示される意味」。ジムのギフト券に込められた意味を、ソファとの関係を見直せという勧めと解釈します。see other people は恋人同士の関係にも使う表現で、ソファを恋人扱いしています。", "video": "", "media": "media/word-264.mp4"}, {"number": 265, "word": "realistic", "meaning": "現実的な", "dialogue": [{"speaker": "A", "text": "Is your savings goal realistic?"}, {"speaker": "B", "text": "Yes. I'm saving enough to stop checking my savings."}], "translation": ["貯金の目標は現実的？", "うん。残高確認をやめられるくらい貯める。"], "explanation": "realistic は「現実的な」。貯金の目標額を数字ではなく、残高を気にせずに済む額と定めています。現実的だと答えながら、安心できるほどためたいという心理的な基準を示しています。", "video": "", "media": "media/word-265.mp4"}, {"number": 266, "word": "affable", "meaning": "気さくで話しやすい", "dialogue": [{"speaker": "A", "text": "The ticket inspector is affable."}, {"speaker": "B", "text": "Yes. He made my fine sound like an invitation."}], "translation": ["検札係は気さくだね。", "うん。罰金が招待状のように聞こえた。"], "explanation": "affable は「気さくで話しやすい」。検札員の物腰が柔らかすぎて、罰金の通知が招待のように聞こえます。不快な内容と感じのよい伝え方の落差で、人当たりの良さを誇張しています。", "video": "", "media": "media/word-266.mp4"}, {"number": 267, "word": "adamant", "meaning": "絶対に意見を変えない", "dialogue": [{"speaker": "A", "text": "She's adamant that we leave at six."}, {"speaker": "B", "text": "Then why are we still here at seven?"}], "translation": ["彼女は6時出発を絶対に譲らない。", "じゃあ、なぜ7時にもまだここにいるの？"], "explanation": "adamant は「絶対に意見を変えない」。6時出発を絶対に譲らなかったのに、7時でもまだその場にいます。主張の強さと実行できるかは別、という矛盾を短い質問で突いています。", "video": "", "media": "media/word-267.mp4"}, {"number": 268, "word": "euphoric", "meaning": "強い幸福感に包まれた", "dialogue": [{"speaker": "A", "text": "Why are you euphoric after doing laundry?"}, {"speaker": "B", "text": "Every sock came back with its partner."}], "translation": ["なぜ洗濯後にそんな幸福感？", "すべての靴下が相方と戻ってきた。"], "explanation": "euphoric は「強い幸福感に包まれた」。洗濯後、すべての靴下に相方がそろっていて有頂天に。片方が行方不明になる日常の困り事を前提に、小さな成功を大事件のように喜んでいます。", "video": "", "media": "media/word-268.mp4"}, {"number": 269, "word": "succinct", "meaning": "短く要点を押さえた", "dialogue": [{"speaker": "A", "text": "Can you give a succinct restaurant review?"}, {"speaker": "B", "text": "Lovely chairs. Bring food."}], "translation": ["簡潔にレストランを評価して？", "素敵な椅子。食料は持参。"], "explanation": "succinct は「短く要点を押さえた」。店の感想は「椅子は素敵。食べ物は持参を」。わずかな言葉で、内装は良いが料理は期待できないと伝えます。短さ自体が辛口の評価を際立たせています。", "video": "", "media": "media/word-269.mp4"}, {"number": 270, "word": "authentic", "meaning": "真正な", "dialogue": [{"speaker": "A", "text": "Is this an authentic medieval recipe?"}, {"speaker": "B", "text": "Apparently. Nobody at the table expects to live past forty."}], "translation": ["これは本物の中世のレシピ？", "らしいね。誰も40歳を超えて生きる気がしていない。"], "explanation": "authentic は「真正な」。中世の本格的なレシピと聞き、食卓の誰も40歳まで生きられそうにないと冗談を言います。料理の古さと昔の厳しい生活を結びつけた誇張で、寿命の史実を正確に説明する台詞ではありません。", "video": "", "media": "media/word-270.mp4"}, {"number": 271, "word": "inconsistent", "meaning": "一貫しない", "dialogue": [{"speaker": "A", "text": "Your dog training seems inconsistent."}, {"speaker": "B", "text": "Yesterday the sofa was forbidden. Today we share custody."}], "translation": ["犬のしつけに一貫性がないね。", "昨日は禁止のソファ、今日は共同所有。"], "explanation": "inconsistent は「一貫しない」。昨日は犬のソファ使用を禁止したのに、今日は共同で所有するような扱い。しつけのルールが変わる様子を、子どもの共同親権にも使う share custody で大げさに表しています。", "video": "", "media": "media/word-271.mp4"}, {"number": 272, "word": "discern", "meaning": "注意深く見分ける", "dialogue": [{"speaker": "A", "text": "Can you discern any difference between these wines?"}, {"speaker": "B", "text": "Yes. This one makes the waiter look more hopeful."}], "translation": ["このワインの違いを見分けられる？", "うん。こちらだと店員が期待した顔になる。"], "explanation": "discern は「注意深く見分ける」。ワインの違いを味で見分ける代わりに、店員の期待に満ちた顔で判断します。客に選んでほしい銘柄が表情に出ている、と読むと面白い会話です。", "video": "", "media": "media/word-272.mp4"}, {"number": 273, "word": "belittle", "meaning": "価値を低く扱う", "dialogue": [{"speaker": "A", "text": "Don't belittle my coin collection."}, {"speaker": "B", "text": "Sorry. I didn't realize small change was a career."}], "translation": ["僕の硬貨収集を軽く見ないで。", "ごめん。小銭が仕事だとは知らなかった。"], "explanation": "belittle は「価値を低く扱う」。コイン収集を軽んじるなと言われ、「小銭が職業だとは知らなかった」と返します。謝る形でもまた価値を小さく扱い、批判された態度を続けてしまいます。", "video": "", "media": "media/word-273.mp4"}, {"number": 274, "word": "aggravate", "meaning": "悪化させる", "dialogue": [{"speaker": "A", "text": "Will another email aggravate the situation?"}, {"speaker": "B", "text": "Only if you begin with as I already explained."}], "translation": ["もう一通送ると状況が悪くなる？", "「前にも説明しましたが」で始めればね。"], "explanation": "aggravate は「悪化させる」。追加メールでも、「すでに説明したとおり」で始めれば相手をさらに苛立たせそうです。説明内容より、相手を責める響きの前置きが事態を悪くするという会話です。", "video": "", "media": "media/word-274.mp4"}, {"number": 275, "word": "satire", "meaning": "笑いを使った社会批判", "dialogue": [{"speaker": "A", "text": "Is your play satire?"}, {"speaker": "B", "text": "Yes. The king taxes people for complaining about taxes."}], "translation": ["君の劇は風刺？", "うん。王が税金への苦情に税をかける。"], "explanation": "satire は「笑いを使った社会批判」。税金への不満にまで税金をかける王様を描きます。批判を封じながら利益にも変える権力の横暴を、極端な制度として見せる風刺です。", "video": "", "media": "media/word-275.mp4"}, {"number": 276, "word": "inference", "meaning": "手掛かりからの推論", "dialogue": [{"speaker": "A", "text": "What inference did you draw from the empty fridge?"}, {"speaker": "B", "text": "My teenager has returned from university."}], "translation": ["空の冷蔵庫から何を推論した？", "大学生の子どもが帰省した。"], "explanation": "inference は「手掛かりからの推論」。冷蔵庫が空になったのを見て、大学生の子が帰省したと推測します。本人を見なくても食欲の痕跡で分かる、家族ならではの推理です。", "video": "", "media": "media/word-276.mp4"}, {"number": 277, "word": "ambiguous", "meaning": "曖昧な", "dialogue": [{"speaker": "A", "text": "Was the invitation ambiguous?"}, {"speaker": "B", "text": "It said dress light. I arrived carrying a lamp."}], "translation": ["招待状は曖昧だった？", "軽い服で、とあった。照明を持って行ったよ。"], "explanation": "ambiguous は「曖昧な」。dress light を軽装で来る意味ではなく、light を照明の意味で捉えてランプを持参します。不自然な解釈をあえて選んだ言葉遊びで、普通の服装の指示としてランプが必要なわけではありません。", "video": "", "media": "media/word-277.mp4"}, {"number": 278, "word": "gregarious", "meaning": "人と集まるのが好きな", "dialogue": [{"speaker": "A", "text": "Your uncle is gregarious."}, {"speaker": "B", "text": "He made friends in an elevator. Now they have monthly dinners."}], "translation": ["おじさんは社交的だね。", "エレベーターで友達を作り、今は毎月食事会。"], "explanation": "gregarious は「人と集まるのが好きな」。エレベーターの短い時間で知り合った人と、毎月夕食を共にする仲になります。出会いの小ささから関係の深さへ急に飛ぶ展開で、社交性を誇張しています。", "video": "", "media": "media/word-278.mp4"}, {"number": 279, "word": "dogmatic", "meaning": "自分の考えを絶対視する", "dialogue": [{"speaker": "A", "text": "Is your brother dogmatic about coffee?"}, {"speaker": "B", "text": "He calls instant coffee a moral failure."}], "translation": ["お兄さんはコーヒーに独断的？", "インスタントを道徳的な失敗と呼ぶ。"], "explanation": "dogmatic は「自分の考えを絶対視する」。インスタントコーヒーを味の好みではなく、道徳上の失敗と断定します。自分の好みを絶対的な善悪の基準へ格上げする独断的な態度です。", "video": "", "media": "media/word-279.mp4"}, {"number": 280, "word": "despondent", "meaning": "希望を失い落ち込んだ", "dialogue": [{"speaker": "A", "text": "Why does the snowman look despondent?"}, {"speaker": "B", "text": "The forecast says spring has excellent attendance this week."}], "translation": ["雪だるまはなぜ希望を失った顔？", "今週は春が皆勤だという予報だから。"], "explanation": "despondent は「希望を失い落ち込んだ」。雪だるまが落ち込む理由は、今週は春が毎日出席しそうな予報だから。春を出席する人に見立て、暖かさで溶ける雪だるまにとっての悪い知らせを表しています。", "video": "", "media": "media/word-280.mp4"}, {"number": 281, "word": "concise", "meaning": "簡潔な", "dialogue": [{"speaker": "A", "text": "Make your resignation letter concise."}, {"speaker": "B", "text": "I wrote goodbye. Then added please return my mug."}], "translation": ["退職の手紙は簡潔にね。", "さようなら、と書き、マグを返してとも加えた。"], "explanation": "concise は「簡潔な」。簡潔な退職届を求められ「さようなら」だけにした後、マグカップ返却のお願いを足します。仕事の説明より自分の私物が気になってしまう、個人的な締めくくりです。", "video": "", "media": "media/word-281.mp4"}, {"number": 282, "word": "counterfeit", "meaning": "偽造された", "dialogue": [{"speaker": "A", "text": "How did you spot the counterfeit watch?"}, {"speaker": "B", "text": "The brand name had a spelling suggestion."}], "translation": ["偽の時計をどう見抜いた？", "ブランド名にスペル修正候補が出た。"], "explanation": "counterfeit は「偽造された」。時計のブランド名が誤字だらけで、スペル修正の候補まで付きそうです。有名ブランドらしい外見をまねても、基本的な綴りで偽物とばれる冗談です。", "video": "", "media": "media/word-282.mp4"}, {"number": 283, "word": "incompatible", "meaning": "両立できない", "dialogue": [{"speaker": "A", "text": "Are your schedules incompatible?"}, {"speaker": "B", "text": "Yes. She's a morning person, and I'm an after-lunch possibility."}], "translation": ["二人の予定は合わない？", "うん。彼女は朝型、僕は午後なら可能性がある型。"], "explanation": "incompatible は「両立できない」。彼女は朝型、話し手は昼食後なら動ける「かもしれない」人。単に夜型と対比せず、活動できること自体が不確実だとして予定の合わなさを強調しています。", "video": "", "media": "media/word-283.mp4"}, {"number": 284, "word": "scrutinize", "meaning": "細かく調べる", "dialogue": [{"speaker": "A", "text": "Why scrutinize the restaurant bill?"}, {"speaker": "B", "text": "They charged us for the view. We faced a wall."}], "translation": ["なぜ会計を細かく調べるの？", "景色代を取られた。見ていたのは壁だけど。"], "explanation": "scrutinize は「細かく調べる」。請求書に眺望料金があるのに、二人が向いていたのは壁。料金に見合う景色が存在しないため、細かく調べたくなるのが当然というオチです。", "video": "", "media": "media/word-284.mp4"}, {"number": 285, "word": "ridicule", "meaning": "ばかにして笑う", "dialogue": [{"speaker": "A", "text": "Did they ridicule your homemade hat?"}, {"speaker": "B", "text": "Yes, until it started raining. Then they requested building permits."}], "translation": ["手作り帽子を笑われた？", "うん。でも雨が降ったら建築許可を求めてきた。"], "explanation": "ridicule は「ばかにして笑う」。手作りの帽子を笑っていた人たちが、雨が降ると建築許可を求めます。帽子が建物級に大きく、雨宿りに役立つと分かったような、評価の急転換です。", "video": "", "media": "media/word-285.mp4"}, {"number": 286, "word": "mitigate", "meaning": "悪影響を和らげる", "dialogue": [{"speaker": "A", "text": "How will you mitigate the noise during repairs?"}, {"speaker": "B", "text": "We'll give the neighbors concert tickets. Very far away."}], "translation": ["工事の騒音の影響をどう軽減する？", "隣人にコンサート券をあげる。とても遠い所の。"], "explanation": "mitigate は「悪影響を和らげる」。工事騒音を和らげる方法は、防音ではなく近所の人を遠くのコンサートへ招待すること。音を減らさず、聞く人を遠ざけて苦情を避けようとしています。", "video": "", "media": "media/word-286.mp4"}, {"number": 287, "word": "paradox", "meaning": "一見矛盾した事柄", "dialogue": [{"speaker": "A", "text": "What's the paradox of your new planner?"}, {"speaker": "B", "text": "Planning my free time leaves me none."}], "translation": ["新しい手帳の矛盾は？", "自由時間の計画で自由時間がなくなる。"], "explanation": "paradox は「一見矛盾した事柄」。自由時間を確保するための手帳なのに、予定を立てる作業で自由時間がなくなります。目的を達成する手段が目的を壊す、分かりやすい逆説です。", "video": "", "media": "media/word-287.mp4"}, {"number": 288, "word": "premise", "meaning": "議論の前提", "dialogue": [{"speaker": "A", "text": "What's the premise of your budget?"}, {"speaker": "B", "text": "That future me earns more and wants fewer shoes."}], "translation": ["その予算の前提は？", "未来の私は収入が増え、靴が欲しくなくなる。"], "explanation": "premise は「議論の前提」。予算計画の前提は、未来の自分が今より稼ぎ、靴を欲しがらなくなること。確かな条件ではなく、都合のよい未来像に家計を任せているのがオチです。", "video": "", "media": "media/word-288.mp4"}, {"number": 289, "word": "literal", "meaning": "文字どおりの", "dialogue": [{"speaker": "A", "text": "He took bring a plate literally."}, {"speaker": "B", "text": "Yes. Beautiful plate. Absolutely nothing on it."}], "translation": ["彼は「一皿持参」を文字どおりに取った。", "うん。きれいな皿で、中身は何もなかった。"], "explanation": "literal は「文字どおりの」。bring a plate は、地域や集まりによって料理を一皿持ち寄る意味になります。それを文字どおり解釈し、美しい空皿だけ持参したので、主催者の意図と食い違いました。", "video": "", "media": "media/word-289.mp4"}, {"number": 290, "word": "introverted", "meaning": "内向的な", "dialogue": [{"speaker": "A", "text": "Is your sister introverted?"}, {"speaker": "B", "text": "She throws parties with a maximum capacity of herself."}], "translation": ["妹さんは内向的？", "定員一名、自分だけのパーティーを開く。"], "explanation": "introverted は「内向的な」。内向的な姉妹のパーティーは定員一人で、その一人は本人。人を招く催しを自分だけの時間に変えてしまう、極端な設定の冗談です。", "video": "", "media": "media/word-290.mp4"}, {"number": 291, "word": "opinionated", "meaning": "自説を強く押し通す", "dialogue": [{"speaker": "A", "text": "Is your barber opinionated?"}, {"speaker": "B", "text": "I requested a trim and got his economic forecast."}], "translation": ["床屋さんは自説を押し通す人？", "少し切ってと頼んだら経済予測が付いてきた。"], "explanation": "opinionated は「自説を強く押し通す」。散髪を頼んだだけなのに、理容師から経済見通しまで聞かされます。求められていない話題でも自分の意見を語りたがる様子を描いています。", "video": "", "media": "media/word-291.mp4"}, {"number": 292, "word": "dejected", "meaning": "がっかりして元気のない", "dialogue": [{"speaker": "A", "text": "Why is the magician dejected?"}, {"speaker": "B", "text": "His rabbit got better reviews than he did."}], "translation": ["手品師はなぜ落ち込んでいるの？", "ウサギの方が高い評価をもらった。"], "explanation": "dejected は「がっかりして元気のない」。手品師が落ち込むのは、芸をする本人よりウサギの評判がよかったから。努力した技術が動物の魅力に負けてしまう、少し切ない評価の逆転です。", "video": "", "media": "media/word-292.mp4"}, {"number": 293, "word": "verbose", "meaning": "言葉が多すぎる", "dialogue": [{"speaker": "A", "text": "Was his answer verbose?"}, {"speaker": "B", "text": "He described yes as a provisional absence of disagreement."}], "translation": ["彼の答えは言葉が多すぎた？", "「はい」を「暫定的な不一致の不在」と表現した。"], "explanation": "verbose は「言葉が多すぎる」。単に yes と言えば済む返事を、「暫定的に異論が存在しない状態」と長く言います。説明される単語どおり、台詞そのものが回りくどさの実例になっています。", "video": "", "media": "media/word-293.mp4"}, {"number": 294, "word": "superficial", "meaning": "表面的な", "dialogue": [{"speaker": "A", "text": "Was the apartment cleaning superficial?"}, {"speaker": "B", "text": "The dust is gone from anywhere a guest might photograph."}], "translation": ["部屋の掃除は表面だけ？", "客が写真を撮りそうな所のほこりは消えた。"], "explanation": "superficial は「表面的な」。掃除したのは、来客が写真に撮りそうな場所だけ。全体をきれいにするのでなく、外から見える印象だけ整える表面的な仕事です。", "video": "", "media": "media/word-294.mp4"}, {"number": 295, "word": "incongruous", "meaning": "場にそぐわない", "dialogue": [{"speaker": "A", "text": "What looked incongruous at the formal dinner?"}, {"speaker": "B", "text": "The penguin slippers under the host's tuxedo."}], "translation": ["正装の晩餐会で何が場違いだった？", "主催者のタキシードの下のペンギンスリッパ。"], "explanation": "incongruous は「場にそぐわない」。正装の夕食会で、主催者のタキシードの下にはペンギンのスリッパ。上半身の格式と足元のくつろいだ格好が、場違いな組み合わせになっています。", "video": "", "media": "media/word-295.mp4"}, {"number": 296, "word": "contemplate", "meaning": "じっくり考える", "dialogue": [{"speaker": "A", "text": "Why contemplate your sandwich for so long?"}, {"speaker": "B", "text": "I'm deciding which half deserves to be lunch."}], "translation": ["なぜサンドイッチをそんなに考え込むの？", "どちら半分を昼食にするべきか考えてる。"], "explanation": "contemplate は「じっくり考える」。サンドイッチを深く考え込んで見つめる理由は、どちら半分を昼食にするか決めるため。重大な思索のような態度を、ごく小さな選択に使っています。", "video": "", "media": "media/word-296.mp4"}, {"number": 297, "word": "reprimand", "meaning": "正式に厳しく注意する", "dialogue": [{"speaker": "A", "text": "Did the teacher reprimand you?"}, {"speaker": "B", "text": "Yes. Apparently, negotiating homework isn't a classroom skill."}], "translation": ["先生から厳しく注意された？", "うん。宿題の交渉は授業の技能じゃないらしい。"], "explanation": "reprimand は「正式に厳しく注意する」。宿題について交渉したら教師に叱られました。本人は交渉力を発揮したつもりでも、授業では課題を減らそうとしただけに見えるというすれ違いです。", "video": "", "media": "media/word-297.mp4"}, {"number": 298, "word": "rectify", "meaning": "誤りを正す", "dialogue": [{"speaker": "A", "text": "Did the bakery rectify the spelling on the cake?"}, {"speaker": "B", "text": "Yes. Now happy retirement is aimed at the right employee."}], "translation": ["店はケーキの綴りを直した？", "うん。退職祝いが正しい社員に向いた。"], "explanation": "rectify は「誤りを正す」。ケーキの文字を直した結果、ようやく正しい社員の退職を祝うことになります。小さな綴りの修正が、誰を送り出すかという大きな意味の違いに結びついています。", "video": "", "media": "media/word-298.mp4"}, {"number": 299, "word": "dilemma", "meaning": "どちらも難点のある選択", "dialogue": [{"speaker": "A", "text": "What's your dilemma?"}, {"speaker": "B", "text": "Accept the free kitten, or explain to my daughter why not."}], "translation": ["どんな難しい選択なの？", "子猫をもらうか、断る理由を娘に説明するか。"], "explanation": "dilemma は「どちらも難点のある選択」。無料の子猫を引き取るか、断る理由を娘に説明するかで悩みます。お金がかからなくても、家族を説得する難しさが選択を簡単にしてくれません。", "video": "", "media": "media/word-299.mp4"}, {"number": 300, "word": "fallacy", "meaning": "もっともらしい誤った論理", "dialogue": [{"speaker": "A", "text": "What's wrong with my argument?"}, {"speaker": "B", "text": "Buying shoes on sale doesn't mean buying more makes you richer."}], "translation": ["僕の理屈のどこが間違い？", "靴が特売でも、多く買えば金持ちになるわけじゃない。"], "explanation": "fallacy は「もっともらしい誤った論理」。値引き品を買えば節約になるとしても、買う量を増やせば裕福になるとは限りません。一個あたりの割安さを、支出全体が減ることと取り違えた理屈を突いています。", "video": "", "media": "media/word-300.mp4"}, {"number": 301, "word": "ironic", "meaning": "皮肉な", "dialogue": [{"speaker": "A", "text": "What's ironic about the office silence campaign?"}, {"speaker": "B", "text": "They announce it over the loudspeaker every hour."}], "translation": ["職場の静音運動の皮肉なところは？", "毎時、拡声器で告知すること。"], "explanation": "ironic は「皮肉な」。静かにする運動を、毎時間の館内放送で知らせています。静けさを促す方法自体が騒音になり、活動の目的を自ら妨げる皮肉です。", "video": "", "media": "media/word-301.mp4"}, {"number": 302, "word": "extroverted", "meaning": "外向的な", "dialogue": [{"speaker": "A", "text": "Your cousin is extroverted."}, {"speaker": "B", "text": "He introduced himself to everyone in the passport queue. Twice."}], "translation": ["いとこは外向的だね。", "旅券の列の全員に自己紹介した。2回も。"], "explanation": "extroverted は「外向的な」。いとこは旅券確認の行列全員に、しかも2回自己紹介します。普通は黙って待つ場面でも交流の機会にしてしまう、外向性の誇張です。", "video": "", "media": "media/word-302.mp4"}, {"number": 303, "word": "argumentative", "meaning": "議論や口論をしたがる", "dialogue": [{"speaker": "A", "text": "Is your roommate argumentative?"}, {"speaker": "B", "text": "He disputed the instructions on a shampoo bottle."}], "translation": ["同居人は議論好き？", "シャンプーの使い方に異議を唱えた。"], "explanation": "argumentative は「議論や口論をしたがる」。同居人はシャンプーボトルの使用説明にまで反論します。相手が人でなくても議論を始めたがるほど、言い争い好きな態度を描いています。", "video": "", "media": "media/word-303.mp4"}, {"number": 304, "word": "disillusioned", "meaning": "幻想が壊れて失望した", "dialogue": [{"speaker": "A", "text": "Why are you disillusioned with fame?"}, {"speaker": "B", "text": "My fan club wants me to bring the chairs."}], "translation": ["名声になぜ失望したの？", "ファンクラブが僕に椅子を運べと言う。"], "explanation": "disillusioned は「幻想が壊れて失望した」。有名になれば特別扱いされると思ったのに、ファンクラブから椅子運びを頼まれます。人気者への憧れと、普通の雑用をする現実との落差です。", "video": "", "media": "media/word-304.mp4"}, {"number": 305, "word": "long-winded", "meaning": "話が長たらしい", "dialogue": [{"speaker": "A", "text": "Was the speech long-winded?"}, {"speaker": "B", "text": "The opening remarks needed an intermission."}], "translation": ["演説は長たらしかった？", "冒頭の挨拶に休憩が必要だった。"], "explanation": "long-winded は「話が長たらしい」。演説は本題に入る前の挨拶だけで休憩が必要でした。単に長いと言わず、冒頭部分が一公演並みだったと誇張しています。", "video": "", "media": "media/word-305.mp4"}, {"number": 306, "word": "profound", "meaning": "深い洞察を含む", "dialogue": [{"speaker": "A", "text": "Was his final remark profound?"}, {"speaker": "B", "text": "He said life is short. Then charged us for another hour."}], "translation": ["最後の言葉は深かった？", "人生は短いと言い、追加の1時間分を請求した。"], "explanation": "profound は「深い洞察を含む」。「人生は短い」という深そうな言葉の直後に、さらに1時間分の料金を請求します。時間の貴重さを語りながら相手の時間とお金を使う態度への皮肉です。", "video": "", "media": "media/word-306.mp4"}, {"number": 307, "word": "disproportionate", "meaning": "釣り合わないほど大きい", "dialogue": [{"speaker": "A", "text": "Was your reaction disproportionate?"}, {"speaker": "B", "text": "It was the last biscuit. I think a formal inquiry is reasonable."}], "translation": ["反応が大げさすぎなかった？", "最後のビスケットだ。正式調査は妥当だよ。"], "explanation": "disproportionate は「釣り合わないほど大きい」。最後のビスケットをめぐって正式調査を要求します。本人には重要でも、ささいな出来事に公的な手続き級の反応をする釣り合わなさがオチです。", "video": "", "media": "media/word-307.mp4"}, {"number": 308, "word": "deliberate", "meaning": "慎重に検討する", "dialogue": [{"speaker": "A", "text": "Why deliberate over a sandwich order?"}, {"speaker": "B", "text": "One choice determines my entire afternoon personality."}], "translation": ["サンドイッチの注文をなぜ熟考するの？", "午後の人格すべてを左右する選択だから。"], "explanation": "deliberate は「慎重に検討する」。サンドイッチ選びが午後の人格すべてを決めると考え、慎重に検討します。小さな昼食の選択へ重大な決断並みの重さを与えています。", "video": "", "media": "media/word-308.mp4"}, {"number": 309, "word": "reproach", "meaning": "失望や非難を伝える", "dialogue": [{"speaker": "A", "text": "Did she reproach you for forgetting the anniversary?"}, {"speaker": "B", "text": "She simply handed me a calendar wrapped as a gift."}], "translation": ["記念日を忘れたことを責められた？", "ただ、包装したカレンダーを渡された。"], "explanation": "reproach は「失望や非難を伝える」。記念日忘れを言葉で責めず、カレンダーを贈り物として渡します。親切なプレゼントの形そのものが「次は忘れないで」という無言の非難です。", "video": "", "media": "media/word-309.mp4"}, {"number": 310, "word": "revamp", "meaning": "大きく改良する", "dialogue": [{"speaker": "A", "text": "How did you revamp the waiting room?"}, {"speaker": "B", "text": "We replaced old magazines with screens showing old magazines."}], "translation": ["待合室をどう改良したの？", "古い雑誌を、古い雑誌が映る画面に替えた。"], "explanation": "revamp は「大きく改良する」。待合室を刷新しても、古い雑誌を映す画面に置き換えただけ。機器は新しくなりましたが、退屈な中身は同じという、見かけだけの改装です。", "video": "", "media": "media/word-310.mp4"}, {"number": 311, "word": "conundrum", "meaning": "解くのが難しい問題", "dialogue": [{"speaker": "A", "text": "What's your latest conundrum?"}, {"speaker": "B", "text": "I need glasses to find the glasses I lost."}], "translation": ["最近の難問は？", "なくした眼鏡を探すのに眼鏡が必要なんだ。"], "explanation": "conundrum は「解くのが難しい問題」。なくした眼鏡を探すために、その眼鏡が必要です。解決に必要な道具自体が問題の対象になっている、身近な行き詰まりです。", "video": "", "media": "media/word-311.mp4"}, {"number": 312, "word": "analogy", "meaning": "似た関係を使ったたとえ", "dialogue": [{"speaker": "A", "text": "What's a good analogy for your inbox?"}, {"speaker": "B", "text": "A bathtub with three taps and no plug you can reach."}], "translation": ["受信箱をたとえると？", "蛇口が3個あり、栓に手が届かない浴槽。"], "explanation": "analogy は「似た関係を使ったたとえ」。受信箱を蛇口3つの浴槽に例え、止めようにも手が届きません。メールが流れ込み続けるのに制御できない感覚を、水が増える光景へ置き換えています。", "video": "", "media": "media/word-312.mp4"}, {"number": 313, "word": "sarcastic", "meaning": "皮肉を言う", "dialogue": [{"speaker": "A", "text": "Was your reply sarcastic?"}, {"speaker": "B", "text": "I said wonderful timing when the drill started during my call."}], "translation": ["あの返事は皮肉だった？", "電話中にドリルが始まり、最高のタイミングと言った。"], "explanation": "sarcastic は「皮肉を言う」。電話中にドリルの音が始まり「最高のタイミング」と言います。本心では最悪なので、言葉と実際の評価を反対にすることで不満を表しています。", "video": "", "media": "media/word-313.mp4"}, {"number": 314, "word": "eccentric", "meaning": "風変わりな", "dialogue": [{"speaker": "A", "text": "Is the professor eccentric?"}, {"speaker": "B", "text": "He names his umbrellas after forgotten philosophers."}], "translation": ["教授は風変わり？", "傘に忘れられた哲学者の名前を付けてる。"], "explanation": "eccentric は「風変わりな」。教授は傘に、忘れられた哲学者の名前を付けています。学問への関心が日用品の命名にまで及ぶ、風変わりで妙に凝った習慣が面白いところです。", "video": "", "media": "media/word-314.mp4"}, {"number": 315, "word": "belligerent", "meaning": "けんか腰の", "dialogue": [{"speaker": "A", "text": "Why is the customer belligerent?"}, {"speaker": "B", "text": "The self-checkout disagreed with his definition of one banana."}], "translation": ["なぜ客はけんか腰なの？", "セルフレジとバナナ1本の定義が合わなかった。"], "explanation": "belligerent は「けんか腰の」。セルフレジが「バナナ1本」の解釈を認めず、客がけんか腰になります。機械の判定を意見の対立として描き、買い物が口論になる様子を誇張しています。", "video": "", "media": "media/word-315.mp4"}, {"number": 316, "word": "disgruntled", "meaning": "不満を抱いた", "dialogue": [{"speaker": "A", "text": "Why are the employees disgruntled?"}, {"speaker": "B", "text": "The reward for excellent work was more excellent work."}], "translation": ["社員はなぜ不満なの？", "優秀な仕事への報酬が、さらに仕事だった。"], "explanation": "disgruntled は「不満を抱いた」。良い仕事の報酬が、さらに良い仕事を求められることでした。頑張れば負担が増えるだけなので、ご褒美が不満の原因になっています。", "video": "", "media": "media/word-316.mp4"}, {"number": 317, "word": "blunt", "meaning": "遠慮なく率直な", "dialogue": [{"speaker": "A", "text": "Was the review blunt?"}, {"speaker": "B", "text": "It said the best part was the exit sign."}], "translation": ["評価は遠慮がなかった？", "最高なのは出口の標識、とあった。"], "explanation": "blunt は「遠慮なく率直な」。作品の一番良かった部分が非常口の表示という批評。早く退出したかったという意味を隠さず、逃げ道だけを褒める辛辣さがオチです。", "video": "", "media": "media/word-317.mp4"}, {"number": 318, "word": "transparent", "meaning": "隠し事がなく明瞭な", "dialogue": [{"speaker": "A", "text": "Is the new pricing transparent?"}, {"speaker": "B", "text": "Perfectly. I can clearly see I can't afford it."}], "translation": ["新料金は分かりやすい？", "完璧に。払えないことがよく分かる。"], "explanation": "transparent は「隠し事がなく明瞭な」。値段が明確になったおかげで、買えないこともはっきり分かりました。透明性という良い改善が、客にとって嬉しい結果とは限らないという返答です。", "video": "", "media": "media/word-318.mp4"}, {"number": 319, "word": "negligible", "meaning": "無視できるほど小さい", "dialogue": [{"speaker": "A", "text": "Was the delivery delay negligible?"}, {"speaker": "B", "text": "Only if you measure lunch in geological time."}], "translation": ["配達の遅れはわずかだった？", "昼食を地質時代単位で測るならね。"], "explanation": "negligible は「無視できるほど小さい」。配達の遅れが無視できるのは、昼食を地質年代ほど長い尺度で測る場合だけ。普通には大幅な遅延を、極端な時間軸なら小さいと皮肉っています。", "video": "", "media": "media/word-319.mp4"}, {"number": 320, "word": "rationalize", "meaning": "もっともらしい理屈をつける", "dialogue": [{"speaker": "A", "text": "How do you rationalize that expensive blender?"}, {"speaker": "B", "text": "It's cheaper than opening my own juice company."}], "translation": ["高いミキサーをどう理屈づけるの？", "ジュース会社を開くより安いから。"], "explanation": "rationalize は「もっともらしい理屈をつける」。高価なミキサーを、ジュース会社を起業するより安いと正当化します。必要な買い物との比較ではなく、はるかに高額な選択肢を持ち出して安く見せています。", "video": "", "media": "media/word-320.mp4"}, {"number": 321, "word": "resent", "meaning": "不当だと感じて憤る", "dialogue": [{"speaker": "A", "text": "Do you resent doing all the dishes?"}, {"speaker": "B", "text": "No. I resent being called the dishwasher while doing them."}], "translation": ["全部の皿を洗うのが不満？", "いや。洗ってるときに食洗機と呼ばれるのが不満。"], "explanation": "resent は「不当だと感じて憤る」。皿洗いを全部することより、その最中に「食洗機」と呼ばれるのが嫌だと言います。手伝う人への感謝がなく、便利な機械扱いされる点に不満があります。", "video": "", "media": "media/word-321.mp4"}, {"number": 322, "word": "streamline", "meaning": "無駄を省いて効率化する", "dialogue": [{"speaker": "A", "text": "Did you streamline the approval process?"}, {"speaker": "B", "text": "Yes. Now only three people reject it instead of six."}], "translation": ["承認手順を効率化した？", "うん。却下する人が6人から3人になった。"], "explanation": "streamline は「無駄を省いて効率化する」。承認手続きを効率化して、却下する人数が6人から3人に減りました。承認されやすくなったとは言わず、否決までの手間だけ軽くなっています。", "video": "", "media": "media/word-322.mp4"}, {"number": 323, "word": "predicament", "meaning": "抜け出しにくい困った状況", "dialogue": [{"speaker": "A", "text": "What's your predicament?"}, {"speaker": "B", "text": "I told two friends I'm busy. They're both coming to the same cafe."}], "translation": ["どんな困った状況なの？", "友達二人に忙しいと言ったら、二人とも同じカフェに来る。"], "explanation": "predicament は「抜け出しにくい困った状況」。二人の友人に忙しいと断ったのに、その二人が同じカフェへ来ます。そこで過ごしている姿を見られると説明に困る、言い訳が自分を追い込む状況です。", "video": "", "media": "media/word-323.mp4"}, {"number": 324, "word": "discrepancy", "meaning": "一致するはずのものの食い違い", "dialogue": [{"speaker": "A", "text": "Why is there a discrepancy in the accounts?"}, {"speaker": "B", "text": "The calculator and I have different ideas about lunch expenses."}], "translation": ["なぜ会計に食い違いが？", "計算機と僕で昼食代の考え方が違う。"], "explanation": "discrepancy は「一致するはずのものの食い違い」。帳簿の食い違いを、自分と電卓の昼食代に対する考え方の違いと説明します。計算ミスや計上の問題を、道具との意見の相違へ言い換えています。", "video": "", "media": "media/word-324.mp4"}, {"number": 325, "word": "skeptical", "meaning": "懐疑的な", "dialogue": [{"speaker": "A", "text": "Are you skeptical about this miracle cleaner?"}, {"speaker": "B", "text": "The demonstration table was already clean."}], "translation": ["この万能洗剤を疑ってる？", "実演のテーブルは最初からきれいだった。"], "explanation": "skeptical は「懐疑的な」。奇跡の洗剤の実演に使うテーブルは、最初からきれいでした。汚れが落ちる証拠になっていないので、宣伝への疑いにはもっともな理由があります。", "video": "", "media": "media/word-325.mp4"}, {"number": 326, "word": "quirky", "meaning": "独特で少し変わった", "dialogue": [{"speaker": "A", "text": "What makes this hotel quirky?"}, {"speaker": "B", "text": "The room key also opens a mysterious cupboard downstairs."}], "translation": ["このホテルはどこが独特？", "部屋の鍵で階下の謎の戸棚も開く。"], "explanation": "quirky は「独特で少し変わった」。ホテルの風変わりな点は、客室の鍵で階下の謎の戸棚も開くこと。普通なら不安な鍵の不備を、個性的な魅力のように紹介しています。", "video": "", "media": "media/word-326.mp4"}, {"number": 327, "word": "hostile", "meaning": "敵意を持つ", "dialogue": [{"speaker": "A", "text": "Was the reception hostile?"}, {"speaker": "B", "text": "The welcome mat was turned face down."}], "translation": ["出迎えは敵意に満ちていた？", "歓迎マットが裏返されていた。"], "explanation": "hostile は「敵意を持つ」。歓迎マットが裏返されていて、文字どおり歓迎が見えません。もてなすはずの小道具を反転させ、敵対的な出迎えを視覚的に表しています。", "video": "", "media": "media/word-327.mp4"}, {"number": 328, "word": "indignant", "meaning": "不当なことに憤慨した", "dialogue": [{"speaker": "A", "text": "Why is he indignant about the parking ticket?"}, {"speaker": "B", "text": "He was only parked illegally for a very important coffee."}], "translation": ["なぜ駐車違反切符に憤慨してるの？", "とても大事なコーヒーのための違法駐車だったから。"], "explanation": "indignant は「不当なことに憤慨した」。違法駐車でも「とても重要なコーヒー」のためなら許されると思っています。個人的な都合を正当な理由とみなし、取り締まりに憤る身勝手さがオチです。", "video": "", "media": "media/word-328.mp4"}, {"number": 329, "word": "candid", "meaning": "隠さず率直な", "dialogue": [{"speaker": "A", "text": "Give me your candid opinion of my novel."}, {"speaker": "B", "text": "The bookmark was a welcome break."}], "translation": ["小説への率直な意見を聞かせて。", "しおりがありがたい休憩になった。"], "explanation": "candid は「隠さず率直な」。小説への率直な意見が、しおりを見ると休めて嬉しかったというもの。読むのを止める瞬間を褒めて、作品を読むのがつらかったと伝えています。", "video": "", "media": "media/word-329.mp4"}, {"number": 330, "word": "opaque", "meaning": "分かりにくく不透明な", "dialogue": [{"speaker": "A", "text": "Is the contract opaque?"}, {"speaker": "B", "text": "The explanation of the explanation has footnotes."}], "translation": ["契約は分かりにくい？", "説明の説明に脚注が付いてる。"], "explanation": "opaque は「分かりにくく不透明な」。契約書は説明の説明にまで脚注が必要なほど複雑です。分かりやすくするはずの補足も解説を要し、読んでも理解へ近づかない状況を誇張しています。", "video": "", "media": "media/word-330.mp4"}, {"number": 331, "word": "substantial", "meaning": "かなりの量や重要性がある", "dialogue": [{"speaker": "A", "text": "Was the breakfast substantial?"}, {"speaker": "B", "text": "I needed a map to find the toast under the eggs."}], "translation": ["朝食は十分な量だった？", "卵の下のトーストを探すのに地図が要った。"], "explanation": "substantial は「かなりの量や重要性がある」。朝食の卵が山盛りで、下のトーストを探すには地図が必要です。量の多さを探索作業にたとえて、大満足を通り越した盛り付けを描いています。", "video": "", "media": "media/word-331.mp4"}, {"number": 332, "word": "speculate", "meaning": "十分な根拠なしに推測する", "dialogue": [{"speaker": "A", "text": "Why speculate about the boss's mood?"}, {"speaker": "B", "text": "His email had a full stop. The office is holding its breath."}], "translation": ["なぜ上司の機嫌を推測するの？", "メールに句点があった。職場全体が息をのんでる。"], "explanation": "speculate は「十分な根拠なしに推測する」。上司のメールに句点が付いただけで、職場全体が緊張します。小さな文体の変化から怒りを読み取ろうとする、気にしすぎた憶測の様子です。", "video": "", "media": "media/word-332.mp4"}, {"number": 333, "word": "begrudge", "meaning": "人が得たものを快く思わない", "dialogue": [{"speaker": "A", "text": "Do you begrudge her the promotion?"}, {"speaker": "B", "text": "No. Just the chair that no longer squeaks."}], "translation": ["彼女の昇進をねたんでる？", "いや。きしまない椅子だけをねたんでる。"], "explanation": "begrudge は「人が得たものを快く思わない」。昇進そのものは妬まないが、きしまない椅子はうらやましいと言います。大きな地位より毎日の小さな快適さに、隠しきれない羨望が向いています。", "video": "", "media": "media/word-333.mp4"}, {"number": 334, "word": "simplify", "meaning": "単純にする", "dialogue": [{"speaker": "A", "text": "Can you simplify the recipe?"}, {"speaker": "B", "text": "Certainly. Step one: call a restaurant."}], "translation": ["レシピを簡単にできる？", "もちろん。手順1、レストランに電話。"], "explanation": "simplify は「単純にする」。レシピを簡単にすると、最初の手順が店に電話することになります。調理工程を減らすどころか、自分で料理すること自体を省いてしまいました。", "video": "", "media": "media/word-334.mp4"}, {"number": 335, "word": "loophole", "meaning": "規則の抜け穴", "dialogue": [{"speaker": "A", "text": "Did you find a loophole in the no-pets rule?"}, {"speaker": "B", "text": "It doesn't mention imaginary dragons. Mine needs a parking space."}], "translation": ["ペット禁止の抜け穴を見つけた？", "空想の竜には触れてない。うちのには駐車場が必要。"], "explanation": "loophole は「規則の抜け穴」。ペット禁止規則に想像上の竜は書かれていないと抜け穴を主張し、駐車場まで要求します。存在しない生き物のために現実の設備が必要になる、不条理な交渉です。", "video": "", "media": "media/word-335.mp4"}, {"number": 336, "word": "anomaly", "meaning": "通常から外れたもの", "dialogue": [{"speaker": "A", "text": "What was the anomaly in this month's report?"}, {"speaker": "B", "text": "One meeting finished early. We're investigating."}], "translation": ["今月の報告の異常な点は？", "会議が一つ早く終わった。調査中だ。"], "explanation": "anomaly は「通常から外れたもの」。月次報告の異常値は、会議が一度早く終わったこと。好ましい出来事なのに調査対象になるほど珍しい、と普段の長い会議を皮肉っています。", "video": "", "media": "media/word-336.mp4"}, {"number": 337, "word": "spontaneous", "meaning": "思い付きの、自発的な", "dialogue": [{"speaker": "A", "text": "Was the holiday spontaneous?"}, {"speaker": "B", "text": "Yes. We planned nothing, including where to sleep."}], "translation": ["休暇は思い付きだった？", "うん。寝る場所を含め何も計画しなかった。"], "explanation": "spontaneous は「思い付きの、自発的な」。思い立って旅に出た自由さを語りつつ、泊まる場所まで無計画でした。気軽さという長所と、準備不足という困り事が同じ行動の両面になっています。", "video": "", "media": "media/word-337.mp4"}, {"number": 338, "word": "impulsive", "meaning": "衝動的な", "dialogue": [{"speaker": "A", "text": "Was buying a kayak impulsive?"}, {"speaker": "B", "text": "Maybe. I live on the twelfth floor, nowhere near water."}], "translation": ["カヤック購入は衝動的だった？", "多分。水辺から遠い12階に住んでる。"], "explanation": "impulsive は「衝動的な」。水辺から遠い建物の12階に住む人が、勢いでカヤックを購入しました。使い道や運搬を考えず欲しさを優先したことが、住環境との落差で分かります。", "video": "", "media": "media/word-338.mp4"}, {"number": 339, "word": "abrasive", "meaning": "言動がきつく人を不快にさせる", "dialogue": [{"speaker": "A", "text": "Is the new coach abrasive?"}, {"speaker": "B", "text": "He calls encouragement a waste of breath."}], "translation": ["新コーチは言い方がきつい？", "励ましを息の無駄と呼ぶ。"], "explanation": "abrasive は「言動がきつく人を不快にさせる」。コーチは励ましを「息の無駄」と切り捨てます。選手を支えるはずの指導者が、優しい言葉そのものを否定する厳しすぎる態度です。", "video": "", "media": "media/word-339.mp4"}, {"number": 340, "word": "irate", "meaning": "激怒した", "dialogue": [{"speaker": "A", "text": "Why is the customer irate?"}, {"speaker": "B", "text": "The complaint hotline put him on hold with cheerful whistling."}], "translation": ["客はなぜ激怒してるの？", "苦情窓口が陽気な口笛で保留にした。"], "explanation": "irate は「激怒した」。苦情を伝えたいのに待たされ、保留音は陽気な口笛。解決してもらえない苛立ちと、場違いに明るい音の対比が怒りをさらに強めています。", "video": "", "media": "media/word-340.mp4"}, {"number": 341, "word": "forthright", "meaning": "はっきり物を言う", "dialogue": [{"speaker": "A", "text": "Was the architect forthright about the costs?"}, {"speaker": "B", "text": "He asked which kidney I was less attached to."}], "translation": ["建築家は費用をはっきり話した？", "どちらの腎臓に愛着が薄いか聞かれた。"], "explanation": "forthright は「はっきり物を言う」。建築費を率直に伝えるため、手放してよい腎臓はどちらかと聞きます。身体の一部を売らないと払えないほど高い、という比喩的な誇張で、実際の提案ではありません。", "video": "", "media": "media/word-341.mp4"}, {"number": 342, "word": "conspicuous", "meaning": "人目を引く", "dialogue": [{"speaker": "A", "text": "Was your disguise conspicuous?"}, {"speaker": "B", "text": "Only the neon hat and the cape attracted attention."}], "translation": ["変装は目立った？", "蛍光色の帽子とマントだけが注目された。"], "explanation": "conspicuous は「人目を引く」。変装で目立ったのは蛍光色の帽子とマント「だけ」と言います。人目を避けたいはずの格好が、むしろ視線を集める物ばかりという矛盾です。", "video": "", "media": "media/word-342.mp4"}, {"number": 343, "word": "incremental", "meaning": "少しずつ増える", "dialogue": [{"speaker": "A", "text": "Are you making incremental progress?"}, {"speaker": "B", "text": "Yes. I moved the exercise bike closer to the socket."}], "translation": ["少しずつ進歩してる？", "うん。運動用自転車をコンセントに近づけた。"], "explanation": "incremental は「少しずつ増える」。運動の少しずつの進歩として、エアロバイクをコンセントへ近づけたと報告します。まだ運動していない準備の一歩を、成果として大きく扱っています。", "video": "", "media": "media/word-343.mp4"}, {"number": 344, "word": "corroborate", "meaning": "別の証拠で裏づける", "dialogue": [{"speaker": "A", "text": "Can anyone corroborate your story?"}, {"speaker": "B", "text": "The parrot can. Unfortunately, he also knows the earlier version."}], "translation": ["話を裏づける人はいる？", "オウムなら。でも前の版の話も覚えてる。"], "explanation": "corroborate は「別の証拠で裏づける」。話の裏付けをオウムに頼めますが、オウムは前に話した別の版も覚えています。証人が都合のよい証言だけをするとは限らず、むしろ嘘が露見しそうです。", "video": "", "media": "media/word-344.mp4"}, {"number": 345, "word": "retaliate", "meaning": "仕返しする", "dialogue": [{"speaker": "A", "text": "Did you retaliate after the prank?"}, {"speaker": "B", "text": "I changed his ringtone to my voice saying behave yourself."}], "translation": ["いたずらに仕返しした？", "着信音を「お行儀よく」と言う僕の声に替えた。"], "explanation": "retaliate は「仕返しする」。いたずらへの仕返しは、相手の着信音を自分の「行儀よくしなさい」という声に変えること。電話のたびに注意されるようにする、日常に入り込む報復です。", "video": "", "media": "media/word-345.mp4"}, {"number": 346, "word": "complicate", "meaning": "複雑にする", "dialogue": [{"speaker": "A", "text": "Will adding another app complicate things?"}, {"speaker": "B", "text": "No. We also have an app to manage the apps."}], "translation": ["アプリを増やすと複雑にならない？", "大丈夫。アプリを管理するアプリもある。"], "explanation": "complicate は「複雑にする」。アプリを増やすと複雑になる心配に、管理用アプリもあると答えます。複雑さを減らすためにまた一つ増やすので、解決策が同じ問題を繰り返しています。", "video": "", "media": "media/word-346.mp4"}, {"number": 347, "word": "bureaucracy", "meaning": "複雑な役所的手続き", "dialogue": [{"speaker": "A", "text": "Was opening the club account bureaucratic?"}, {"speaker": "B", "text": "We needed a committee to approve the committee's signature."}], "translation": ["部の口座開設は手続きが複雑だった？", "委員会の署名を承認する委員会が必要だった。"], "explanation": "bureaucracy は「複雑な役所的手続き」。委員会の署名を承認するため、さらに委員会が必要になります。手続きを進める手続きが増え、目的から遠ざかる官僚的な仕組みを誇張しています。", "video": "", "media": "media/word-347.mp4"}, {"number": 348, "word": "ambiguity", "meaning": "複数に解釈できる曖昧さ", "dialogue": [{"speaker": "A", "text": "What's the ambiguity in see you next Friday?"}, {"speaker": "B", "text": "Whether I have seven days or fourteen to find an excuse."}], "translation": ["「次の金曜に」の曖昧さは？", "言い訳を考える猶予が7日か14日か。"], "explanation": "ambiguity は「複数に解釈できる曖昧さ」。next Friday は文脈や話し手によって、直近かその次の金曜か迷うことがあります。ここでは予定確認より、断る口実を考える時間が何日あるかを気にしています。", "video": "", "media": "media/word-348.mp4"}, {"number": 349, "word": "reluctant", "meaning": "気が進まない", "dialogue": [{"speaker": "A", "text": "Why are you reluctant to try karaoke?"}, {"speaker": "B", "text": "My shower has asked me to stop singing."}], "translation": ["なぜカラオケに気が進まないの？", "シャワーから歌うのをやめてと頼まれた。"], "explanation": "reluctant は「気が進まない」。カラオケに気が進まない理由は、シャワーにさえ歌うのをやめてと言われたから。物が苦情を言うほどの歌声という、自己評価の低さを表す擬人化です。", "video": "", "media": "media/word-349.mp4"}, {"number": 350, "word": "reckless", "meaning": "向こう見ずな", "dialogue": [{"speaker": "A", "text": "Was that a reckless purchase?"}, {"speaker": "B", "text": "It was a white sofa. We have three toddlers."}], "translation": ["それは無謀な買い物だった？", "白いソファだ。幼児が3人いる。"], "explanation": "reckless は「向こう見ずな」。幼児が3人いる家で白いソファを買いました。汚れやすい状況が目に見えているのに選んだので、危険な冒険でなく家具選びを「無謀」と評しています。", "video": "", "media": "media/word-350.mp4"}, {"number": 351, "word": "patronizing", "meaning": "恩着せがましく上から接する", "dialogue": [{"speaker": "A", "text": "Was the guide patronizing?"}, {"speaker": "B", "text": "He called our questions adorable. We're all engineers."}], "translation": ["案内人は上から目線だった？", "質問がかわいらしいと言った。全員技術者なのに。"], "explanation": "patronizing は「恩着せがましく上から接する」。全員技術者なのに、ガイドは質問を「かわいらしい」と扱います。知識ある大人の問いを子どものように受け止める、褒め言葉に隠れた見下しです。", "video": "", "media": "media/word-351.mp4"}, {"number": 352, "word": "irritable", "meaning": "いら立ちやすい", "dialogue": [{"speaker": "A", "text": "Why are you irritable this morning?"}, {"speaker": "B", "text": "My coffee machine is making tea noises."}], "translation": ["今朝はなぜいら立ちやすいの？", "コーヒーメーカーが紅茶みたいな音を出してる。"], "explanation": "irritable は「いら立ちやすい」。朝から苛立つ理由を、コーヒーマシンがお茶の音を出すからと説明します。音で飲み物が分かるという妙な言い方で、コーヒーへの強い期待と神経質さを描いています。", "video": "", "media": "media/word-352.mp4"}, {"number": 353, "word": "evasive", "meaning": "答えをはぐらかす", "dialogue": [{"speaker": "A", "text": "Was his answer evasive?"}, {"speaker": "B", "text": "I asked when he'd pay. He described the concept of time."}], "translation": ["彼の答えははぐらかしていた？", "支払日を聞いたら、時間の概念を説明した。"], "explanation": "evasive は「答えをはぐらかす」。返済時期を聞いたのに、返ってきたのは時間という概念の説明。具体的な日付を言わず哲学的な話へ逃げる、露骨なはぐらかしです。", "video": "", "media": "media/word-353.mp4"}, {"number": 354, "word": "inconspicuous", "meaning": "目立たない", "dialogue": [{"speaker": "A", "text": "I wanted an inconspicuous entrance."}, {"speaker": "B", "text": "Then why did you arrive with a fog machine?"}], "translation": ["目立たず登場したかった。", "じゃあ、なぜ煙の機械を持って来たの？"], "explanation": "inconspicuous は「目立たない」。目立たず入場したいと言いながら、煙を出す装置を持って登場します。舞台演出のような準備が希望と正反対で、言葉と行動の矛盾を突かれています。", "video": "", "media": "media/word-354.mp4"}, {"number": 355, "word": "drastic", "meaning": "大幅で急激な", "dialogue": [{"speaker": "A", "text": "Was deleting every app a drastic solution?"}, {"speaker": "B", "text": "Yes. Now my phone just makes phone calls. Disturbing."}], "translation": ["全アプリ削除は思い切った解決だった？", "うん。電話が電話しかできない。不穏だ。"], "explanation": "drastic は「大幅で急激な」。全アプリを削除したら、携帯電話が電話だけをする道具になりました。それを不穏に感じる反応で、本来の機能だけでは落ち着かない現代の感覚を笑いにしています。", "video": "", "media": "media/word-355.mp4"}, {"number": 356, "word": "substantiate", "meaning": "証拠を示して実証する", "dialogue": [{"speaker": "A", "text": "Can you substantiate your claim that you're organized?"}, {"speaker": "B", "text": "Certainly. The proof is in a folder I can't find."}], "translation": ["几帳面だという主張を実証できる？", "もちろん。証拠は見つからないフォルダーの中。"], "explanation": "substantiate は「証拠を示して実証する」。整理上手だという主張を証明する資料は、見つからないフォルダーの中。証拠を出そうとする時点で整理できていないことが示され、主張が自滅しています。", "video": "", "media": "media/word-356.mp4"}, {"number": 357, "word": "reconcile", "meaning": "仲直りさせる", "dialogue": [{"speaker": "A", "text": "Did the siblings reconcile?"}, {"speaker": "B", "text": "Yes. They agreed the real enemy was bedtime."}], "translation": ["きょうだいは仲直りした？", "うん。本当の敵は就寝時間だと合意した。"], "explanation": "reconcile は「仲直りさせる」。きょうだいが仲直りできたのは、共通の敵が就寝時間だと合意したから。互いの争いをやめ、寝たくない気持ちで団結する子どもらしい和解です。", "video": "", "media": "media/word-357.mp4"}, {"number": 358, "word": "undermine", "meaning": "徐々に弱める", "dialogue": [{"speaker": "A", "text": "Does checking every detail undermine trust?"}, {"speaker": "B", "text": "Of course not. Let me verify who told you that."}], "translation": ["細部の確認は信頼を損なう？", "まさか。誰に聞いたのか確認させて。"], "explanation": "undermine は「徐々に弱める」。細かい確認が信頼を損なうか聞かれ、否定しながら情報源を確認し始めます。疑っていないと言いつつ疑う行動をするので、質問への実演になっています。", "video": "", "media": "media/word-358.mp4"}, {"number": 359, "word": "hierarchy", "meaning": "上下関係の仕組み", "dialogue": [{"speaker": "A", "text": "What's the hierarchy in your house?"}, {"speaker": "B", "text": "The cat, the baby, the coffee machine, then us."}], "translation": ["家の上下関係は？", "猫、赤ちゃん、コーヒーメーカー、その後が私たち。"], "explanation": "hierarchy は「上下関係の仕組み」。家庭内の序列では、猫、赤ちゃん、コーヒーマシンより大人が下です。世話や要求に応える側ほど立場が弱い、という家庭の力関係を冗談にしています。", "video": "", "media": "media/word-359.mp4"}, {"number": 360, "word": "uncertainty", "meaning": "確かでないこと", "dialogue": [{"speaker": "A", "text": "How do you deal with uncertainty?"}, {"speaker": "B", "text": "I label all my plans probably."}], "translation": ["不確実さにどう対処する？", "すべての予定に「多分」と付ける。"], "explanation": "uncertainty は「確かでないこと」。不確実さへの対策は、すべての予定に「たぶん」と書くこと。状況を確実にするのではなく、約束の強さを下げて外れた時に備えています。", "video": "", "media": "media/word-360.mp4"}, {"number": 361, "word": "meticulous", "meaning": "細部まで注意深い", "dialogue": [{"speaker": "A", "text": "Your packing list is meticulous."}, {"speaker": "B", "text": "I even listed the pen used to check the list."}], "translation": ["持ち物リストが細かいね。", "確認に使うペンまで書き込んだ。"], "explanation": "meticulous は「細部まで注意深い」。荷造りリストには、確認に使うペンまで載っています。準備をするための道具も準備項目に含める、細部への徹底したこだわりです。", "video": "", "media": "media/word-361.mp4"}, {"number": 362, "word": "prudent", "meaning": "先を考えて慎重な", "dialogue": [{"speaker": "A", "text": "Was buying extra batteries prudent?"}, {"speaker": "B", "text": "Yes. Now we're ready for device
