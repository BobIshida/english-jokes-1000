const items=[{"video": "1pwwOdJWxh0", "number": 1, "word": "bored / boring", "tone": "", "media": "media/001.mp4", "scenes": [{"label": "TWO WORDS. ONE MIX-UP.", "en": "bored / boring", "jp": "「退屈している」と「退屈させる」"}, {"label": "THE MIX-UP / A", "en": "I'm boring.", "jp": "私って、退屈な人なの。"}, {"label": "THE MIX-UP / B", "en": "Don't be so hard on yourself.", "jp": "そんなに自分を悪く言わないで。"}, {"label": "THE CORRECTION / A", "en": "I mean, I'm bored!", "jp": "違うの、退屈しているの！"}, {"label": "THE TWIST / B", "en": "Oh, good. I thought this was your introduction.", "jp": "よかった。自己紹介かと思ったよ。"}, {"label": "THE DIFFERENCE", "en": "bored = how you feel\nboring = how you make others feel", "jp": "bored：自分が退屈している\nboring：人を退屈させる\n「暇だ」と言ったつもりが、\n「つまらない人」と自己紹介。"}]}, {"video": "WkSxP8-Fq_k", "number": 2, "word": "borrow / lend", "tone": "", "media": "media/002.mp4", "scenes": [{"label": "TWO WORDS. ONE MIX-UP.", "en": "borrow / lend", "jp": "似ている英語、違う使い方"}, {"label": "THE MIX-UP / A", "en": "Can you borrow me twenty dollars?", "jp": "20ドル、私に借りてくれる？"}, {"label": "THE MIX-UP / B", "en": "You want me to borrow money for you?", "jp": "君のために僕が借金するの？"}, {"label": "THE CORRECTION / A", "en": "I mean, lend me twenty dollars.", "jp": "違う、20ドル貸して。"}, {"label": "THE TWIST / B", "en": "Good. One of us being broke is enough.", "jp": "よかった。金欠は一人で十分だよ。"}, {"label": "THE DIFFERENCE", "en": "borrow = receive temporarily\nlend = give temporarily", "jp": "borrow：借りる\nlend：貸す\nお金を貸してほしいのに、\n相手に借金を頼むことに。"}]}, {"video": "yHH12rsw5FE", "number": 3, "word": "say / tell", "tone": "", "media": "media/003.mp4", "scenes": [{"label": "TWO WORDS. ONE MIX-UP.", "en": "say / tell", "jp": "似ている英語、違う使い方"}, {"label": "THE MIX-UP / A", "en": "Say a joke!", "jp": "ジョークを言って！"}, {"label": "THE MIX-UP / B", "en": "A joke.", "jp": "ジョーク。"}, {"label": "THE CORRECTION / A", "en": "I mean, tell me a joke.", "jp": "違う、ジョークを聞かせて。"}, {"label": "THE TWIST / B", "en": "That was my shortest one.", "jp": "今のが僕の最短のジョークだよ。"}, {"label": "THE DIFFERENCE", "en": "say the words\ntell a joke", "jp": "say：言葉を口にする\ntell a joke：ジョークを話す\nジョークを頼んだら、\n「ジョーク」のひと言だけ！"}]}, {"video": "HeBO0M0O8IE", "number": 4, "word": "actually / currently", "tone": "", "media": "media/004.mp4", "scenes": [{"label": "TWO WORDS. ONE MIX-UP.", "en": "actually / currently", "jp": "似ている英語、違う使い方"}, {"label": "THE MIX-UP / A", "en": "I actually work at the bakery.", "jp": "実は、パン屋で働いています。"}, {"label": "THE MIX-UP / B", "en": "Was that a secret?", "jp": "それ、秘密だったの？"}, {"label": "THE CORRECTION / A", "en": "I mean, I currently work there.", "jp": "今そこで働いている、という意味。"}, {"label": "THE TWIST / B", "en": "Right. Your apron already gave you away.", "jp": "そうだね。エプロンでバレてたよ。"}, {"label": "THE DIFFERENCE", "en": "actually = in fact\ncurrently = at present", "jp": "actually：実は・実際には\ncurrently：現在は\n今の仕事を伝えたつもりが、\n秘密の告白に。"}]}, {"video": "_nDG0PkLP8o", "number": 5, "word": "bring / take", "tone": "", "media": "media/005.mp4", "scenes": [{"label": "TWO WORDS. ONE MIX-UP.", "en": "bring / take", "jp": "似ている英語、違う使い方"}, {"label": "A LITTLE CONVERSATION / A", "en": "I'm at the office. Bring me the cake.", "jp": "会社にいるから、ケーキを持ってきて。"}, {"label": "A LITTLE CONVERSATION / B", "en": "I took it home instead.", "jp": "代わりに家に持っていったよ。"}, {"label": "A LITTLE CONVERSATION / A", "en": "Why did you do that?", "jp": "どうして？"}, {"label": "A LITTLE CONVERSATION / B", "en": "My house needed a birthday too.", "jp": "うちにも誕生日が必要だったから。"}, {"label": "THE DIFFERENCE", "en": "bring it here / take it there", "jp": "ここへ持ってくる／そこへ持っていく\n行き先を変えたら、ケーキまでお引っ越し。"}]}, {"video": "RJA1lPGA4Wo", "number": 6, "word": "hear / listen", "tone": "", "media": "media/006.mp4", "scenes": [{"label": "TWO WORDS. ONE MIX-UP.", "en": "hear / listen", "jp": "似ている英語、違う使い方"}, {"label": "A LITTLE CONVERSATION / A", "en": "Did you hear my alarm?", "jp": "目覚まし、聞こえた？"}, {"label": "A LITTLE CONVERSATION / B", "en": "Yes. Did you listen to my advice?", "jp": "うん。僕の忠告は聞いた？"}, {"label": "A LITTLE CONVERSATION / A", "en": "About going is chair?", "jp": "この椅子、買うの？　売るの？"}, {"label": "A LITTLE CONVERSATION / B", "en": "Selling. Would you like to buy it?", "jp": "売るんです。買いませんか？"}, {"label": "A LITTLE CONVERSATION / A", "en": "No. I just sat down.", "jp": "いや、座っただけです。"}, {"label": "A LITTLE CONVERSATION / B", "en": "Excellent. A free test drive.", "jp": "いいですね。無料の試乗です。"}, {"label": "THE DIFFERENCE", "en": "buy: pay to get / sell: give for money", "jp": "buy：お金を払って買う\nsell：お金と引き換えに売る\n休憩していたら、商品のお試し客に。"}]}, {"video": "UBl3YQuYmiA", "number": 10, "word": "win / beat", "tone": "", "media": "media/010.mp4", "scenes": [{"label": "TWO WORDS. ONE MIX-UP.", "en": "win / beat", "jp": "似ている英語、違う使い方"}, {"label": "A LITTLE CONVERSATION / A", "en": "I beat my brother!", "jp": "弟に勝ったよ！"}, {"label": "A LITTLE CONVERSATION / B", "en": "Did you win the race?", "jp": "レースで優勝したの？"}, {"label": "A LITTLE CONVERSATION / A", "en": "No. We were both last.", "jp": "いや、二人とも最下位争い。"}, {"label": "A LITTLE CONVERSATION / B", "en": "A very private championship.", "jp": "ずいぶん身内だけの選手権だね。"}, {"label": "THE DIFFERENCE", "en": "beat an opponent / win a race", "jp": "相手を負かす／レースに勝つ\n弟には勝った。でも優勝とは限らない。"}]}, {"video": "4yyFfFo4_1Y", "number": 11, "word": "remember / remind", "tone": "", "media": "media/011.mp4", "scenes": [{"label": "TWO WORDS. ONE MIX-UP.", "en": "remember / remind", "jp": "似ている英語、違う使い方"}, {"label": "A LITTLE CONVERSATION / A", "en": "Remind me to buy a notebook.", "jp": "ノートを買うのを思い出させて。"}, {"label": "A LITTLE CONVERSATION / B", "en": "Will you remember why?", "jp": "何のためか覚えていられる？"}, {"label": "A LITTLE CONVERSATION / A", "en": "To write down things I forget.", "jp": "忘れることを書いておくため。"}, {"label": "A LITTLE CONVERSATION / B", "en": "I'll put that on my list too.", "jp": "それも僕のリストに書いておくよ。"}, {"label": "THE DIFFERENCE", "en": "remember it / remind someone", "jp": "自分が覚えている／人に思い出させる\n忘れ物対策を、二人で覚えておく羽目に。"}]}, {"video": "0WlwF5zdgTg", "number": 12, "word": "lose / miss", "tone": "", "media": "media/012.mp4", "scenes": [{"label": "TWO WORDS. ONE MIX-UP.", "en": "lose / miss", "jp": "似ている英語、違う使い方"}, {"label": "A LITTLE CONVERSATION / A", "en": "I lost the bus!", "jp": "バスをなくした！"}, {"label": "A LITTLE CONVERSATION / B", "en": "Were you responsible for it?", "jp": "君が管理してたの？"}, {"label": "A LITTLE CONVERSATION / A", "en": "I mean, I missed the bus.", "jp": "乗り遅れた、ってこと。"}, {"label": "A LITTLE CONVERSATION / B", "en": "Good. That's less paperwork.", "jp": "よかった。そのほうが書類が少ない。"}, {"label": "THE DIFFERENCE", "en": "lose your keys / miss your bus", "jp": "鍵をなくす／バスに乗り遅れる\n乗り遅れが、バス紛失事件に。"}]}, {"video": "Eb65KLirv5k", "number": 13, "word": "find / look for", "tone": "", "media": "media/013.mp4", "scenes": [{"label": "TWO WORDS. ONE MIX-UP.", "en": "find / look for", "jp": "似ている英語、違う使い方"}, {"label": "A LITTLE CONVERSATION / A", "en": "Have you found my glasses?", "jp": "私の眼鏡、見つかった？"}, {"label": "A LITTLE CONVERSATION / B", "en": "I'm looking for them.", "jp": "探しているところ。"}, {"label": "A LITTLE CONVERSATION / A", "en": "Try looking at my face.", "jp": "私の顔を見てみて。"}, {"label": "A LITTLE CONVERSATION / B", "en": "Found them. Excellent hiding place.", "jp": "あった。見事な隠し場所だね。"}, {"label": "THE DIFFERENCE", "en": "look for: search / find: discover", "jp": "look for：探す／find：見つける\n探していた眼鏡は、本人の顔の上。"}]}, {"video": "kLRm17PZJvQ", "number": 14, "word": "leave / forget", "tone": "", "media": "media/014.mp4", "scenes": [{"label": "TWO WORDS. ONE MIX-UP.", "en": "leave / forget", "jp": "似ている英語、違う使い方"}, {"label": "A LITTLE CONVERSATION / A", "en": "I forgot my umbrella.", "jp": "傘を忘れた。"}, {"label": "A LITTLE CONVERSATION / B", "en": "Where did you leave it?", "jp": "どこに置いてきたの？"}, {"label": "A LITTLE CONVERSATION / A", "en": "At the umbrella shop.", "jp": "傘屋さん。"}, {"label": "A LITTLE CONVERSATION / B", "en": "At least it has company.", "jp": "少なくとも仲間はいるね。"}, {"label": "THE DIFFERENCE", "en": "forget to bring / leave at a place", "jp": "持ってくるのを忘れる／場所に置いてくる\n置き忘れた傘は、仲間に囲まれている。"}]}, {"video": "rj5Cb7Djs_k", "number": 15, "word": "tone": "", "media": "media/094.mp4", "scenes": [{"label": "TWO WORDS. ONE MIX-UP.", "en": "look after / look for", "jp": "似ている英語、違う使い方"}, {"label": "A LITTLE CONVERSATION / A", "en": "Can you look after my cat?", "jp": "猫の世話をしてくれる？"}, {"label": "A LITTLE CONVERSATION / B", "en": "Sure. Where is it?", "jp": "いいよ。どこ？"}, {"label": "A LITTLE CONVERSATION / A", "en": "I don't know.", "jp": "分からない。"}, {"label": "A LITTLE CONVERSATION / B", "en": "Then I'll look for it first.", "jp": "じゃあ、まず探すね。"}, {"label": "THE DIFFERENCE", "en": "look after: care for / look for: search", "jp": "look after：世話をする\nlook for：探す\nお世話係の最初の仕事は、捜索。"}]}, {"video": "5njwrEkwP0c", "number": 95, "word": "look up / look down on", "tone": "", "media": "media/095.mp4", "scenes": [{"label": "TWO WORDS. ONE MIX-UP.", "en": "look up / look down on", "jp": "似ている英語、違う使い方"}, {"label": "A LITTLE CONVERSATION / A", "en": "Do you look down on beginners?", "jp": "初心者を見下してるの？"}, {"label": "A LITTLE CONVERSATION / B", "en": "No. I look up words for them.", "jp": "いや。単語を調べてあげてる。"}, {"label": "A LITTLE CONVERSATION / A", "en": "Even easy words?", "jp": "簡単な単語も？"}, {"label": "A LITTLE CONVERSATION / B", "en": "Especially the ones I don't know.", "jp": "特に、僕も知らない単語をね。"}, {"label": "THE DIFFERENCE", "en": "look down on: disrespect / look up: consult", "jp": "look down on：見下す\nlook up：辞書などで調べる\n教える側も、こっそり一緒に勉強。"}]}, {"video": "hvFLFIaioV0", "number": 96, "word": "put off / take off", "tone": "", "media": "media/096.mp4", "scenes": [{"label": "TWO WORDS. ONE MIX-UP.", "en": "put off / take off", "jp": "似ている英語、違う使い方"}, {"label": "A LITTLE CONVERSATION / A", "en": "Take off your coat.", "jp": "コートを脱いで。"}, {"label": "A LITTLE CONVERSATION / B", "en": "Can I put off the meeting instead?", "jp": "代わりに会議を延期できる？"}, {"label": "A LITTLE CONVERSATION / A", "en": "Why?", "jp": "どうして？"}, {"label": "A LITTLE CONVERSATION / B", "en": "My pajamas are underneath.", "jp": "下がパジャマなんだ。"}, {"label": "THE DIFFERENCE", "en": "take off clothes / put off an event", "jp": "服を脱ぐ／予定を延期する\n脱ぐのが困るので、会議ごと延期したい。"}]}, {"video": "JIMX_W8ijNA", "number": 97, "word": "run out of / run into", "tone": "", "media": "media/097.mp4", "scenes": [{"label": "TWO WORDS. ONE MIX-UP.", "en": "run out of / run into", "jp": "似ている英語、違う使い方"}, {"label": "A LITTLE CONVERSATION / A", "en": "I ran into my teacher at the shop.", "jp": "店で先生にばったり会った。"}, {"label": "A LITTLE CONVERSATION / B", "en": "Did you talk?", "jp": "話した？"}, {"label": "A LITTLE CONVERSATION / A", "en": "Yes, until I ran out of excuses.", "jp": "うん。言い訳が尽きるまで。"}, {"label": "A LITTLE CONVERSATION / B", "en": "About the homework?", "jp": "宿題のこと？"}, {"label": "THE DIFFERENCE", "en": "run into: meet by chance / run out of: use up", "jp": "run into：偶然会う\nrun out of：使い果たす\n偶然の出会いで、言い訳の在庫切れ。"}]}, {"video": "xsWrUi0vUIk", "number": 98, "word": "check in / check out", "tone": "", "media": "media/098.mp4", "scenes": [{"label": "TWO WORDS. ONE MIX-UP.", "en": "check in / check out", "jp": "似ている英語、違う使い方"}, {"label": "A LITTLE CONVERSATION / A", "en": "I'd like to check out.", "jp": "チェックアウトしたいです。"}, {"label": "A LITTLE CONVERSATION / B", "en": "But you just checked in.", "jp": "今チェックインしたばかりですよ。"}, {"label": "A LITTLE CONVERSATION / A", "en": "I saw the minibar prices.", "jp": "ミニバーの値段を見たので。"}, {"label": "A LITTLE CONVERSATION / B", "en": "That was a very short holiday.", "jp": "ずいぶん短い休暇でしたね。"}, {"label": "THE DIFFERENCE", "en": "check in: arrival / check out: departure", "jp": "到着の手続き／退出の手続き\n滞在の決め手は、部屋より飲み物の値段。"}]}, {"video": "-u98JLqtuj8", "number": 99, "word": "take care / take care of", "tone": "", "media": "media/099.mp4", "scenes": [{"label": "TWO WORDS. ONE MIX-UP.", "en": "take care / take care of", "jp": "似ている英語、違う使い方"}, {"label": "A LITTLE CONVERSATION / A", "en": "Take care!", "jp": "気をつけてね！"}, {"label": "A LITTLE CONVERSATION / B", "en": "Thanks. Will you take care of my plant?", "jp": "ありがとう。植物の世話をしてくれる？"}, {"label": "A LITTLE CONVERSATION / A", "en": "Of course. How often should I water it?", "jp": "もちろん。水やりはどのくらい？"}, {"label": "A LITTLE CONVERSATION / B", "en": "Never. It's plastic.", "jp": "一度も要らない。プラスチック製だよ。"}, {"label": "THE DIFFERENCE", "en": "take care: be careful / take care of: care for", "jp": "気をつける／〜の世話をする\n世話を頼まれた植物は、水やり不要。"}]}, {"video": "7uy7yWgYCOw", "number": 100, "word": "would like / like", "tone": "", "media": "media/100.mp4", "scenes": [{"label": "TWO WORDS. ONE MIX-UP.", "en": "would like / like", "jp": "似ている英語、違う使い方"}, {"label": "A LITTLE CONVERSATION / A", "en": "Do you like coffee?", "jp": "コーヒーは好き？"}, {"label": "A LITTLE CONVERSATION / B", "en": "Yes, but I'd like tea today.", "jp": "うん。でも今日は紅茶がいい。"}, {"label": "A LITTLE CONVERSATION / A", "en": "I already made coffee.", "jp": "もうコーヒーを入れちゃった。"}, {"label": "A LITTLE CONVERSATION / B", "en": "Then I'd like a more patient waiter.", "jp": "じゃあ、もっと待てる店員さんがいいな。"}, {"label": "THE DIFFERENCE", "en": "like: general preference / would like: current wish", "jp": "like：一般的な好み\nwould like：今の希望・丁寧な注文\n好みを聞いただけで、注文まで決められた。"}]}];const el=id=>document.getElementById(id);let current=items[0];
function list(){const q=el('search').value.trim().toLowerCase().replace(/^#/,'');const found=items.filter(x=>!q||(/^\d+$/.test(q)?x.number===Number(q):[x.word,x.tone,...x.scenes.map(s=>s.jp)].join(' ').toLowerCase().includes(q)));el('count').textContent=`${found.length} / ${items.length}件`;el('empty').hidden=!!found.length;el('list').replaceChildren(...found.map(x=>{const b=document.createElement('button');b.textContent=`${String(x.number).padStart(3,'0')} ${x.word}`;b.setAttribute('aria-current',String(x===current));b.onclick=()=>choose(x.number,true);return b;}));}
function choose(n,update=false){current=items.find(x=>x.number===n)||items[0];el('word').textContent=current.word;el('tone').textContent=current.tone;el('number').textContent=`EXPRESSION ${String(current.number).padStart(3,'0')} / ${items.length}`;el('direct').href=current.video?`https://www.youtube.com/watch?v=${current.video}`:current.media;el('prev').disabled=current.number===1;el('next').disabled=current.number===items.length;el('scenes').replaceChildren(...current.scenes.map((s,i)=>{const section=document.createElement('section');const neutral=s.label.includes('NEUTRAL');const meaning=s.label==='THE MEANING'||s.label==='WHEN TO USE IT';section.className='scene'+(neutral?' neutral':meaning?' meaning':'');const h=document.createElement('h3');h.textContent=s.label==='THE DIFFERENCE'?'意味の違い':s.label.includes('FUNNY')?'笑いどころ':meaning?'意味・使い方':i===0?'今回の表現':s.label.includes(' / ')?s.label.split(' / ').pop()+' のセリフ':s.label;const en=document.createElement('p');en.lang='en';en.textContent=s.en;const jp=document.createElement('p');jp.className='jp';jp.textContent=s.jp;section.append(h,en,jp);return section;}));const b=document.createElement('button');b.textContent=current.video?'YouTubeプレーヤーを表示':'▶ 動画を再生';b.onclick=()=>{if(current.video){const f=document.createElement('iframe');f.title=current.word;f.src=`https://www.youtube-nocookie.com/embed/${current.video}?autoplay=0&playsinline=1&loop=1&playlist=${current.video}`;f.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';f.allowFullscreen=true;f.referrerPolicy='strict-origin-when-cross-origin';el('player').replaceChildren(f);return;}const v=document.createElement('video');v.controls=true;v.loop=true;v.playsInline=true;v.src=current.media;v.setAttribute('aria-label',current.word);el('player').replaceChildren(v);v.play().catch(()=>{});};el('player').replaceChildren(b);if(current.video)b.onclick();if(update)history.pushState(null,'',`#expression-${current.number}`);list();}
el('search').oninput=list;el('prev').onclick=()=>choose(current.number-1,true);el('next').onclick=()=>choose(current.number+1,true);function fromHash(){choose(Number(location.hash.match(/^#expression-(\d+)$/)?.[1])||1);}addEventListener('popstate',fromHash);addEventListener('hashchange',fromHash);fromHash();
</script></body></html>
